# Timing of DROID gear insertion, which runs on Newton, with zero_action and no cameras.
kpi_exporters: [timing]

shared:
  environment:
    type: gear_insertion
    embodiment: droid_abs_ik
    enable_cameras: false
  environment_builder:
    num_envs: 16
    seed: 42
    placement_seed: 42
  policy:
    type: zero_action
  rollout_limit:
    num_steps: 300
  num_rebuilds: 1

runs:
  gear_insertion: {}

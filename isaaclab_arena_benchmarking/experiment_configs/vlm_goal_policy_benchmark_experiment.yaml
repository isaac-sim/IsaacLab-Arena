# VLM agent benchmark: how often the goal policy calls the VLM and how long the rollout waits on it.
# The goal policy drives each predicted goal pose for up to 30 steps before calling the VLM again.
# The chunk and goal VLM policy benchmark Experiments share the scene, seeds, model and episodes,
# so their KPIs compare the two execution strategies.
#
# Run inside the Arena runtime with NV_API_KEY set; every episode sends requests to the hosted endpoint:
# /isaac-sim/python.sh isaaclab_arena/evaluation/experiment_runner.py --viz none \
#   --experiment_config isaaclab_arena_benchmarking/experiment_configs/vlm_goal_policy_benchmark_experiment.yaml
#
# The timing KPIs hold the VLM timers under step/policy_inference:
# - vlm_inference: one entry per step that waited on the VLM, including response-validation retries.
# - vlm_inference/vlm_requests: one entry per round of concurrent requests; with num_envs: 1, one VLM call
#   plus any transport retries.
kpi_exporters: [success_rate, timing]

shared:
  environment:
    type: pick_and_place_maple_table
    enable_cameras: true
    embodiment: droid_abs_ik
    pick_up_object: rubiks_cube_hot3d_robolab
    destination_location: bowl_ycb_robolab
    hdr: home_office_robolab
  environment_builder:
    # One environment, so each VLM call is timed on its own instead of alongside concurrent requests.
    num_envs: 1
    seed: 42
    placement_seed: 42
    language_instruction: >-
      Pick up the Rubik's cube and place it in the bowl.
      Approach with the gripper open, close around the object, lift it,
      move above the destination, and open to release.
  policy:
    type: isaaclab_arena_vlm_agent.vlm_agent_policy.VLMGoalPolicy
    endpoint: internal
    vlm_embodiment_adapter: droid
    observation_modality: image_state
    max_steps_per_goal: 30
  rollout_limit:
    num_episodes: 10

runs:
  vlm_goal_pnp: {}

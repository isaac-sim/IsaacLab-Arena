# Placement success benchmark: one Run per KitchenBench spec in isaaclab_arena_environments/kitchen_bench/.
# Each Run builds its spec for 30 environments, which fills the placement pool, then takes one zero-action step.
# The Run writes the build's placement diagnostics to placement_diagnostics_rebuild0.json in its output directory.
shared:
  environment_builder:
    num_envs: 30
  policy:
    type: zero_action
  rollout_limit:
    num_steps: 1

# Each Run has its own placement seed, 100000 apart, so Runs that share a scene solve different candidates.
# With the default placer parameters, a build uses at most
# num_envs * min_unique_layouts_per_env * max_placement_attempts**2 = 15000 consecutive seeds.
# All rebuilds of a Run get its seed, so a second rebuild would solve the same candidates.
runs:
  kitchen_bench_lightwheel_open_cabinet_u_shaped_with_island_farmhouse2:
    environment:
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_lightwheel_open_cabinet_u_shaped_with_island_farmhouse2.yaml
    environment_builder:
      placement_seed: 0
  kitchen_bench_lightwheel_open_freezer_g_shaped_large_scandinavian:
    environment:
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_lightwheel_open_freezer_g_shaped_large_scandinavian.yaml
    environment_builder:
      placement_seed: 100000
  kitchen_bench_lightwheel_open_fridge:
    environment:
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_lightwheel_open_fridge.yaml
    environment_builder:
      placement_seed: 200000

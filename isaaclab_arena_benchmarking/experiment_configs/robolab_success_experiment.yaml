# Success rate of pi05 on 5 varied RoboLab tasks: place on a surface, place in a container, tabletop, small and large objects.
# Each task is expected to have a success rate above 0 with pi05.
kpi_exporters: [success_rate, timing]

shared:
  environment:
    enable_cameras: true
  environment_builder:
    num_envs: 10
  rollout_limit:
    num_episodes: 20

runs:

  robolab_banana_on_plate_pi0:
    environment:
      type: isaaclab_arena_environments/robolab/tasks/banana_on_plate.yaml
    policy: &openpi_policy
      type: isaaclab_arena_openpi.policy.pi0_remote_policy.Pi0RemotePolicy
      policy_variant: pi05
      policy_device: cuda:0
      remote_host: 127.0.0.1
      remote_port: 8000
      openpi_embodiment_adapter: droid

  robolab_bowl_in_bin_pi0:
    environment:
      type: isaaclab_arena_environments/robolab/tasks/bowl_in_bin.yaml
    policy: *openpi_policy

  robolab_big_pumpkin_in_bin_pi0:
    environment:
      type: isaaclab_arena_environments/robolab/tasks/big_pumpkin_in_bin.yaml
    policy: *openpi_policy

  robolab_mouse_on_keyboard_pi0:
    environment:
      type: isaaclab_arena_environments/robolab/tasks/mouse_on_keyboard.yaml
    policy: *openpi_policy

  robolab_clamp_in_right_bin_pi0:
    environment:
      type: isaaclab_arena_environments/robolab/tasks/clamp_in_right_bin.yaml
    policy: *openpi_policy

# Timing of the DROID deformable pick-and-place task on Newton, with zero_action. The same file with
# `experiment_cfg.shared.environment.pick_object=deformable_cube_physx` gives the PhysX baseline, so the two
# benchmark entries that use it are comparable.
kpi_exporters: [timing]

shared:
  environment:
    type: droid_deformable_pick_and_place
    pick_object: deformable_cube_newton
    embodiment: droid_abs_joint_pos
    enable_cameras: false
  environment_builder:
    num_envs: 16
    env_spacing: 2.5
    seed: 42
    placement_seed: 42
  policy:
    type: zero_action
  rollout_limit:
    num_steps: 300
  num_rebuilds: 1

runs:
  deformable_pick_and_place: {}

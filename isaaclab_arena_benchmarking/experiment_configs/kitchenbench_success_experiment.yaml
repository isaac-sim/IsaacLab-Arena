# Success rate of pi05 on 5 varied KitchenBench tasks: open a fixture and place objects, in different kitchen layouts.
# Each task is expected to have a success rate above 0 with pi05.
kpi_exporters: [success_rate, timing]

shared:
  environment:
    enable_cameras: true
  environment_builder:
    num_envs: 10
  rollout_limit:
    num_episodes: 20

runs:

  kitchen_bench_open_fridge_pi0:
    environment:
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_lightwheel_open_fridge.yaml
    policy: &openpi_policy
      type: isaaclab_arena_openpi.policy.pi0_remote_policy.Pi0RemotePolicy
      policy_variant: pi05
      policy_device: cuda:0
      remote_host: 127.0.0.1
      remote_port: 8000
      openpi_embodiment_adapter: droid

  kitchen_bench_open_microwave_pi0:
    environment:
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_lightwheel_open_microwave.yaml
    policy: *openpi_policy

  kitchen_bench_pick_and_place_pi0:
    environment:
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_lightwheel_pick_and_place.yaml
    policy: *openpi_policy

  kitchen_bench_u_shape_bowl_sink_pi0:
    environment:
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_replicator_u_shape_bowl_sink.yaml
    policy: *openpi_policy

  kitchen_bench_g_shape_banana_bowl_pi0:
    environment:
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_replicator_g_shape_banana_bowl.yaml
    policy: *openpi_policy

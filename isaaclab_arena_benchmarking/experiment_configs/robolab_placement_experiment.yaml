# Placement success benchmark: one Run per RoboLab task spec in isaaclab_arena_environments/robolab/tasks/.
# Each Run builds its spec for 30 environments, which fills the placement pool, then takes one zero-action step.
# The Run writes the build's placement diagnostics to placement_diagnostics_rebuild0.json in its output directory.
shared:
  environment_builder:
    num_envs: 30
  policy:
    type: zero_action
  rollout_limit:
    num_steps: 1

# Each Run has its own placement seed, 100000 apart, so Runs that share a scene solve different candidates.
# A build uses at most num_envs * min_unique_layouts_per_env * max_placement_attempts**2 seeds: 15000 here.
# All rebuilds of a Run get its seed, so a second rebuild would solve the same candidates.
runs:
  apple_and_yogurt_in_bowl:
    environment:
      type: isaaclab_arena_environments/robolab/tasks/apple_and_yogurt_in_bowl.yaml
    environment_builder:
      placement_seed: 0
  bagels_on_plate:
    environment:

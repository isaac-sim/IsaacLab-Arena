# VLM agent benchmark: how often the chunk policy calls the VLM and how long it waits, with 4 environments.
kpi_exporters: [success_rate, timing]

shared:
  environment:
    type: pick_and_place_maple_table
    enable_cameras: true
    embodiment: droid_abs_ik
    pick_up_object: rubiks_cube_hot3d_robolab
    destination_location: bowl_ycb_robolab
    hdr: home_office_robolab
  environment_builder:
    # Fewer than the policy's max_concurrent_requests, so every environment's request is sent at once.
    num_envs: 4
    seed: 42
    placement_seed: 42
    language_instruction: >-
      Pick up the Rubik's cube and place it in the bowl.
      Approach with the gripper open, close around the object, lift it,
      move above the destination, and open to release.
  policy:
    type: isaaclab_arena_vlm_agent.vlm_agent_policy.VLMChunkPolicy
    endpoint: internal
    model: openai/openai/gpt-6-astra
    vlm_embodiment_adapter: droid
    observation_modality: image_state
    chunk_size: 3
  rollout_limit:
    # Shared by the 4 environments; each new episode starts on whichever environment finishes first.
    num_episodes: 12

runs:
  vlm_chunk_pnp_parallel_envs: {}

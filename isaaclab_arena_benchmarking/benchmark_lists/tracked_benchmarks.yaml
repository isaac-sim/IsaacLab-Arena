# Benchmarks used for KPI tracking. KPIs are always aggregated over all Runs of an Experiment, so a benchmark that
# tracks one Run removes the other Runs with overrides. An Experiment's kpi_exporters field selects which registered KPI
# exporters (under isaaclab_arena_benchmarking/benchmarks) export its KPIs.
benchmarks:
  # getting_started_experiment.yaml has four Runs; keep baseline only. Video recording is
  # disabled because the default recording fails on cameraless environments on OSMO.
  # TODO(dtingdahl) re-visit this list and add more relevant benchmarks
  - name: smoke-single-run
    experiment_cfg: isaaclab_arena_environments/experiment_configs/getting_started_experiment.yaml
    overrides:
      - experiment_cfg.shared.rollout_limit.num_episodes=2
      - "~experiment_cfg.runs.swap_objects"
      - "~experiment_cfg.runs.change_background_hdr"
      - "~experiment_cfg.runs.parallel_envs"
      - experiment_runner.record_camera_video=false

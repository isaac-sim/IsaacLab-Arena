# An Arena Experiment that evaluates the two example environments defined outside isaaclab_arena_environments.
# environment.type selects each environment factory by its dotted class path, module_path.ClassName.
# Loading the Experiment imports the module, and the factory's @register_environment decorator registers it.
# The other environment values set fields of the factory's config.
shared:
  policy:
    type: zero_action
  rollout_limit:
    num_steps: 50

runs:
  franka_table:
    environment:
      type: isaaclab_arena_examples.external_environments.basic.ExternalFrankaTableEnvironment
      object: tomato_soup_can

  franka_table_with_task:
    environment:
      type: isaaclab_arena_examples.external_environments.advanced.ExternalFrankaTableWithTaskEnvironment
      object: tomato_soup_can

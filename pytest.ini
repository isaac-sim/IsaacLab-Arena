[pytest]
# Pytest parameters:
#  --verbose: print one line per test.
#  --durations=25: list the 25 slowest test phases at the end (listing all of them bloats the logs).
#  --capture=no: stream test output live (same as -s). The default fd capture only prints a test's
#    output when it reports, so Kit's output is lost if Kit crashes or the job hits its timeout.
#    Log size is kept down by printing less (e.g. short config reprs), not by capturing.
#    --capture=sys does not work: Kit's SimulationApp calls faulthandler.enable(), which needs a real fd.
#  faulthandler_timeout: dump all Python stacks if a test runs longer than this many seconds, to show
#    where a stalled test is stuck before the job-level timeout kills it. Keep it above the slowest test.
addopts = --verbose --durations=25 --capture=no
faulthandler_timeout = 900
markers =
    with_cameras: test requires enable_cameras=True
    with_subprocess: test spawns Isaac Sim as a child process (must not share a session with persistent SimApp tests)
    with_newton: test uses Newton physics
    gr00t_policy: test exercises GR00T policy/data code that runs in the base container (lightweight gr00t deps only)
    gr00t_remote_e2e: test requires a live GR00T remote policy server
    curobo_deps: cuRobo dependency and IK-reachability tests (cuRobo is a locked Arena dependency)

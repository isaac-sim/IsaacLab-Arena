[pytest]
# Test directories run by the main CI steps and by a plain ``pytest``. isaaclab_arena/tests must come
# first so that the persistent SimulationApp is launched before any other test imports pxr.
# Directories with their own CI step are not listed; see test_package_test_dirs.py.
testpaths =
    isaaclab_arena/tests
    isaaclab_arena_benchmarking/tests
    isaaclab_arena_cosmos/tests
    isaaclab_arena_dreamzero/tests
    isaaclab_arena_examples/tests
    isaaclab_arena_openpi/tests
    isaaclab_arena_vlm_agent/tests
markers =
    with_cameras: test requires enable_cameras=True
    with_subprocess: test spawns Isaac Sim as a child process (must not share a session with persistent SimApp tests)
    with_newton: test uses Newton physics
    gr00t_policy: test exercises GR00T policy/data code that runs in the base container (lightweight gr00t deps only)
    gr00t_remote_e2e: test requires a live GR00T remote policy server
    curobo_deps: cuRobo dependency and IK-reachability tests (cuRobo is a locked Arena dependency)

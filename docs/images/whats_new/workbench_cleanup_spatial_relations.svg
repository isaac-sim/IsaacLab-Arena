<?xml version="1.0" encoding="UTF-8"?>
<svg width="1180" height="690" viewBox="0 0 1180 690" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8c8c8c"/>
    </marker>
    <style>
      .label { font-family: "NVIDIA Sans", Arial, Helvetica, sans-serif; font-weight: 700; font-size: 18px; }
      .edge-label { font-family: "NVIDIA Sans", Arial, Helvetica, sans-serif; font-weight: 700; font-size: 15px; fill: #4d4d4d; }
      .dark-node { fill: #1a1a1a; stroke: #1a1a1a; stroke-width: 2; }
      .object-node { fill: white; stroke: #76b900; stroke-width: 2; }
      .robot-node { fill: #76b900; stroke: #76b900; stroke-width: 2; }
      .edge { fill: none; stroke: #8c8c8c; stroke-width: 2; marker-end: url(#arrow); }
      .reference-edge { fill: none; stroke: #8c8c8c; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow); }
      .edge-backing { fill: white; opacity: 0.94; }
    </style>
  </defs>

  <rect width="1180" height="690" fill="white"/>

  <!-- Object-reference hierarchy -->
  <path class="reference-edge" d="M440 144 C470 112, 565 96, 620 76"/>
  <rect class="edge-backing" x="468" y="96" width="126" height="24" rx="4"/>
  <text class="edge-label" x="531" y="113" text-anchor="middle">object reference</text>

  <path class="reference-edge" d="M968 144 C930 112, 840 96, 782 76"/>

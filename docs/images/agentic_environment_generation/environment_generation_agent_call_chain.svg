<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Environment generation agent inference call chain</title>
  <desc id="desc">System diagram showing catalog construction, optional missing-object and SimReady search, spec inference with validator feedback, prim-tree resolution, SimReady path rewriting, and final outputs.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#dc2626"/>
    </marker>
    <style>
      .title { font: 700 30px Inter, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px Inter, Arial, sans-serif; fill: #475569; }
      .section { font: 700 13px Inter, Arial, sans-serif; fill: #475569; letter-spacing: 1.4px; }
      .heading { font: 700 16px Inter, Arial, sans-serif; fill: #0f172a; }
      .body { font: 400 13px Inter, Arial, sans-serif; fill: #334155; }
      .small { font: 400 11px Inter, Arial, sans-serif; fill: #64748b; }
      .mono { font: 500 12px "DejaVu Sans Mono", monospace; fill: #1e293b; }
      .white-heading { font: 700 15px Inter, Arial, sans-serif; fill: #ffffff; }
      .white-small { font: 400 11px Inter, Arial, sans-serif; fill: #dbeafe; }
      .stage { fill: #ffffff; stroke: #93c5fd; stroke-width: 2; }
      .neutral { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .optional { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; stroke-dasharray: 7 5; }
      .output { fill: #f0fdf4; stroke: #4ade80; stroke-width: 2; }
      .failure { fill: #fef2f2; stroke: #f87171; stroke-width: 1.5; }
      .line { fill: none; stroke: #475569; stroke-width: 1.7; marker-end: url(#arrow); }
      .flow { fill: none; stroke: #2563eb; stroke-width: 2.5; marker-end: url(#arrow-blue); }
      .feedback { fill: none; stroke: #dc2626; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#arrow-red); }
      .bypass { fill: none; stroke: #64748b; stroke-width: 1.6; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="980" fill="#f8fafc"/>
  <rect x="0" y="0" width="1600" height="74" fill="#0f172a"/>
  <text x="50" y="37" class="white-heading" style="font-size:22px">EnvironmentGenerationAgent inference call chain</text>
  <text x="50" y="59" class="white-small">Natural-language prompt + live Arena registries to validated, prim-resolved ArenaEnvGraphSpec</text>

  <text x="48" y="106" class="section">INPUTS AND CATALOG CONSTRUCTION</text>

  <rect x="48" y="124" width="220" height="105" rx="10" class="stage"/>
  <rect x="48" y="124" width="220" height="34" rx="10" fill="#2563eb"/>
  <rect x="48" y="148" width="220" height="10" fill="#2563eb"/>
  <text x="158" y="147" text-anchor="middle" class="white-heading">User prompt</text>
  <text x="68" y="183" class="body">Embodiment, background, objects,</text>
  <text x="68" y="203" class="body">spatial relations, and task</text>

  <rect x="318" y="106" width="442" height="165" rx="10" class="neutral"/>
  <text x="338" y="132" class="heading">0 - Build in-memory catalogs</text>
  <line x1="338" y1="143" x2="740" y2="143" stroke="#e2e8f0"/>

  <rect x="338" y="157" width="126" height="83" rx="7" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="401" y="179" text-anchor="middle" class="heading" style="font-size:13px">AssetCatalogue</text>
  <text x="401" y="198" text-anchor="middle" class="small">AssetRegistry</text>
  <text x="401" y="216" text-anchor="middle" class="small">embodiment</text>
  <text x="401" y="231" text-anchor="middle" class="small">background / object</text>

  <rect x="478" y="157" width="126" height="83" rx="7" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="541" y="179" text-anchor="middle" class="heading" style="font-size:13px">RelationCatalogue</text>
  <text x="541" y="198" text-anchor="middle" class="small">RelationRegistry</text>
  <text x="541" y="216" text-anchor="middle" class="small">agent_ready</text>
  <text x="541" y="231" text-anchor="middle" class="small">relation kinds + params</text>

  <rect x="618" y="157" width="122" height="83" rx="7" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="679" y="179" text-anchor="middle" class="heading" style="font-size:13px">TaskCatalogue</text>
  <text x="679" y="198" text-anchor="middle" class="small">TaskRegistry</text>
  <text x="679" y="216" text-anchor="middle" class="small">agent-ready tasks</text>
  <text x="679" y="231" text-anchor="middle" class="small">kinds + params</text>

  <rect x="810" y="96" width="742" height="188" rx="12" class="optional"/>
  <text x="832" y="122" class="heading" style="fill:#c2410c">1 - Optional SimReady catalog extension</text>
  <text x="832" y="142" class="small">Runs only when enable_simready_search=True</text>

  <rect x="832" y="158" width="186" height="82" rx="8" class="neutral"/>
  <text x="925" y="181" text-anchor="middle" class="heading" style="font-size:13px">MissingObjectInference</text>
  <text x="925" y="202" text-anchor="middle" class="small">IN: prompt + OBJECTS catalog</text>
  <text x="925" y="220" text-anchor="middle" class="small">OUT: up to 8 search phrases</text>

  <path d="M1018 199 L1060 199" class="line"/>
  <rect x="1060" y="158" width="188" height="82" rx="8" class="neutral"/>
  <text x="1154" y="181" text-anchor="middle" class="heading" style="font-size:13px">SimReady search</text>
  <text x="1154" y="202" text-anchor="middle" class="small">rank + rigid-body validation</text>
  <text x="1154" y="220" text-anchor="middle" class="small">candidates + unmatched phrases</text>

  <path d="M1248 199 L1290 199" class="line"/>
  <rect x="1290" y="148" width="238" height="102" rx="8" fill="#ffedd5" stroke="#fb923c"/>
  <text x="1409" y="172" text-anchor="middle" class="heading" style="font-size:13px">Modify asset vocabulary</text>
  <text x="1308" y="194" class="small">1. Register dynamic AssetRegistry entry</text>
  <text x="1308" y="213" class="small">2. Append to AssetCatalogue.objects</text>
  <text x="1308" y="232" class="small">3. Record name to USD path</text>

  <path d="M268 176 L318 176" class="line"/>
  <path d="M268 148 C470 77, 680 68, 832 183" class="line"/>
  <path d="M760 199 L832 199" class="line"/>

  <text x="48" y="327" class="section">STRUCTURED-OUTPUT INFERENCE AND POST-PROCESSING</text>

  <rect x="48" y="350" width="430" height="252" rx="12" class="stage"/>
  <rect x="48" y="350" width="430" height="42" rx="12" fill="#2563eb"/>
  <rect x="48" y="380" width="430" height="12" fill="#2563eb"/>
  <text x="263" y="377" text-anchor="middle" class="white-heading">2 - SpecInference.infer()</text>

  <text x="70" y="422" class="body" style="font-weight:700">Inputs</text>
  <text x="138" y="422" class="body">prompt + asset + relation + task catalog strings</text>
  <text x="70" y="451" class="body" style="font-weight:700">LLM</text>
  <text x="138" y="451" class="body">strict ArenaEnvGraphSpec JSON schema</text>
  <text x="70" y="480" class="body" style="font-weight:700">Validate</text>
  <text x="138" y="480" class="body">Pydantic schema + catalog cross-check</text>
  <text x="70" y="509" class="body" style="font-weight:700">Output</text>
  <text x="138" y="509" class="body">pass-1 spec; references may lack prim_path</text>

  <rect x="70" y="534" width="386" height="47" rx="7" fill="#fef2f2" stroke="#fecaca"/>
  <text x="263" y="554" text-anchor="middle" class="small" style="fill:#b91c1c;font-weight:700">Invalid response triggers critic feedback</text>
  <text x="263" y="571" text-anchor="middle" class="small" style="fill:#b91c1c">validation errors + rejected JSON; at most 3 spec calls</text>

  <rect x="586" y="350" width="430" height="252" rx="12" class="stage"/>
  <rect x="586" y="350" width="430" height="42" rx="12" fill="#2563eb"/>
  <rect x="586" y="380" width="430" height="12" fill="#2563eb"/>
  <text x="801" y="377" text-anchor="middle" class="white-heading">3 - PrimPathInference.infer()</text>

  <text x="608" y="422" class="body" style="font-weight:700">Gate</text>
  <text x="676" y="422" class="body">spec.object_references is non-empty</text>
  <text x="608" y="451" class="body" style="font-weight:700">Inputs</text>
  <text x="676" y="451" class="body">background USD prim tree</text>
  <text x="676" y="472" class="body">unresolved refs + relevant relations/tasks</text>
  <text x="608" y="501" class="body" style="font-weight:700">LLM</text>
  <text x="676" y="501" class="body">ResolvedObjectReferences JSON schema</text>
  <text x="608" y="530" class="body" style="font-weight:700">Validate</text>
  <text x="676" y="530" class="body">every returned path exists in prim tree</text>
  <text x="608" y="559" class="body" style="font-weight:700">Output</text>
  <text x="676" y="559" class="body">merged prim_path + reference params</text>
  <text x="608" y="582" class="small">One inference call; no validator-feedback loop</text>

  <rect x="1124" y="350" width="428" height="252" rx="12" class="stage"/>
  <rect x="1124" y="350" width="428" height="42" rx="12" fill="#2563eb"/>
  <rect x="1124" y="380" width="428" height="12" fill="#2563eb"/>
  <text x="1338" y="377" text-anchor="middle" class="white-heading">4 - SimReady USD rewrite</text>

  <text x="1146" y="422" class="body" style="font-weight:700">Input</text>
  <text x="1214" y="422" class="body">spec + searched-name to USD-path map</text>
  <text x="1146" y="457" class="body" style="font-weight:700">Rewrite</text>
  <text x="1214" y="457" class="mono">registry_name = simready_usd_object</text>
  <text x="1214" y="480" class="mono">params["usd_path"] = searched_path</text>
  <text x="1146" y="515" class="body" style="font-weight:700">Output</text>
  <text x="1214" y="515" class="body">portable final ArenaEnvGraphSpec</text>
  <text x="1146" y="550" class="small">No LLM call</text>
  <text x="1146" y="573" class="small">Searched members in object sets are rejected</text>

  <path d="M478 476 L586 476" class="flow"/>
  <text x="532" y="464" text-anchor="middle" class="small">validated spec</text>
  <path d="M1016 476 L1124 476" class="flow"/>
  <text x="1070" y="464" text-anchor="middle" class="small">resolved spec</text>

  <path d="M1409 250 C1409 310, 380 300, 380 350" class="flow"/>
  <text x="882" y="300" text-anchor="middle" class="small" style="fill:#1d4ed8">extended AssetCatalogue</text>
  <path d="M541 271 C541 320, 300 313, 300 350" class="line"/>
  <path d="M679 271 C679 330, 220 310, 220 350" class="line"/>
  <path d="M158 229 C158 296, 120 296, 120 350" class="line"/>

  <path d="M263 581 L263 655 L88 655 L88 602" class="feedback"/>
  <text x="286" y="645" class="small" style="fill:#b91c1c">critic retries complete generation</text>

  <path d="M478 559 C535 559, 535 690, 801 690 L801 602" class="bypass"/>
  <text x="637" y="681" text-anchor="middle" class="small">no object references: bypass prim inference</text>

  <text x="48" y="738" class="section">RETURN VALUES AND DIAGNOSTICS</text>

  <rect x="48" y="760" width="480" height="126" rx="12" class="output"/>
  <text x="70" y="790" class="heading" style="fill:#166534">Success</text>
  <text x="70" y="819" class="mono">(ArenaEnvGraphSpec, None)</text>
  <text x="70" y="846" class="body">Caller may serialize the spec as reusable YAML.</text>
  <text x="70" y="869" class="small">Catalogs remain in memory and are not written to disk.</text>

  <rect x="572" y="760" width="530" height="126" rx="12" class="failure"/>
  <text x="594" y="790" class="heading" style="fill:#991b1b">Inference or validation failure</text>
  <text x="594" y="819" class="mono">(None, rejected_json_or_spec_dict)</text>
  <text x="594" y="846" class="body">agent.traces contains schema, catalog, prim-path, or rewrite errors.</text>
  <text x="594" y="869" class="small">The last rejected representation is preserved for inspection.</text>

  <rect x="1146" y="760" width="406" height="126" rx="12" class="neutral"/>
  <text x="1168" y="790" class="heading">SimReady search diagnostics</text>
  <text x="1168" y="819" class="mono">agent.unavailable_objects</text>
  <text x="1168" y="846" class="body">Search phrases with no candidate match.</text>
  <text x="1168" y="869" class="small">Informational: unmatched objects were not offered to spec inference.</text>

  <path d="M1338 602 C1338 700, 288 700, 288 760" class="flow"/>
  <path d="M263 602 C263 715, 837 700, 837 760" class="feedback"/>
  <path d="M801 602 C801 715, 837 715, 837 760" class="feedback"/>
  <path d="M1338 602 C1338 718, 837 718, 837 760" class="feedback"/>
  <path d="M1154 240 C1154 730, 1349 720, 1349 760" class="bypass"/>

  <text x="48" y="936" class="small">Solid blue arrows: successful data flow</text>
  <line x1="48" y1="951" x2="110" y2="951" class="flow"/>
  <text x="275" y="936" class="small">Dashed gray arrows: conditional flow</text>
  <line x1="275" y1="951" x2="337" y2="951" class="bypass"/>
  <text x="514" y="936" class="small">Dashed red arrows: retry or failure path</text>
  <line x1="514" y1="951" x2="576" y2="951" class="feedback"/>
</svg>

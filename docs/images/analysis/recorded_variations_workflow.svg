<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2020" viewBox="0 0 1500 2020" role="img" aria-labelledby="title description">
  <title id="title">Three-stage recorded variations workflow</title>
  <desc id="description">A vertical workflow records eight placement rows, replays them while live-sampling four variations into two 64-row episode files, then replays placement and all four variations from those files. Configuration excerpts show the replay paths, episode counts, and rebuild controls. Corresponding record and replay files are linked with dotted lines because each replay payload matches its indexed source row.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="#42566b"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #162c40; text-anchor: middle; }
      .stage-title { font-size: 24px; font-weight: bold; }
      .stage-detail { font-size: 15px; }
      .section-label { font-size: 15px; font-weight: bold; letter-spacing: 0.5px; }
      .component-title { font-size: 17px; font-weight: bold; }
      .component-detail { font-size: 14px; }
      .component-key { font-size: 12px; font-weight: bold; }
      .file-title { font-size: 16px; font-weight: bold; }
      .file-detail { font-size: 13px; }
      .config-title { font-family: monospace; font-size: 13px; font-weight: bold; }
      .config-key { font-family: monospace; font-size: 13px; text-anchor: start; }
      .stage { fill: #f8fafc; stroke: #42566b; stroke-width: 1.8; rx: 12; }
      .live { fill: #e8f3e1; stroke: #4f7c43; stroke-width: 1.4; rx: 7; }
      .replayed { fill: #e7f1f9; stroke: #3973a5; stroke-width: 1.4; rx: 7; }
      .config { fill: #f3eefb; stroke: #7564a8; stroke-width: 1.5; rx: 8; }
      .file { fill: #fff2de; stroke: #9a6b20; stroke-width: 1.5; }
      .fold { fill: none; stroke: #9a6b20; stroke-width: 1.5; }
      .flow { fill: none; stroke: #42566b; stroke-width: 2; marker-end: url(#arrow); }
      .match { fill: none; stroke: #7564a8; stroke-width: 2; stroke-dasharray: 6 6; }
    </style>
  </defs>

  <rect width="1500" height="2020" fill="white"/>
  <text class="stage-title" x="750" y="38">Record and replay the same evaluation conditions</text>
  <rect class="live" x="520" y="55" width="205" height="36"/>
  <text class="component-detail" x="622" y="78">Live solved / sampled</text>
  <rect class="replayed" x="775" y="55" width="205" height="36"/>
  <text class="component-detail" x="878" y="78">Replayed from JSONL</text>

  <!-- Step 1 -->
  <rect class="stage" x="100" y="125" width="740" height="245"/>
  <text class="stage-title" x="470" y="164">Step 1 - Record settled placement</text>
  <text class="stage-detail" x="470" y="193">record_placement_layouts.py</text>
  <text class="stage-detail" x="470" y="215">clamp_in_right_bin.yaml + recording overrides</text>
  <text class="section-label" x="470" y="252">CONDITION SOURCE</text>
  <rect class="live" x="220" y="270" width="500" height="70"/>
  <text class="component-title" x="470" y="297">Relation placement</text>
  <text class="component-detail" x="470" y="322">LIVE SOLVED - 4 envs x 2 layouts</text>

  <!-- Shared placement file between steps 1 and 2 -->
  <path class="flow" d="M470,370 V410"/>
  <path class="file" d="M275,420 H625 L665,460 V555 H275 Z"/>
  <path class="fold" d="M625,420 V460 H665"/>
  <text class="file-title" x="470" y="465">placements.jsonl</text>
  <text class="file-detail" x="470" y="492">1 file - 8 rows</text>
  <text class="file-detail" x="470" y="516">Complete scene-root poses</text>
  <text class="file-detail" x="470" y="540">Shared output of step 1 / input to step 2</text>
  <path class="flow" d="M470,555 V600"/>

  <!-- Step 2 -->
  <rect class="stage" x="100" y="610" width="740" height="455"/>
  <text class="stage-title" x="470" y="649">Step 2 - Record 128 episodes</text>
  <text class="stage-detail" x="470" y="678">experiment_runner.py</text>
  <text class="stage-detail" x="470" y="700">recorded_variations_workflow_experiment.yaml</text>
  <text class="section-label" x="470" y="738">PLACEMENT + ENABLED VARIATIONS</text>

  <rect class="replayed" x="220" y="756" width="500" height="54"/>
  <text class="component-title" x="470" y="779">Relation placement</text>
  <text class="component-detail" x="470" y="800">REPLAYED from placements.jsonl</text>

  <rect class="live" x="220" y="822" width="238" height="62"/>
  <text class="component-title" x="339" y="847">light.hdr_image</text>
  <text class="component-detail" x="339" y="871">LIVE - build time</text>
  <rect class="live" x="482" y="822" width="238" height="62"/>
  <text class="component-title" x="601" y="847">light.color</text>
  <text class="component-detail" x="601" y="871">LIVE - build time</text>

  <rect class="live" x="220" y="896" width="238" height="78"/>
  <text class="component-key" x="339" y="928">red_hammer.disappear</text>
  <text class="component-detail" x="339" y="958">LIVE - run time</text>
  <rect class="live" x="482" y="896" width="238" height="78"/>
  <text class="component-key" x="601" y="920">droid_abs_joint_pos.</text>
  <text class="component-key" x="601" y="938">camera_extrinsics_wrist_camera</text>
  <text class="component-detail" x="601" y="960">LIVE - run time</text>

  <text class="stage-detail" x="470" y="1012">4 parallel environments - 2 rebuilds - 64 episodes per rebuild</text>

  <!-- Step 2 config keys -->
  <rect class="config" x="885" y="650" width="370" height="238"/>
  <text class="config-title" x="1070" y="682">recorded_variations_workflow_experiment.yaml</text>
  <text class="config-key" x="905" y="722">environment_builder:</text>
  <text class="config-key" x="925" y="748">recorded_variation_samples_path:</text>
  <text class="config-key" x="945" y="774">outputs/.../placements.jsonl</text>
  <text class="config-key" x="905" y="810">rollout_limit:</text>
  <text class="config-key" x="925" y="836">num_episodes: 128</text>
  <text class="config-key" x="905" y="872">num_rebuilds: 2</text>

  <!-- Shared episode files between steps 2 and 3 -->
  <path class="flow" d="M470,1065 V1105"/>
  <text class="section-label" x="470" y="1128">STEP-2 EPISODE RECORDINGS</text>
  <path class="file" d="M115,1145 H400 L435,1180 V1260 H115 Z"/>
  <path class="fold" d="M400,1145 V1180 H435"/>
  <text class="file-title" x="275" y="1185">episode_results_rebuild0.jsonl</text>
  <text class="file-detail" x="275" y="1212">1 file - 64 rows</text>
  <text class="file-detail" x="275" y="1237">placement + 4 variations</text>

  <path class="file" d="M505,1145 H790 L825,1180 V1260 H505 Z"/>
  <path class="fold" d="M790,1145 V1180 H825"/>
  <text class="file-title" x="665" y="1185">episode_results_rebuild1.jsonl</text>
  <text class="file-detail" x="665" y="1212">1 file - 64 rows</text>
  <text class="file-detail" x="665" y="1237">placement + 4 variations</text>
  <text class="stage-detail" x="470" y="1290">Shared output of step 2 / ordered inputs to step 3</text>
  <path class="flow" d="M470,1300 V1340"/>

  <!-- Step 3 -->
  <rect class="stage" x="100" y="1350" width="740" height="420"/>
  <text class="stage-title" x="470" y="1389">Step 3 - Replay 128 episodes</text>
  <text class="stage-detail" x="470" y="1418">experiment_runner.py</text>
  <text class="stage-detail" x="470" y="1440">recorded_variations_replay_experiment.yaml</text>
  <text class="section-label" x="470" y="1478">PLACEMENT + ENABLED VARIATIONS</text>

  <rect class="replayed" x="220" y="1496" width="500" height="54"/>
  <text class="component-title" x="470" y="1519">Relation placement</text>
  <text class="component-detail" x="470" y="1540">REPLAYED</text>

  <rect class="replayed" x="220" y="1562" width="238" height="62"/>
  <text class="component-title" x="339" y="1587">light.hdr_image</text>
  <text class="component-detail" x="339" y="1611">REPLAYED</text>
  <rect class="replayed" x="482" y="1562" width="238" height="62"/>
  <text class="component-title" x="601" y="1587">light.color</text>
  <text class="component-detail" x="601" y="1611">REPLAYED</text>

  <rect class="replayed" x="220" y="1636" width="238" height="78"/>
  <text class="component-key" x="339" y="1668">red_hammer.disappear</text>
  <text class="component-detail" x="339" y="1698">REPLAYED</text>
  <rect class="replayed" x="482" y="1636" width="238" height="78"/>
  <text class="component-key" x="601" y="1660">droid_abs_joint_pos.</text>
  <text class="component-key" x="601" y="1678">camera_extrinsics_wrist_camera</text>
  <text class="component-detail" x="601" y="1700">REPLAYED</text>
  <text class="stage-detail" x="470" y="1748">3 parallel environments - source order remains global</text>

  <!-- Step 3 config keys -->
  <rect class="config" x="885" y="1390" width="370" height="238"/>
  <text class="config-title" x="1070" y="1422">recorded_variations_replay_experiment.yaml</text>
  <text class="config-key" x="905" y="1462">recorded_variation_samples_paths:</text>
  <text class="config-key" x="925" y="1488">- .../episode_results_rebuild0.jsonl</text>
  <text class="config-key" x="925" y="1514">- .../episode_results_rebuild1.jsonl</text>
  <text class="config-key" x="905" y="1550">rollout_limit:</text>
  <text class="config-key" x="925" y="1576">num_episodes: 128</text>

  <!-- Step 3 outputs and matching -->
  <path class="flow" d="M470,1770 V1810"/>
  <text class="section-label" x="470" y="1833">STEP-3 REPLAY OUTPUTS</text>
  <path class="file" d="M115,1850 H400 L435,1885 V1970 H115 Z"/>
  <path class="fold" d="M400,1850 V1885 H435"/>
  <text class="file-title" x="275" y="1890">episode_results_rebuild0.jsonl</text>
  <text class="file-detail" x="275" y="1917">1 file - 64 rows</text>
  <text class="file-detail" x="275" y="1942">replay/recorded_variations_replay/</text>

  <path class="file" d="M505,1850 H790 L825,1885 V1970 H505 Z"/>
  <path class="fold" d="M790,1850 V1885 H825"/>
  <text class="file-title" x="665" y="1890">episode_results_rebuild1.jsonl</text>
  <text class="file-detail" x="665" y="1917">1 file - 64 rows</text>
  <text class="file-detail" x="665" y="1942">replay/recorded_variations_replay/</text>

  <path class="match" d="M115,1202 H55 V1907 H115"/>
  <path class="match" d="M825,1202 H860 V1907 H825"/>
</svg>

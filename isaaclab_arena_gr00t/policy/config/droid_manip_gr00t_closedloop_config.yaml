# Action horizon is the number of actions predicted by the policy per inference rollout, defined in the modality_config_path.
action_horizon: 32
embodiment_tag: OXE_DROID
video_backend: decord
# Load modality config from the existing modality configs in GR00T
# modality_config_path:

# Action chunk length is the number of actions executed per inference rollout, could be less than action_horizon.
action_chunk_length: 32
gr00t_embodiment_adapter: isaaclab_arena_gr00t.policy.embodiment_adapters.droid_adapter.Gr00tDroidAdapter

pov_cam_name_sim: ["external_camera_rgb", "wrist_camera_rgb"]

original_image_size: [720, 1280, 3]
target_image_size: [180, 320, 3]

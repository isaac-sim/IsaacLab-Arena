# Benchmarks tracked by the Arena benchmark dashboard. Each entry is run as one OSMO
# experiment. `name` is a stable identifier used in workflow names and folder paths
# (lowercase letters, digits and dashes); `experiment_cfg` is a repo-root relative path to an
# existing Experiment YAML; `overrides` (optional) are Hydra overrides applied on top.
# isaaclab_arena/tests/test_main_benchmarks_yaml.py checks these rules and renders a dry run of each entry.
#
# PLACEHOLDER LIST: the single entry below is a fast smoke benchmark (2 Runs, 2 episodes each) for testing the
# benchmark pipeline. The real benchmarks are still to be chosen; revisit this list before relying on it.
# The previous entries were droid-pnp-openpi
# (isaaclab_arena_environments/experiment_configs/droid_pnp_openpi_experiment.yaml) and kitchen-bench-17-tasks
# (isaaclab_arena_environments/kitchen_bench/experiment_configs/kitchen_bench_17_tasks_pi0_and_cosmos.yaml).
benchmarks:
  # getting_started_experiment.yaml has four Runs; keep baseline and swap_objects only. Video recording is
  # disabled because the default recording fails on cameraless environments on OSMO.
  - name: smoke-two-runs
    experiment_cfg: isaaclab_arena_environments/experiment_configs/getting_started_experiment.yaml
    overrides:
      - experiment_cfg.shared.rollout_limit.num_episodes=2
      - "~experiment_cfg.runs.change_background_hdr"
      - "~experiment_cfg.runs.parallel_envs"
      - experiment_runner.record_camera_video=false

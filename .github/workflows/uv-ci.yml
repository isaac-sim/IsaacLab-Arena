name: Native uv CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [ "main" ]
  schedule:
    # Nightly at 06:00 UTC, including the live environment-generation tests.
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  uv_changes:
    name: Detect uv-related changes
    runs-on: [self-hosted, gpu-arena]
    timeout-minutes: 5
    # Only meaningful on PRs; other events always run the uv tests.
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    outputs:
      uv: ${{ steps.filter.outputs.uv }}
    steps:
      # Queries the PR's changed files via the GitHub API; no checkout needed.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            uv:
              - '.github/workflows/uv-ci.yml'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'submodules/IsaacLab'
              - 'submodules/IsaacLab/**'
              - 'submodules/Isaac-GR00T'
              - 'submodules/Isaac-GR00T/**'

  uv_test:
    name: Run tests (native uv, source)
    runs-on: [self-hosted, gpu-arena]
    timeout-minutes: 120
    needs: [uv_changes]
    # Runs nightly, on push to main, and on manual dispatch; on pull requests
    # only when the PR touches the uv-managed dependency files or this workflow.
    # The !cancelled() guard keeps the job alive when uv_changes is skipped on
    # non-PR events.
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' ||
       needs.uv_changes.outputs.uv == 'true')
    env:
      ARENA_INFERENCE_ENDPOINT: public
      NVIDIA_API_KEY: ${{ secrets.ARENA_PUBLIC_NVIDIA_API_KEY }}
      # Accept the Isaac Sim EULA so the first launch is non-interactive.
      OMNI_KIT_ACCEPT_EULA: "YES"
      ACCEPT_EULA: "Y"
      # Large CUDA wheels (e.g. nvidia-cublas-cu12) can exceed uv's 30s default.
      UV_HTTP_TIMEOUT: "300"

    # Validates the native workflow in a clean ubuntu:24.04 container.
    container: &uv_container
      image: nvidia/cuda:12.8.2-base-ubuntu24.04
      env:
        # Needed to give the container access to the driver's graphics libraries.
        NVIDIA_DRIVER_CAPABILITIES: all

    steps:
      - &nvidia_smi
        name: nvidia-smi
        run: nvidia-smi

      - &install_git_step
        name: Install git (and tools needed by hooks)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git git-lfs clang-format ca-certificates make
          git --version
          git lfs version

      # Clean up residual stuff due to symlinks in the submodules directory.
      - &cleanup_step
        name: Clean up symlinks in submodules directory
        run: |
          rm -f .git/modules/submodules/IsaacLab/index.lock || true
          rm -rf submodules/* || true

      - &mark_repo_safe_step
        name: Mark repositories as safe for git
        # uv may populate its Git cache with a different owner on the self-hosted runner.
        run: git config --global --add safe.directory '*'

      - &checkout_step
        name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true

      - &git_lfs_step
        name: Git LFS
        run: |
          git lfs update --force
          git lfs install --local
          git lfs pull

      - &install_graphics_step
        name: Install graphics loader and build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglu1-mesa libglx0 libxi6 libxrandr2 libxt6 libsm6 libvulkan1 \
            cmake build-essential bash

      - &install_uv_step
        name: Install uv
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates
          curl -LsSf https://astral.sh/uv/0.12.9/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - &validate_uv_lock_step
        name: Validate uv lock
        run: |
          uv python install 3.12
          uv lock --check --no-python-downloads

      # Out-of-source packaging check: validates the lockfile via the
      # packaging tests, run in an out of source directory.
      - name: Validate editable package
        run: |
          uv venv --python 3.12 /tmp/arena-package-venv
          uv pip install --python /tmp/arena-package-venv/bin/python --no-deps --editable .
          uv pip install --python /tmp/arena-package-venv/bin/python pytest
          REPO_DIR="$PWD"
          cd /tmp
          /tmp/arena-package-venv/bin/python -m pytest -v "${REPO_DIR}/isaaclab_arena/tests/test_packaging.py"

      # In-source full environment: sync the locked deps and run the sim suite.
      - name: Sync the locked environment
        run: uv sync --group gr00t-client --extra dev

      - name: Run in-process Newton tests without cameras
        shell: bash
        run: |
          source .venv/bin/activate
          pytest -sv --durations=0 -m "with_newton and not with_cameras and not with_subprocess" \
            isaaclab_arena/tests/

      - name: Run in-process Newton tests with cameras
        shell: bash
        run: |
          source .venv/bin/activate
          pytest -sv --durations=0 -m "with_newton and with_cameras and not with_subprocess" \
            isaaclab_arena/tests/

      - name: Run in-process PhysX tests without cameras
        shell: bash
        run: |
          source .venv/bin/activate
          pytest -sv --durations=0 -m "not with_cameras and not with_subprocess and not with_newton" \
            isaaclab_arena/tests/

      - name: Run in-process PhysX tests with cameras
        shell: bash
        run: |
          source .venv/bin/activate
          pytest -sv --durations=0 -m "with_cameras and not with_subprocess and not with_newton" \
            isaaclab_arena/tests/

      - name: Run subprocess-spawning Newton tests
        shell: bash
        run: |
          source .venv/bin/activate
          ISAACLAB_ARENA_SUBPROCESS_TIMEOUT=900 \
          pytest -sv --durations=0 -m "with_newton and with_subprocess" \
            isaaclab_arena/tests/

      - name: Run subprocess-spawning PhysX tests
        shell: bash
        run: |
          source .venv/bin/activate
          ISAACLAB_ARENA_SUBPROCESS_TIMEOUT=900 \
          pytest -sv --durations=0 -m "with_subprocess and not with_newton" \
            isaaclab_arena/tests/

      - name: Run VLM agent policy tests
        shell: bash
        run: |
          source .venv/bin/activate
          pytest -sv --durations=0 \
            isaaclab_arena_vlm_agent/tests/

      - name: Run GR00T remote policy client tests
        shell: bash
        run: |
          source .venv/bin/activate
          pytest -sv --durations=0 \
            isaaclab_arena_gr00t/tests/test_gr00t_remote_closedloop_policy.py


  test_live_environment_generation:
    name: Live environment generation (nightly, native uv)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, gpu-arena]
    timeout-minutes: 120
    env:
      ARENA_INFERENCE_ENDPOINT: public
      NVIDIA_API_KEY: ${{ secrets.ARENA_PUBLIC_NVIDIA_API_KEY }}
      ISAACLAB_ARENA_RUN_LIVE_ENDPOINT_TESTS: "1"
      OMNI_KIT_ACCEPT_EULA: "YES"
      ACCEPT_EULA: "Y"
      UV_HTTP_TIMEOUT: "300"

    container: *uv_container

    steps:
      - name: Require the public inference API key
        run: |
          if [ -z "${NVIDIA_API_KEY}" ]; then
            echo "::error::ARENA_PUBLIC_NVIDIA_API_KEY must be configured for live endpoint tests."
            exit 1
          fi

      - *nvidia_smi
      - *install_git_step
      - *cleanup_step
      - *mark_repo_safe_step
      - *checkout_step
      - *git_lfs_step
      - *install_graphics_step
      - *install_uv_step
      - *validate_uv_lock_step

      - name: Sync the locked environment
        run: |
          git config --global --add safe.directory '*'
          uv sync --locked --extra dev

      # Keep slow public endpoint requests out of the regular test jobs.
      # Explicit node IDs cover the six live tests made opt-in by #1431.
      - name: Run live environment-generation and inference tests
        timeout-minutes: 60
        run: |
          .venv/bin/python -m pytest -sv -x --durations=0 \
            --junitxml=live-endpoint-results.xml \
            isaaclab_arena/tests/test_environment_generation_agent.py::test_generate_spec_atomic_pick_and_place_against_live_endpoint \
            isaaclab_arena/tests/test_environment_generation_agent.py::test_generate_spec_five_bananas_parallel_pick_and_place_against_live_endpoint \
            isaaclab_arena/tests/test_environment_generation_agent.py::test_resolve_usd_prim_robocasa_kitchen_counter_and_fridge \
            isaaclab_arena/tests/test_missing_object_inference.py::test_infer_names_the_uncatalogued_object_against_live_endpoint \
            isaaclab_arena/tests/test_missing_object_inference.py::test_infer_names_nothing_when_the_catalog_covers_the_prompt_against_live_endpoint \
            isaaclab_arena/tests/test_shared_inference_backend.py::test_multimodal_image_against_live_endpoint

      - name: Upload live endpoint test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-endpoint-results-${{ github.run_attempt }}
          path: live-endpoint-results.xml
          if-no-files-found: warn

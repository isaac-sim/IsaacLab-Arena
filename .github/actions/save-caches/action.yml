name: Save caches
description: |
  Report what the tests changed in the caches restored by setup-caches, and save the
  Lightwheel SDK asset cache when they changed it. Call once at the end of every job that
  calls setup-caches. Each step does nothing when setup-caches did not set up its cache.

  The kit and Warp caches are only reported here; actions/cache saves them at the end of
  the job as before.

  A composite action cannot have post steps, and the automatic end-of-job save of
  actions/cache is decided before the tests run. The Lightwheel save therefore is an
  explicit step that the job calls after its tests. It happens only on the nightly run on
  main (and manual dispatches on main), the same events that save the kit cache, only when
  the job succeeded and only when the contents changed since the restore.

  Do not call this action with `if: always()` or `if: failure()`. Inside a composite action
  success() does not reliably reflect earlier failed steps of the job, so the step that calls
  this action must keep the default condition; otherwise a failed nightly run could save.

inputs:
  cache-name:
    description: |
      Name of the cache. Pass the cache-name given to setup-caches in the same job; it names
      the reports, and the saved key (set by setup-caches) uses the same name.
    required: true

runs:
  using: composite
  steps:
    # The before-snapshot is missing when setup-caches did not run, for example in a job that
    # calls it conditionally. Reporting only, so a failure warns instead of failing the job.
    - name: Report kit and Warp cache changes
      shell: bash
      env:
        CACHE_NAME: ${{ inputs.cache-name }}
      run: |
        before="${RUNNER_TEMP}/kit-warp-before.json"
        if [ ! -f "${before}" ]; then
          echo "No kit and Warp cache snapshot; setup-caches did not run."
          exit 0
        fi
        python3 "${GITHUB_WORKSPACE}/docker/report_cache_contents.py" compare \
          --name "kit-warp-${CACHE_NAME}" \
          --before "${before}" \
          /isaac-sim/kit/cache \
          "${HOME}/.cache/warp" \
          || echo "::warning::Could not report the kit and Warp cache changes."

    # LIGHTWHEEL_CACHE_KEY is set by setup-caches only when it restored the Lightwheel cache.
    # Without a before-snapshot, `changed` stays unset, so the save below is skipped.
    - id: compare_lightwheel
      name: Report Lightwheel cache changes
      if: env.LIGHTWHEEL_CACHE_KEY != ''
      shell: bash
      env:
        CACHE_NAME: ${{ inputs.cache-name }}
      run: |
        before="${RUNNER_TEMP}/lightwheel-before.json"
        if [ ! -f "${before}" ]; then
          echo "::warning::No Lightwheel cache snapshot; the Lightwheel cache is not saved."
          exit 0
        fi
        python3 "${GITHUB_WORKSPACE}/docker/report_cache_contents.py" compare \
          --name "lightwheel-${CACHE_NAME}" \
          --before "${before}" \
          "${HOME}/.cache/lightwheel_sdk/floorplan" \
          "${HOME}/.cache/lightwheel_sdk/object"

    # Only the floorplan and object directories; the `login` file next to them holds a
    # credential and must never be cached.
    - name: Save Lightwheel cache
      if: >-
        success() &&
        github.ref == 'refs/heads/main' &&
        contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) &&
        steps.compare_lightwheel.outputs.changed == 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          ~/.cache/lightwheel_sdk/floorplan
          ~/.cache/lightwheel_sdk/object
        key: ${{ env.LIGHTWHEEL_CACHE_KEY }}

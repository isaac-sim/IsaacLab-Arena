name: Setup Isaac Sim caches
description: |
  Restore or save the Isaac Sim kit cache (/isaac-sim/kit/cache: RTX shaders and
  the PhysX mesh cooking cache in DerivedDataCache) and the Warp kernel cache
  (~/.cache/warp) via the GitHub Actions cache. Call once with mode "restore"
  before the tests and, in jobs that refresh the cache, once with mode "save"
  after them.

  Only the nightly run on main (and manual dispatches on main) saves. It starts
  without a restored cache, so the saved cache holds only what that run used.
  Every other run restores the newest saved cache.

inputs:
  mode:
    description: '"restore" to restore the caches, "save" to save them.'
    required: true
  name:
    description: Cache name, one per job type, because the jobs warm different caches.
    required: true

runs:
  using: composite
  steps:
    - id: read_isaac_sim_version
      name: Read Isaac Sim version
      shell: bash
      run: echo "isaac_sim_version=$(cat /isaac-sim/VERSION)" >> "${GITHUB_OUTPUT}"

    # Restore the newest cache with this prefix. The run id in the key makes each
    # nightly save a new entry, since cache entries cannot be overwritten.
    # FIXME(before merge): the "-prtest" suffix keeps PR runs from reading or
    # overwriting the caches that main uses; remove it so PRs restore main's caches.
    - name: Restore Isaac Sim caches
      if: >-
        inputs.mode == 'restore' &&
        !(github.ref == 'refs/heads/main' &&
          contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event_name))
      uses: actions/cache/restore@v4
      with:
        path: |
          /isaac-sim/kit/cache
          ~/.cache/warp
        key: isaac-caches-${{ steps.read_isaac_sim_version.outputs.isaac_sim_version }}-${{ inputs.name }}${{ github.event_name == 'pull_request' && '-prtest' || '' }}-${{ github.run_id }}
        restore-keys: |
          isaac-caches-${{ steps.read_isaac_sim_version.outputs.isaac_sim_version }}-${{ inputs.name }}${{ github.event_name == 'pull_request' && '-prtest' || '' }}-

    # FIXME(before merge): drop the pull_request clause, which lets a PR populate its
    # own "-prtest" caches so the restore path can be tested before the first nightly.
    - name: Save Isaac Sim caches
      if: >-
        inputs.mode == 'save' &&
        ((github.ref == 'refs/heads/main' &&
          contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event_name)) ||
         github.event_name == 'pull_request')
      uses: actions/cache/save@v4
      with:
        path: |
          /isaac-sim/kit/cache
          ~/.cache/warp
        key: isaac-caches-${{ steps.read_isaac_sim_version.outputs.isaac_sim_version }}-${{ inputs.name }}${{ github.event_name == 'pull_request' && '-prtest' || '' }}-${{ github.run_id }}

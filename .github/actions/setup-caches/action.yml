name: Setup caches
description: |
  Restore the caches that speed up CI test jobs from the GitHub Actions cache: the Isaac
  Sim kit cache (/isaac-sim/kit/cache: RTX shaders and the PhysX mesh cooking cache in
  DerivedDataCache), the Warp kernel cache (~/.cache/warp) and the Lightwheel SDK asset
  cache (~/.cache/lightwheel_sdk). Call once before the tests.

  Every run except the nightly one restores the newest saved cache with the same name.
  Runs on main (merges, the nightly run and manual dispatches) also save the cache at the
  end of a successful job, so the cache accumulates what the runs on main used. Pull
  requests only restore.

  The nightly run starts without a restored cache. It shows whether the tests still pass
  from scratch, and the cache it saves holds only what that run used, which removes
  entries that are stale or no longer used.

inputs:
  cache-name:
    description: |
      Name of the cache. Use one name per job type. The jobs run different tests, so
      each warms different shaders, meshes and kernels. A restore picks the newest cache
      with the same name, so jobs sharing a name would restore whichever job saved last.
    required: true

runs:
  using: composite
  steps:
    - id: read_isaac_sim_version
      name: Read Isaac Sim version
      shell: bash
      run: echo "isaac_sim_version=$(cat /isaac-sim/VERSION)" >> "${GITHUB_OUTPUT}"

    # Restore the newest cache with this name. Pull requests only restore; on main the step
    # below restores and saves.
    # Cache only the floorplan and object directories of the Lightwheel SDK, excluding stray
    # zip files. login/ must never be cached because it holds credentials.
    - id: restore_caches
      name: Restore caches
      if: github.ref != 'refs/heads/main'
      uses: actions/cache/restore@v4
      with:
        path: |
          /isaac-sim/kit/cache
          ~/.cache/warp
          ~/.cache/lightwheel_sdk/floorplan
          ~/.cache/lightwheel_sdk/object
          !~/.cache/lightwheel_sdk/object/*.zip
        key: ci-caches-${{ steps.read_isaac_sim_version.outputs.isaac_sim_version }}-${{ inputs.cache-name }}-${{ github.run_id }}
        restore-keys: |
          ci-caches-${{ steps.read_isaac_sim_version.outputs.isaac_sim_version }}-${{ inputs.cache-name }}-

    # On main, restore the newest cache (not on the nightly run, which has no restore-keys and
    # so starts cold) and let actions/cache save the paths in a step at the end of a
    # successful job when its key was not found. The key is new on every run, so it always
    # saves. Keep the paths identical to the restore step above, because the cache version
    # hash depends on them.
    - id: restore_and_save_caches
      name: Restore caches and save them at the end of the job
      if: github.ref == 'refs/heads/main'
      uses: actions/cache@v4
      with:
        path: |
          /isaac-sim/kit/cache
          ~/.cache/warp
          ~/.cache/lightwheel_sdk/floorplan
          ~/.cache/lightwheel_sdk/object
          !~/.cache/lightwheel_sdk/object/*.zip
        key: ci-caches-${{ steps.read_isaac_sim_version.outputs.isaac_sim_version }}-${{ inputs.cache-name }}-${{ github.run_id }}
        restore-keys: ${{ github.event_name != 'schedule' && format('ci-caches-{0}-{1}-', steps.read_isaac_sim_version.outputs.isaac_sim_version, inputs.cache-name) || '' }}

    - name: Print restored cache
      shell: bash
      env:
        MATCHED_KEY: ${{ steps.restore_caches.outputs.cache-matched-key || steps.restore_and_save_caches.outputs.cache-matched-key }}
      run: |
        echo "Caches restored from: ${MATCHED_KEY:-nothing (cache miss or nightly run)}"
        du -sh /isaac-sim/kit/cache ~/.cache/warp ~/.cache/lightwheel_sdk/* 2>/dev/null || true

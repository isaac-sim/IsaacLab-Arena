name: Setup caches
description: |
  Restore the caches that speed up CI test jobs from the GitHub Actions cache: the Isaac
  Sim kit cache (/isaac-sim/kit/cache: RTX shaders and the PhysX mesh cooking cache in
  DerivedDataCache) and the Warp kernel cache (~/.cache/warp). Call once before the tests.

  The nightly run on main (and manual dispatches on main) starts without a restored
  cache and saves one at the end of a successful job, so the saved cache holds only
  what that run used. Every other run restores the newest saved cache.

  With `lightwheel: 'true'` it also caches the Lightwheel SDK assets
  (~/.cache/lightwheel_sdk/floorplan and ~/.cache/lightwheel_sdk/object). Unlike the kit
  cache, every run restores it, including the nightly run on main, because starting from
  nothing means downloading from the Lightwheel servers, which is the failure this cache
  avoids. The nightly run saves what it restored plus anything it downloaded.

inputs:
  cache-name:
    description: |
      Name of the cache. Use one name per job type. The jobs run different tests, so
      each warms different shaders, meshes and kernels. A restore picks the newest cache
      with the same name, so jobs sharing a name would restore whichever job saved last.
    required: true
  lightwheel:
    description: "'true' to also cache the Lightwheel SDK assets."
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - id: read_isaac_sim_version
      name: Read Isaac Sim version
      shell: bash
      run: echo "isaac_sim_version=$(cat /isaac-sim/VERSION)" >> "${GITHUB_OUTPUT}"

    # Restore the newest cache with this name.
    - name: Restore caches
      if: >-
        !(github.ref == 'refs/heads/main' &&
          contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event_name))
      uses: actions/cache/restore@v4
      with:
        path: |
          /isaac-sim/kit/cache
          ~/.cache/warp
        key: ci-caches-${{ steps.read_isaac_sim_version.outputs.isaac_sim_version }}-${{ inputs.cache-name }}-${{ github.run_id }}
        restore-keys: |
          ci-caches-${{ steps.read_isaac_sim_version.outputs.isaac_sim_version }}-${{ inputs.cache-name }}-

    # actions/cache automatically saves the paths in a step at the end of a successful job
    # when its key was not found. The key is new on every run, so it always saves.
    - name: Save caches at the end of the job
      if: >-
        github.ref == 'refs/heads/main' &&
        contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event_name)
      uses: actions/cache@v4
      with:
        path: |
          /isaac-sim/kit/cache
          ~/.cache/warp
        key: ci-caches-${{ steps.read_isaac_sim_version.outputs.isaac_sim_version }}-${{ inputs.cache-name }}-${{ github.run_id }}

    # The Lightwheel cache holds only the floorplan and object directories. The `login/`
    # directory next to them holds the credential file `account.json` and must never be cached.
    # The SDK leaves object/<Name>.zip behind after extraction (about half of the object
    # directory); lookups use the extracted files, so the zips are excluded.
    - name: Create Lightwheel cache directories
      if: inputs.lightwheel == 'true'
      shell: bash
      run: mkdir -p "${HOME}/.cache/lightwheel_sdk/floorplan" "${HOME}/.cache/lightwheel_sdk/object"

    # Restore the newest Lightwheel cache with this name. Keep the paths identical to the save
    # step below, because the cache version hash depends on them.
    - id: restore_lightwheel
      name: Restore Lightwheel cache
      if: >-
        inputs.lightwheel == 'true' &&
        !(github.ref == 'refs/heads/main' &&
          contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event_name))
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cache/lightwheel_sdk/floorplan
          ~/.cache/lightwheel_sdk/object
          !~/.cache/lightwheel_sdk/object/*.zip
        key: lw-assets-v1-${{ inputs.cache-name }}-${{ github.run_id }}
        restore-keys: |
          lw-assets-v1-${{ inputs.cache-name }}-

    # On the nightly run, restore the newest cache and save the result at the end of a
    # successful job under a new key. Keep the paths identical to the restore step above.
    - id: restore_and_save_lightwheel
      name: Restore Lightwheel cache and save it at the end of the job
      if: >-
        inputs.lightwheel == 'true' &&
        github.ref == 'refs/heads/main' &&
        contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event_name)
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/lightwheel_sdk/floorplan
          ~/.cache/lightwheel_sdk/object
          !~/.cache/lightwheel_sdk/object/*.zip
        key: lw-assets-v1-${{ inputs.cache-name }}-${{ github.run_id }}
        restore-keys: |
          lw-assets-v1-${{ inputs.cache-name }}-

    - name: Print Lightwheel cache contents
      if: inputs.lightwheel == 'true'
      shell: bash
      env:
        MATCHED_KEY: ${{ steps.restore_lightwheel.outputs.cache-matched-key || steps.restore_and_save_lightwheel.outputs.cache-matched-key }}
      run: |
        echo "Lightwheel cache restored from: ${MATCHED_KEY:-nothing (cache miss)}"
        du -sh "${HOME}/.cache/lightwheel_sdk/floorplan" "${HOME}/.cache/lightwheel_sdk/object"

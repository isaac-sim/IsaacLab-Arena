name: Setup caches
description: |
  We cache certain directories to reduce time spent resolving assets and compiling shaders:
    * Isaac Sim (kit cache RTX shaders and the PhysX mesh cooking cache)
    * Warp kernel cache
    * Lightwheel SDK asset cache


  Caching behavior depends on the type of CI run:

                  RESTORED      SAVED
    PREMERGE:        yes         no
    POSTMERGE:       yes         yes
    NIGHTLY:         no          yes

  Note that we let NIGHTLY job start from a cold cache in order to prune entries that are stale or no longer
  used. POSTMERGE runs from a warm cache to reduce the risk of unavailable asset endpoints.

inputs:
  cache-name:
    description: |
      Name of the cache. Use one name per job type. The jobs run different tests, so
      each warms different shaders, meshes and kernels. A restore picks the newest cache
      with the same name, so jobs sharing a name would restore whichever job saved last.
    required: true

runs:
  using: composite
  steps:
    - id: read_isaac_sim_version
      name: Read Isaac Sim version
      shell: bash
      run: echo "isaac_sim_version=$(cat /isaac-sim/VERSION)" >> "${GITHUB_OUTPUT}"

    # Restore the newest cache id
    - id: restore_caches
      name: Restore caches
      if: github.ref != 'refs/heads/main' # PREMERGE only
      uses: actions/cache/restore@v4 # Only restore. no save
      with:
        # For LightWheel we cache only floorplan and object directories, excluding stray zip
        # files. login/ must never be cached because it holds credentials.
        path: |
          /isaac-sim/kit/cache
          ~/.cache/warp
          ~/.cache/lightwheel_sdk/floorplan
          ~/.cache/lightwheel_sdk/object
          !~/.cache/lightwheel_sdk/object/*.zip
        key: ci-caches-${{ steps.read_isaac_sim_version.outputs.isaac_sim_version }}-${{ inputs.cache-name }}-${{ github.run_id }}
        restore-keys: |
          ci-caches-${{ steps.read_isaac_sim_version.outputs.isaac_sim_version }}-${{ inputs.cache-name }}-

    # Restore and save cache
    - id: restore_and_save_caches
      name: Restore caches and save them at the end of the job
      if: github.ref == 'refs/heads/main' # POSTMERGE and NIGHTLY
      uses: actions/cache@v4 # Default: restore and saves
      with:
        path: |
          /isaac-sim/kit/cache
          ~/.cache/warp
          ~/.cache/lightwheel_sdk/floorplan
          ~/.cache/lightwheel_sdk/object
          !~/.cache/lightwheel_sdk/object/*.zip
        # Key for new saved cache
        key: ci-caches-${{ steps.read_isaac_sim_version.outputs.isaac_sim_version }}-${{ inputs.cache-name }}-${{ github.run_id }}
        # Key from previous run
        restore-keys: ${{ github.event_name != 'schedule' && format('ci-caches-{0}-{1}-', steps.read_isaac_sim_version.outputs.isaac_sim_version, inputs.cache-name) || '' }}

    - name: Print restored cache
      shell: bash
      env:
        MATCHED_KEY: ${{ steps.restore_caches.outputs.cache-matched-key || steps.restore_and_save_caches.outputs.cache-matched-key }}
      run: |
        echo "Caches restored from: ${MATCHED_KEY:-nothing (cache miss or nightly run)}"
        du -sh /isaac-sim/kit/cache ~/.cache/warp ~/.cache/lightwheel_sdk/* 2>/dev/null || true

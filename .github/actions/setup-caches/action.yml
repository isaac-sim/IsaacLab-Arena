name: Setup caches
description: |
  Restore the caches that speed up CI test jobs from the GitHub Actions cache: the Isaac
  Sim kit cache (/isaac-sim/kit/cache: RTX shaders and the PhysX mesh cooking cache in
  DerivedDataCache) and the Warp kernel cache (~/.cache/warp). Call once before the tests.

  The nightly run on main (and manual dispatches on main) starts without a restored
  cache and saves one at the end of a successful job, so the saved cache holds only
  what that run used. Every other run restores the newest saved cache.

inputs:
  cache-name:
    description: |
      Name of the cache. Use one name per job type, because the jobs warm different
      caches and a restore picks the newest cache with the same name.
    required: true

runs:
  using: composite
  steps:
    - id: read_isaac_sim_version
      name: Read Isaac Sim version
      shell: bash
      run: echo "isaac_sim_version=$(cat /isaac-sim/VERSION)" >> "${GITHUB_OUTPUT}"

    # Restore the newest cache with this name.
    # FIXME(before merge): the "-prtest" suffix keeps PR runs from reading or
    # overwriting the caches that main uses; remove it so PRs restore main's caches.
    - name: Restore caches
      if: >-
        !((github.ref == 'refs/heads/main' &&
           contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event_name)) ||
          github.event_name == 'pull_request')
      uses: actions/cache/restore@v4
      with:
        path: |
          /isaac-sim/kit/cache
          ~/.cache/warp
        key: ci-caches-${{ steps.read_isaac_sim_version.outputs.isaac_sim_version }}-${{ inputs.cache-name }}-${{ github.run_id }}
        restore-keys: |
          ci-caches-${{ steps.read_isaac_sim_version.outputs.isaac_sim_version }}-${{ inputs.cache-name }}-

    # actions/cache automatically saves the paths in a step at the end of a successful job
    # when its key was not found. The key is new on every run, so it always saves.
    # FIXME(before merge): drop the pull_request clause, which lets a PR save its own
    # "-prtest" cache so a re-run of the same PR run tests the restore.
    - name: Save caches at the end of the job
      if: >-
        (github.ref == 'refs/heads/main' &&
         contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event_name)) ||
        github.event_name == 'pull_request'
      uses: actions/cache@v4
      with:
        path: |
          /isaac-sim/kit/cache
          ~/.cache/warp
        key: ci-caches-${{ steps.read_isaac_sim_version.outputs.isaac_sim_version }}-${{ inputs.cache-name }}${{ github.event_name == 'pull_request' && '-prtest' || '' }}-${{ github.run_id }}

# A spoon starts on the counter; opening the drawer moves the task's live containment target.
env_name: lightwheel_kitchen_drawer_body_reference
embodiment:
  id: robot
  registry_name: droid_abs_joint_pos
  params:
    initial_pose:
      position_xyz: [2.75, -3.0, 0.0]
      rotation_xyzw: [0.0, 0.0, 0.0, 1.0]
background:
  id: kitchen
  registry_name: lightwheel_kitchen_u_shaped_with_island_farmhouse2
objects:
- id: spoon
  registry_name: spoon_1_handal_robolab
object_references:
- id: counter
  parent_id: kitchen
  prim_path: counter_1_main_group/top_geometry
  object_type: base
- id: cabinet
  parent_id: kitchen
  prim_path: island_cab_right_island_group_4
  object_type: articulation
  params:
    openable_joint_name: drawer_door_joint
    # Keep the authored closed placement pose: this asset's scaled joint targets do not support offline posing.
    initial_joint_positions:
      drawer_door_joint: 0.0
- id: drawer
  kind: articulation_body
  parent_id: cabinet
  prim_path: drawer_door
relations:
- kind: is_anchor
  subject: counter
- kind: is_anchor
  subject: drawer
- kind: 'on'
  subject: spoon
  reference: counter
placer_params:
  min_unique_layouts_per_env: 1
task:
  composition: sequential
  description: Open the island drawer and put the spoon inside it.
  subtasks:
  - kind: OpenDoorTask
    params:
      openable_object: cabinet
      reset_openness: 0.0
  - kind: ObjectInTask
    params:
      object: spoon
      target: drawer

env_name: pick_and_place_object_variants_maple_table
embodiment:
  id: franka_ik
  registry_name: franka_ik
background:
  id: maple_table_robolab
  registry_name: maple_table_robolab
objects:
- id: bowl_ycb_robolab
  registry_name: bowl_ycb_robolab
- id: pick_up_object
  variants:
  - registry_name: sweet_potato
  - registry_name: jug
  assign_variants_to_environments: random
relations:
- kind: is_anchor
  subject: maple_table_robolab
- kind: 'on'
  subject: bowl_ycb_robolab
  reference: maple_table_robolab
- kind: 'on'
  subject: pick_up_object
  reference: maple_table_robolab
task:
  composition: atomic
  description: pick up the object and place it in the bowl
  subtasks:
  - kind: PickAndPlaceTask
    params:
      pick_up_object: pick_up_object
      destination_location: bowl_ycb_robolab
      background_scene: maple_table_robolab

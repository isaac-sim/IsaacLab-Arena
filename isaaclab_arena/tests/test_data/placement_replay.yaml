env_name: placement_replay
embodiment:
  id: robot
  registry_name: franka_ik
  params:
    initial_pose:
      position_xyz: [-1.0, 0.0, 0.0]
background:
  id: table
  registry_name: office_table_background
objects:
- id: cube_0
  registry_name: dex_cube
- id: cube_1
  registry_name: dex_cube
- id: cube_2
  registry_name: dex_cube
- id: cube_3
  registry_name: dex_cube
relations:
- kind: is_anchor
  subject: table
- kind: 'on'
  subject: cube_0
  reference: table
- kind: 'on'
  subject: cube_1
  reference: table
- kind: 'on'
  subject: cube_2
  reference: table
- kind: 'on'
  subject: cube_3
  reference: table
task:
  composition: atomic
  description: move a cube
  subtasks:
  - kind: PickAndPlaceTask
    params:
      pick_up_object: cube_0
      destination_location: cube_1
      background_scene: table

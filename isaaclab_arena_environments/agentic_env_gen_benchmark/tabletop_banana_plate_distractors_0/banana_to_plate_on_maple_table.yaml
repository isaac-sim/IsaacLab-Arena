env_name: banana_to_plate_on_maple_table
embodiment:
  id: droid
  registry_name: droid_abs_joint_pos
  params: {}
background:
  id: maple_table
  registry_name: maple_table_robolab
  params: {}
objects:
- id: banana
  registry_name: banana_ycb_robolab
  params: {}
- id: plate
  registry_name: plate_large_vomp_robolab
  params: {}
relations:
- kind: is_anchor
  subject: maple_table
  params: {}
- kind: 'on'
  subject: banana
  reference: maple_table
  params: {}
- kind: 'on'
  subject: plate
  reference: maple_table
  params: {}
task:
  composition: atomic
  description: Pick up the banana from the maple table and place it on the plate.
  subtasks:
  - kind: PickAndPlaceTask
    params:
      pick_up_object: banana
      destination_location: plate
      background_scene: maple_table
      destination_object: plate

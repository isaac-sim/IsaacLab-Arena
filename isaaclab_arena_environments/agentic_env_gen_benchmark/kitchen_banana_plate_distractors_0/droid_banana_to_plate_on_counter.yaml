env_name: droid_banana_to_plate_on_counter
embodiment:
  id: droid
  registry_name: droid_abs_joint_pos
  params:
    stand_height_m: 0.8
    placement_bbox_stand_only: true
    collision_mode: mesh
background:
  id: kitchen
  registry_name: lightwheel_kitchen_one_wall_coastal
  params:
    collision_mode: mesh
    repair_collision_mesh_non_watertight: false
objects:
- id: banana
  registry_name: banana_ycb_robolab
  params: {}
- id: plate
  registry_name: plate_large_vomp_robolab
  params: {}
object_references:
- id: counter_top
  parent_id: kitchen
  prim_path: counter_main_main_group/top_geometry_right
  object_type: base
  params: {}
- id: floor
  parent_id: kitchen
  prim_path: floor_room/geometry
  object_type: base
  params: {}
relations:
- kind: is_anchor
  subject: counter_top
  params: {}
- kind: is_anchor
  subject: floor
  params: {}
- kind: 'on'
  subject: banana
  reference: counter_top
  params: {}
- kind: 'on'
  subject: plate
  reference: counter_top
  params: {}
- kind: 'on'
  subject: droid
  reference: floor
  params: {}
- kind: next_to
  subject: droid
  reference: counter_top
  params:
    side: negative_y
    distance_m: 0.3
- kind: rotate_around_solution
  subject: droid
  params:
    yaw_rad: 1.57
task:
  composition: atomic
  description: Pick up the banana from the counter top and place it on the plate.
  subtasks:
  - kind: PickAndPlaceTask
    params:
      pick_up_object: banana
      destination_location: plate
      background_scene: kitchen
      destination_object: plate

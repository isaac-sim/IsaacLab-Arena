env_name: franka_pick_cube_into_bowl_office_table
embodiment:
  id: robot
  registry_name: franka_ik
  params:
    initial_pose:
      position_xyz: [-0.55, 0.0, 0.53]
background:
  id: table
  registry_name: office_table_background
objects:
- id: cube
  registry_name: dex_cube
- id: bowl
  registry_name: bowl_ycb_robolab
relations:
- kind: is_anchor
  subject: table
- kind: 'on'
  subject: cube
  reference: table
  params:
    clearance_m: 0.001
- kind: at_position
  subject: cube
  params:
    x: 0.0
- kind: 'on'
  subject: bowl
  reference: table
  params:
    clearance_m: 0.001
- kind: at_position
  subject: bowl
  params:
    x: 0.0
task:
  composition: atomic
  description: Pick up the cube and place it into the bowl on the table.
  subtasks:
  - kind: PickAndPlaceTask
    params:
      pick_up_object: cube
      destination_location: bowl
      background_scene: table

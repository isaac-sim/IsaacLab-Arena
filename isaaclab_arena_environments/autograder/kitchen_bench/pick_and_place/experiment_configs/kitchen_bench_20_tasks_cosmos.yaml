# Runs every kitchen_bench PickAndPlaceTask environment with the Cosmos policy (20 runs).
# See kitchen_bench_20_tasks_pi0.yaml for the same environments under the OpenPI (pi0) policy.
#
# Values under shared are used by every Run below.
# A Run only needs to list what is different; its values override the shared ones.
# To change a shared value for every Run on the command line:
# - with experiment_runner.py, use shared.<path>=<value>
# - with osmo/submit_arena_experiment.py, use experiment_cfg.shared.<path>=<value>
shared:
  environment:
    enable_cameras: true
  environment_builder:
    num_envs: 5
    record_trajectories: true
  policy:
    type: isaaclab_arena_cosmos.policy.cosmos_remote_policy.CosmosRemotePolicy
    cosmos_embodiment_adapter: droid
    policy_device: cuda:0
    remote_host: 127.0.0.1
    remote_port: 8000
  rollout_limit:
    num_episodes: 10

runs:

  kitchen_bench_lightwheel_pick_and_place_cosmos:
    environment:
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_lightwheel_pick_and_place.yaml

  kitchen_bench_lightwheel_pick_lemon_shelf_on_plate_u_shaped_with_island_farmhouse2_cosmos:
    environment:
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_lightwheel_pick_lemon_shelf_on_plate_u_shaped_with_island_farmhouse2.yaml

  kitchen_bench_lightwheel_place_bananas_in_wooden_bowl_u_shaped_with_island_farmhouse2_cosmos:
    environment:
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_lightwheel_place_bananas_in_wooden_bowl_u_shaped_with_island_farmhouse2.yaml

  kitchen_bench_lightwheel_place_ladle_in_plate_g_shaped_large_scandinavian_cosmos:
    environment:
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_lightwheel_place_ladle_in_plate_g_shaped_large_scandinavian.yaml

  kitchen_bench_lightwheel_place_lime_in_wooden_bowl_l_shaped_scandinavian_cosmos:
    environment:

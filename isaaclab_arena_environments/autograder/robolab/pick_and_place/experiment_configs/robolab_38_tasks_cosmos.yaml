# Every robolab PickAndPlaceTask environment run with the Cosmos policy (38 runs).
# See robolab_38_tasks_pi0.yaml for the same environments under the OpenPI (pi0) policy.
#
# Values under shared are used by every Run below.
# A Run only needs to list what is different; its values override the shared ones.
# To change a shared value for every Run on the command line:
# - with experiment_runner.py, use shared.<path>=<value>
# - with osmo/submit_arena_experiment.py, use experiment_cfg.shared.<path>=<value>
shared:
  environment:
    enable_cameras: true
  environment_builder:
    num_envs: 5
    record_trajectories: true
  policy:
    type: isaaclab_arena_cosmos.policy.cosmos_remote_policy.CosmosRemotePolicy
    cosmos_embodiment_adapter: droid
    policy_device: cuda:0
    remote_host: 127.0.0.1
    remote_port: 8000
  rollout_limit:
    num_episodes: 10
  variations:
    light:
      hdr_image:
        enabled: true
        hdr_names: ["home_office_robolab"]
    droid_abs_joint_pos:
      camera_extrinsics_wrist_camera:
        enabled: false
        sampler_cfg:
          low: [-0.05, -0.05, -0.05]
          high: [0.05, 0.05, 0.05]

runs:

  apple_and_yogurt_in_bowl_cosmos:
    environment:
      type: isaaclab_arena_environments/robolab/tasks/apple_and_yogurt_in_bowl.yaml


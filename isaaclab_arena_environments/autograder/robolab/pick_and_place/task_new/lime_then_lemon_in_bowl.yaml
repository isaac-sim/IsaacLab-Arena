env_name: lime_then_lemon_in_bowl
external_yaml: ../scenes_new/lime_lemon_orange_bowl.yaml
task:
  composition: sequential
  description: Put the lime in the bowl, then the lemon.
  subtasks:
  - kind: PickAndPlaceTask
    params:
      pick_up_object: lime
      destination_location: bowl
      background_scene: maple_table_robolab

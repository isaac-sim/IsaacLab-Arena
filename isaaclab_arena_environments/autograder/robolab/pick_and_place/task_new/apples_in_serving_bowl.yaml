env_name: apples_in_serving_bowl
external_yaml: ../scenes_new/two_apples_pepper_bowl.yaml
task:
  composition: parallel
  description: Put both apples in the serving bowl.
  subtasks:
  - kind: PickAndPlaceTask
    params:
      pick_up_object: apple_1
      destination_location: serving_bowl
      background_scene: maple_table_robolab
      episode_length_s: 70.0
  - kind: PickAndPlaceTask
    params:
      pick_up_object: apple_2
      destination_location: serving_bowl
      background_scene: maple_table_robolab
      episode_length_s: 70.0

env_name: sugar_box_then_cheez_it_in_bin
external_yaml: ../scenes_new/sugar_cheezit_jello_bin.yaml
task:
  composition: sequential
  description: Put the sugar box in the bin, then the Cheez-It box.
  subtasks:
  - kind: PickAndPlaceTask
    params:
      pick_up_object: sugar_box
      destination_location: bin
      background_scene: maple_table_robolab
      episode_length_s: 70.0
  - kind: PickAndPlaceTask
    params:
      pick_up_object: cheez_it
      destination_location: bin
      background_scene: maple_table_robolab
      episode_length_s: 70.0

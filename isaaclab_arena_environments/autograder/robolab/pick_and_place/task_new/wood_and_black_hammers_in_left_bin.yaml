env_name: wood_and_black_hammers_in_left_bin
external_yaml: ../scenes_new/three_hammers_two_bins.yaml
task:
  composition: parallel
  description: Put the wood hammer and the black hammer in the left bin.
  subtasks:
  - kind: PickAndPlaceTask
    params:
      pick_up_object: wood_hammer
      destination_location: grey_bin_left
      background_scene: maple_table_robolab
      episode_length_s: 70.0
  - kind: PickAndPlaceTask
    params:
      pick_up_object: black_hammer
      destination_location: grey_bin_left
      background_scene: maple_table_robolab
      episode_length_s: 70.0

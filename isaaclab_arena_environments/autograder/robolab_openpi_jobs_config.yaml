# Equivalent of eval_jobs_configs/robolab_openpi_jobs.config.json (38 OpenPI runs).
# Values under shared are used by every Run below.
# A Run only needs to list what is different; its values override the shared ones.
# To change a shared value for every Run on the command line:
# - with experiment_runner.py, use shared.<path>=<value>
# - with osmo/submit_arena_experiment.py, use experiment_cfg.shared.<path>=<value>
shared:
  environment:
    enable_cameras: true
  environment_builder:
    num_envs: 1
    record_trajectories: true
  # The dome-light HDR is drawn once per environment build, so every episode of a Run shares
  # one background. capture_hdr_backgrounds.sh overrides hdr_names to sweep one background per
  # invocation; a shared override can only replace a path declared here.
  variations:
    light:
      hdr_image:
        enabled: true
        hdr_names: ["home_office_robolab"]
  policy:
    type: isaaclab_arena_openpi.policy.pi0_remote_policy.Pi0RemotePolicy
    policy_variant: pi05
    policy_device: cuda:0
    remote_host: 127.0.0.1
    remote_port: 8003
    openpi_embodiment_adapter: droid
  rollout_limit:
    num_episodes: 10

runs:

  apple_and_yogurt_in_bowl:
    environment:
      type: isaaclab_arena_environments/robolab/tasks/apple_and_yogurt_in_bowl.yaml
    environment_builder:
      language_instruction: Put the apple and yogurt in the bowl.

  bagels_on_plate:
    environment:
      type: isaaclab_arena_environments/robolab/tasks/bagels_on_plate.yaml
    environment_builder:
      language_instruction: Put the bagels on the plate.

  banana_in_bowl:

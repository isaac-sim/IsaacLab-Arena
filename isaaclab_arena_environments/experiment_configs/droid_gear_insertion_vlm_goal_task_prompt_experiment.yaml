# VLMGoalPolicy on gear insertion from camera images and robot state, with the gear geometry and an insertion
# strategy added to the prompt.
runs:
  droid_gear_insertion_vlm_goal_task_prompt:
    environment:
      type: gear_insertion
      enable_cameras: true
      embodiment: droid_abs_ik
    environment_builder:
      num_envs: 1
      # The three gear insertion VLM experiments share this seed, so they run on the same layouts.
      seed: 42
      language_instruction: >-
        Pick up the loose gear on the table and insert it onto the middle peg of the gear base,
        so the gear slides down the peg and sits flat on the base.
    policy:
      type: isaaclab_arena_vlm_agent.vlm_agent_policy.VLMGoalPolicy
      endpoint: internal  # internal, public, or openai
      # The model must be served by the endpoint; null selects the endpoint's default model.
      model: openai/openai/gpt-6-astra
      vlm_embodiment_adapter: droid
      observation_modality: image_state
      # Send the DROID cameras' full 1280x720 images.
      image_max_width_or_height: 1280
      max_steps_per_goal: 30
      # Match GearInsertionCriteria: 3.5 mm lateral error and 5 degrees from upright.
      position_tolerance_m: 0.0035
      rotation_tolerance_rad: 0.0873
      system_prompt_files:
        - isaaclab_arena_environments/experiment_configs/prompts/droid_gear_insertion.txt
    rollout_limit:
      num_episodes: 5

# Uses the production dimensions declared by the maintained DROID camera rig.
shared:
  environment:
    type: pick_and_place_maple_table
    enable_cameras: true
    embodiment: droid_rel_joint_pos
    pick_up_object: rubiks_cube_hot3d_robolab
    destination_location: bowl_ycb_robolab
    hdr: home_office_robolab
  environment_builder:
    num_envs: 1
    env_spacing: 2.5
    seed: 42
    placement_seed: 42
    language_instruction: Pick up the Rubik's cube and place it in the bowl.
  policy:
    type: zero_action
  rollout_limit:
    # Provisional smoke length; replace with the agreed benchmark rollout length before PerfLab handoff.
    num_steps: 10
  num_rebuilds: 1

runs:
  production_camera_baseline: {}

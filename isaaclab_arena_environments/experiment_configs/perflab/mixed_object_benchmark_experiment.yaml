shared:
  environment:
    type: pick_and_place_maple_table
    embodiment: droid_rel_joint_pos
    object_set:
    - apple_01_objaverse_robolab
    - apple_02_objaverse_robolab
    - avocado01_fruits_veggies_robolab
    - lemon_01_fruits_veggies_robolab
    - lemon_02_fruits_veggies_robolab
    - lime01_fruits_veggies_robolab
    - orange_01_fruits_veggies_robolab
    - orange_02_fruits_veggies_robolab
    - pomegranate01_fruits_veggies_robolab
    - lychee01_fruits_veggies_robolab
    destination_location: bowl_ycb_robolab
    enable_cameras: false
  environment_builder:
    num_envs: 1
    env_spacing: 2.5
    seed: 42
    placement_seed: 42
    language_instruction: Pick up the fruit and place it in the bowl.
  policy:
    type: zero_action
  rollout_limit:
    # Provisional smoke length; replace with the agreed benchmark rollout length before PerfLab handoff.
    num_steps: 10
  num_rebuilds: 1

runs:
  mixed_object_workload: {}

# Run inside the Arena runtime with NV_API_KEY set:
# /isaac-sim/python.sh isaaclab_arena/evaluation/experiment_runner.py --headless \
#   --experiment_config isaaclab_arena_environments/experiment_configs/droid_pnp_vlm_experiment.yaml
# Override endpoint/model/base_url as needed. Credentials stay in the environment.
# The droid preset supplies absolute-pose adapters, Robotiq measurements, and strategy-specific prompts.
# Set policy.system_prompt to override its default prompt.
runs:
  droid_pnp_vlm_step:
    environment: &environment
      type: pick_and_place_maple_table
      enable_cameras: true
      embodiment: droid_abs_ik
      pick_up_object: rubiks_cube_hot3d_robolab
      destination_location: bowl_ycb_robolab
      hdr: home_office_robolab
    environment_builder: &builder
      num_envs: 1
      language_instruction: Pick up the Rubik's cube and place it in the bowl.
    policy:
      type: isaaclab_arena_vlm_agent.vlm_agent_policy.VLMStepPolicy
      endpoint: internal
      vlm_embodiment_adapter: droid
      observation_modality: image_state
    rollout_limit: &rollout
      num_episodes: 1

  droid_pnp_vlm_chunk:
    environment: *environment
    environment_builder: *builder
    policy:
      type: isaaclab_arena_vlm_agent.vlm_agent_policy.VLMChunkPolicy
      endpoint: internal
      vlm_embodiment_adapter: droid
      observation_modality: image_state
      chunk_size: 3
    rollout_limit: *rollout

  droid_pnp_vlm_goal:
    environment: *environment
    environment_builder: *builder
    policy:
      type: isaaclab_arena_vlm_agent.vlm_agent_policy.VLMGoalPolicy
      endpoint: internal
      vlm_embodiment_adapter: droid
      observation_modality: image_state
      max_steps_per_goal: 30
    rollout_limit: *rollout

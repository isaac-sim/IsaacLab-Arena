# Typed YAML equivalent of eval_jobs_configs/getting_started_jobs_config.json.
# Values under shared are used by every Run below.
# A Run only needs to list what is different; its values override the shared ones.
# Use shared.<path>=<value> on the command line to change a value for all Runs.
shared:
  environment:
    type: pick_and_place_maple_table
    embodiment: droid_rel_joint_pos
    pick_up_object: rubiks_cube_hot3d_robolab
    destination_location: bowl_ycb_robolab
    hdr: home_office_robolab
    # Short demo timeout in simulated time, not wall-clock time.
    episode_length_s: 1.5
  policy:
    type: zero_action
  rollout_limit:
    num_episodes: 1

runs:
  baseline: {}

  swap_objects:
    environment:
      pick_up_object: mustard_bottle_hot3d_robolab
      destination_location: wooden_bowl_hot3d_robolab

  change_background_hdr:
    environment:
      hdr: billiard_hall_robolab

  parallel_envs:
    environment_builder:
      num_envs: 64
      env_spacing: 2.5

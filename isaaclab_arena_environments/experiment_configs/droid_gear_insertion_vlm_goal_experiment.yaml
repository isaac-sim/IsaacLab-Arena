# VLMGoalPolicy on gear insertion, with three ways for the model to locate the gear and the pegs:
# - images: camera images and robot state only.
# - object_poses: also the exact gear and target poses, as privileged state.
# - pixel_measurement: the model zooms into images and measures 3D points from camera depth.
# Run inside the Arena runtime with NV_API_KEY set, from the repository root so the prompt files are found:
# python isaaclab_arena/evaluation/experiment_runner.py --viz none \
#   --experiment_config isaaclab_arena_environments/experiment_configs/droid_gear_insertion_vlm_goal_experiment.yaml
# Add ~runs.<name> to skip a Run, for example ~runs.images.
shared:
  environment:
    type: gear_insertion
    enable_cameras: true
    embodiment: droid_abs_ik
    camera_depth: true
  environment_builder:
    num_envs: 1
    language_instruction: >-
      Pick up the loose gear on the table and insert it onto the middle peg of the gear base,
      so the gear slides down the peg and sits flat on the base.
  policy:
    type: isaaclab_arena_vlm_agent.vlm_agent_policy.VLMGoalPolicy
    endpoint: internal
    vlm_embodiment_adapter: droid
    observation_modality: image_state
    # Send the DROID cameras' full 1280x720 images.
    image_max_width_or_height: 1280
    max_steps_per_goal: 30
    # Match GearInsertionCriteria: 3.5 mm lateral error and 5 degrees from upright.
    position_tolerance_m: 0.0035
    rotation_tolerance_rad: 0.0873
    system_prompt_files:
      - isaaclab_arena_environments/experiment_configs/prompts/droid_gear_insertion.txt
  rollout_limit:
    num_episodes: 5

runs:
  images: {}

  object_poses:
    policy:
      object_poses: [gear_insertion_medium_gear, medium_gear_target]
      system_prompt_files:
        - isaaclab_arena_environments/experiment_configs/prompts/droid_gear_insertion.txt
        - isaaclab_arena_environments/experiment_configs/prompts/droid_gear_insertion_object_poses.txt

  pixel_measurement:
    policy:
      pixel_measurement: true
      system_prompt_files:
        - isaaclab_arena_environments/experiment_configs/prompts/droid_gear_insertion.txt
        - isaaclab_arena_environments/experiment_configs/prompts/droid_gear_insertion_pixel_measurement.txt

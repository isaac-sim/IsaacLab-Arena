# Run the GR1 table scene, whose objects are placed on the table by the relation solver.
# The scene has no task, so the zero-action policy is enough to inspect the placement.
# episode_length_s adds a time-out, so every environment resets after 4 simulated seconds.
# Add runs.multi_object_table.environment.mode=heterogeneous on the command line
# to place robolab objects instead, including object sets from which each
# environment draws a random member.
runs:
  multi_object_table:
    environment:
      type: gr1_table_multi_object_no_collision
      enable_cameras: true
      embodiment: gr1_joint
      episode_length_s: 4.0
      # This environment uses tiled cameras when num_envs is greater than 1.
      # Keep it equal to environment_builder.num_envs.
      num_envs: 16
    environment_builder:
      num_envs: 16
      env_spacing: 4.0
    policy:
      type: zero_action
    rollout_limit:
      num_steps: 500

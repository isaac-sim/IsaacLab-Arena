# Run two registered example environments with the zero-action policy.
# environment.type selects an environment by its registered name.
# The other keys below environment set fields of that environment's configuration.
shared:
  policy:
    type: zero_action
  rollout_limit:
    num_steps: 100

runs:
  kitchen_pick_and_place:
    environment:
      type: kitchen_pick_and_place
      object: cracker_box
      embodiment: gr1_joint

  gr1_open_microwave:
    environment:
      type: gr1_open_microwave
      object: tomato_soup_can

# Places a Droid next to a Lightwheel kitchen counter with spatial relations.
# The environment is an ArenaEnvGraphSpec YAML, selected by its path from the
# repository root.
runs:
  robot_placement:
    environment:
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_lightwheel_pick_and_place.yaml
    policy:
      type: zero_action
    rollout_limit:
      num_steps: 100

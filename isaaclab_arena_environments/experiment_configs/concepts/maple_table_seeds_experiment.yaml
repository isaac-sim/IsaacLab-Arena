# Locks the environment seed and the placement seed.
runs:
  locked_seeds:
    environment:
      type: pick_and_place_maple_table
    environment_builder:
      # Build-time and run-time variation values, and simulation randomness
      # such as reset noise.
      seed: 42
      # Object layouts from the relation solver.
      placement_seed: 7
    policy:
      type: zero_action
    rollout_limit:
      num_steps: 100

# Locks both random streams used when building and running an environment.
runs:
  locked_seeds:
    environment:
      type: pick_and_place_maple_table
    environment_builder:
      # Simulation randomness after the environment is created, including
      # run-time variation draws.
      seed: 42
      # Relation-solver layouts and random object-set member assignment.
      placement_seed: 7
    policy:
      type: zero_action
    rollout_limit:
      num_steps: 100

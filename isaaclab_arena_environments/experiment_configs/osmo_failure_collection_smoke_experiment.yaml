# OSMO smoke test for collecting successful Runs when other Runs fail.
# The two expected_failure Runs are intentionally invalid. The collector should
# complete, report all four execution statuses, and include episode results only
# from the two expected_success Runs.
runs:
  expected_success_rubiks_cube:
    environment:
      type: pick_and_place_maple_table
      enable_cameras: true
      embodiment: droid_abs_joint_pos
      pick_up_object: rubiks_cube_hot3d_robolab
      destination_location: bowl_ycb_robolab
      hdr: home_office_robolab
    environment_builder:
      language_instruction: Pick up the Rubik's cube and place it in the bowl.
    policy:
      type: isaaclab_arena_openpi.policy.pi0_remote_policy.Pi0RemotePolicy
      policy_variant: pi05
      policy_device: cuda:0
      remote_host: 127.0.0.1
      remote_port: 8000
      openpi_embodiment_adapter: droid
    rollout_limit:
      num_episodes: 1

  expected_success_mustard_bottle:
    environment:
      type: pick_and_place_maple_table
      enable_cameras: true
      embodiment: droid_abs_joint_pos
      pick_up_object: mustard_bottle_hot3d_robolab
      destination_location: wooden_bowl_hot3d_robolab
      hdr: kiara_interior_robolab
    environment_builder:
      language_instruction: Pick up the mustard bottle and place it in the bowl.
    policy:
      type: isaaclab_arena_openpi.policy.pi0_remote_policy.Pi0RemotePolicy
      policy_variant: pi05
      policy_device: cuda:0
      remote_host: 127.0.0.1
      remote_port: 8000
      openpi_embodiment_adapter: droid
    rollout_limit:
      num_episodes: 1

  expected_failure_unknown_pick_up_object:
    environment:
      type: pick_and_place_maple_table
      enable_cameras: true
      embodiment: droid_abs_joint_pos
      # This valid field accepts a string, but the runner cannot resolve this asset.
      pick_up_object: intentionally_missing_pick_up_object_for_osmo_smoke_test
      destination_location: bowl_ycb_robolab
      hdr: home_office_robolab
    environment_builder:
      language_instruction: This Run is expected to fail before policy construction.
    policy:
      type: isaaclab_arena_openpi.policy.pi0_remote_policy.Pi0RemotePolicy
      policy_variant: pi05
      policy_device: cuda:0
      remote_host: 127.0.0.1
      remote_port: 8000
      openpi_embodiment_adapter: droid
    rollout_limit:
      num_episodes: 1

  expected_failure_unknown_policy_adapter:
    environment:
      type: pick_and_place_maple_table
      enable_cameras: true
      embodiment: droid_abs_joint_pos
      pick_up_object: rubiks_cube_hot3d_robolab
      destination_location: bowl_ycb_robolab
      hdr: home_office_robolab
    environment_builder:
      language_instruction: This Run is expected to fail after environment construction.
    policy:
      type: isaaclab_arena_openpi.policy.pi0_remote_policy.Pi0RemotePolicy
      policy_variant: pi05
      policy_device: cuda:0
      remote_host: 127.0.0.1
      remote_port: 8000
      # This adapter is resolved only when the runner constructs the policy.
      openpi_embodiment_adapter: intentionally_missing_adapter_for_osmo_smoke_test
    rollout_limit:
      num_episodes: 1

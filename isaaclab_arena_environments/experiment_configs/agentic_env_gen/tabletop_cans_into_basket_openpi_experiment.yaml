# Evaluates the OpenPI policy on the generated composite task where DROID places the
# beverage can and the bean can into the mini plastic basket.
# The environment spec is under shared, so the command line can select another spec,
# such as one you generated, with shared.environment.type=<path>.yaml.
shared:
  environment:
    type: isaaclab_arena_environments/maple_table_top/simready_droid_pick_place_cans_hammer_maple_table.yaml
    enable_cameras: true

runs:
  tabletop_cans_into_basket_openpi:
    environment_builder:
      num_envs: 1
    policy:
      type: isaaclab_arena_openpi.policy.pi0_remote_policy.Pi0RemotePolicy
      policy_variant: pi05
      policy_device: cuda:0
      remote_host: 127.0.0.1
      remote_port: 8000
      openpi_embodiment_adapter: droid
    rollout_limit:
      num_episodes: 3

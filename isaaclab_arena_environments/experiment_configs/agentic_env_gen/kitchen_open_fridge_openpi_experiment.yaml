# Evaluates the OpenPI policy on the generated kitchen environment where DROID opens the fridge door.
# The environment spec is under shared, so the command line can select another spec,
# such as one you generated, with shared.environment.type=<path>.yaml.
shared:
  environment:
    type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_lightwheel_open_fridge.yaml
    enable_cameras: true

runs:
  kitchen_open_fridge_openpi:
    environment_builder:
      num_envs: 1
    policy:
      type: isaaclab_arena_openpi.policy.pi0_remote_policy.Pi0RemotePolicy
      policy_variant: pi05
      policy_device: cuda:0
      remote_host: 127.0.0.1
      remote_port: 8000
      openpi_embodiment_adapter: droid
    rollout_limit:
      num_episodes: 2

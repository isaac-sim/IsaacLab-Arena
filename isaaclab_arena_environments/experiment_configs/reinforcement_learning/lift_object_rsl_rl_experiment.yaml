# Evaluates a Franka lift_object RSL-RL checkpoint.
# The policy reads its runner config from params/agent.yaml next to the checkpoint.
# To evaluate another checkpoint, add
# runs.lift_object_rsl_rl.policy.checkpoint_path=<path> to the command.
runs:
  lift_object_rsl_rl:
    environment:
      type: lift_object
    policy:
      type: rsl_rl
      # Download location used by the reinforcement learning evaluation tutorial.
      checkpoint_path: /models/isaaclab_arena/reinforcement_learning/lift_object_checkpoint/model_1999.pt
    rollout_limit:
      num_episodes: 20

# Checks that the dexsuite_lift environment loads by stepping it with zero actions.
# The environment uses Newton physics by default. To use PhysX instead, add
# runs.dexsuite_lift_zero_action.environment_builder.presets=PHYSX to the command.
runs:
  dexsuite_lift_zero_action:
    environment:
      type: dexsuite_lift
    policy:
      type: zero_action
    rollout_limit:
      num_steps: 100

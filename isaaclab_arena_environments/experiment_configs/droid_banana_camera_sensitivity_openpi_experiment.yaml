runs:
  droid_banana_camera_sensitivity_openpi:
    environment:
      type: pick_and_place_maple_table
      enable_cameras: true
      embodiment: droid_abs_joint_pos
      pick_up_object: banana_ycb_robolab
      destination_location: bowl_ycb_robolab
      hdr: home_office_robolab
    environment_builder:
      num_envs: 10
      seed: 42
      language_instruction: pick up the banana and place it in the bowl
    policy:
      type: isaaclab_arena_openpi.policy.pi0_remote_policy.Pi0RemotePolicy
      policy_variant: pi05
      policy_device: cuda:0
      remote_host: 127.0.0.1
      remote_port: 8000
      openpi_embodiment_adapter: droid
    rollout_limit:
      num_episodes: 1000
    variations:
      light.hdr_image.enabled: true
      light.hdr_image.hdr_names: [home_office_robolab]
      droid_abs_joint_pos.camera_extrinsics_wrist_camera.enabled: true
      droid_abs_joint_pos.camera_extrinsics_wrist_camera.sampler_cfg.low: [-0.05, -0.05, -0.05]
      droid_abs_joint_pos.camera_extrinsics_wrist_camera.sampler_cfg.high: [0.05, 0.05, 0.05]

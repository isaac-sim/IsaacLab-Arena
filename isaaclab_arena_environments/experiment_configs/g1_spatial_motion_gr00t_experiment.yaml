shared:
  environment:
    type: g1_spatial_motion
    enable_cameras: true
    mapped: false
  environment_builder:
    num_envs: 1
  policy:
    type: isaaclab_arena_gr00t.policy.gr00t_remote_closedloop_policy.Gr00tRemoteClosedloopPolicy
    policy_config_yaml_path: isaaclab_arena_policies/isaaclab_arena_gr00t/policy/config/g1_locomanip_gr00t_closedloop_config.yaml
    remote_host: 127.0.0.1
    remote_port: 5555
    policy_device: cuda:0
  rollout_limit:
    num_episodes: 1

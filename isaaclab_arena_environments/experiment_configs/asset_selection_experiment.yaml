# An Arena Experiment whose Run spawns another pick-up object in each rebuild of the environment.
runs:
  asset_selection_demo:
    environment:
      type: pick_and_place_maple_table
      episode_length_s: 1.5
    environment_builder:
      # Parallel environments in each build. All of them spawn the same selected object.
      num_envs: 4
      env_spacing: 2.5
    policy:
      type: zero_action
    rollout_limit:
      # Split across the rebuilds, so each rebuild runs 4 episodes, one in each environment.
      num_episodes: 12
    # Each rebuild spawns the next name of registry_names in every environment.
    # Set num_rebuilds to the length of registry_names to spawn each entry once.
    num_rebuilds: 3
    variations:
      pick_up_object.asset_selection.enabled: true
      # Registered rigid objects to spawn, in this order. Each episode row records the chosen name.
      pick_up_object.asset_selection.registry_names: [rubiks_cube_hot3d_robolab, mustard_bottle_hot3d_robolab, orange_01_fruits_veggies_robolab]
      # pick_up_object.asset_selection.random_choice: true  # Each build draws a name at random

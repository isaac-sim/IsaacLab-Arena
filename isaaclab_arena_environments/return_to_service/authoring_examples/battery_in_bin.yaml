# A small composition example, not the complete return-to-service benchmark.
# Region coordinates match battery_bin.interior_bounds in the authored manifest.
env_name: service_battery_in_bin
default_physics_backend: physx
embodiment:
  id: robot
  registry_name: droid_differential_ik
  params:
    initial_pose:
      position_xyz: [0.0, 0.0, 0.78]
      rotation_xyzw: [0.0, 0.0, 0.0, 1.0]
    stand_height_m: 0.78
    stand_footprint_xy_m: [0.20, 0.20]
    placement_bbox_stand_only: true
background:
  id: table
  registry_name: return_to_service_bench
  params:
    initial_pose:
      position_xyz: [0.48, 0.0, 0.78]
      rotation_xyzw: [0.0, 0.0, 0.0, 1.0]
objects:
  - id: battery
    registry_name: return_to_service_component
    params:
      component: battery
  - id: bin
    registry_name: return_to_service_fixture
    params:
      component: battery_bin
      initial_pose:
        position_xyz: [0.48, 0.18, 0.782]
        rotation_xyzw: [0.0, 0.0, 0.0, 1.0]
  - id: lighting
    registry_name: return_to_service_lighting
relations:
  - kind: is_anchor
    subject: table
  - kind: is_anchor
    subject: robot
  - kind: 'on'
    subject: battery
    reference: table
  - kind: is_anchor
    subject: bin
task:
  composition: atomic
  description: Place the service battery completely inside the battery bin and release it.
  episode_length_s: 60.0
  subtasks:
    - kind: PlaceInRegionTask
      params:
        subject: battery
        destination: bin
        region_bounds:
          - [-0.049, -0.0515, 0.006]
          - [0.049, 0.0515, 0.075]
        floor_allowance_m: 0.00005
        grasp_width_m: 0.024
        placement_consecutive_steps: 5

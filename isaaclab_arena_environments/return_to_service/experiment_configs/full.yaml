# Verify eight-scenario execution and per-fault reporting with zero actions.
# For long-horizon policy evaluation, replace shared.policy and use a 600 s episode.
shared:
  environment:
    type: return_to_service
    embodiment: droid_differential_ik
    enable_cameras: false
    episode_length_s: 2.0
  environment_builder:
    num_envs: 1
    presets: PHYSX
  policy:
    type: zero_action
  rollout_limit:
    num_episodes: 1

runs:
  healthy:
    environment:
      scenarios: [healthy]
  battery:
    environment:
      scenarios: [battery]
  filter:
    environment:
      scenarios: [filter]
  obstruction:
    environment:
      scenarios: [obstruction]
  battery_filter:
    environment:
      scenarios: [battery_filter]
  battery_obstruction:
    environment:
      scenarios: [battery_obstruction]
  filter_obstruction:
    environment:
      scenarios: [filter_obstruction]
  combined:
    environment:
      scenarios: [combined]

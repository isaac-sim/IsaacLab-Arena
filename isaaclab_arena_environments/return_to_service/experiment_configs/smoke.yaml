# A short timeout yields a recorded failed episode and exercises the reporting path.
shared:
  environment:
    type: return_to_service
    embodiment: droid_differential_ik
    enable_cameras: false
    scenarios: [combined]
    episode_length_s: 2.0
  environment_builder:
    num_envs: 1
    presets: PHYSX
  policy:
    type: zero_action
  rollout_limit:
    num_episodes: 1

runs:
  smoke: {}

# Renders the DROID camera rig at its declared 1280x720 (camera_resolution_mode: embodiment_default).
# TODO(alexmillane, 2026-11-03): Render at Pi0.5's policy-default resolution once zero_action can
# declare an image size, so this baseline measures the cameras the Pi0.5 evaluation renders.
shared:
  environment:
    type: pick_and_place_maple_table
    enable_cameras: true
    embodiment: droid_rel_joint_pos
    pick_up_object: rubiks_cube_hot3d_robolab
    destination_location: bowl_ycb_robolab
    hdr: home_office_robolab
  environment_builder:
    num_envs: 1
    env_spacing: 2.5
    seed: 42
    placement_seed: 42
    language_instruction: Pick up the Rubik's cube and place it in the bowl.
  policy:
    type: zero_action
  rollout_limit:
    num_steps: 300
  num_rebuilds: 1

runs:
  production_camera_baseline: {}

# Environments take the ten fruit in list order, repeating after the tenth (random_choice: false).
env_name: perflab_ten_fruit_into_bowl_maple_table
external_yaml:
- ../scenes/fruit_bowl_maple_table.yaml
object_sets:
- id: fruit
  members:
  - apple_01_objaverse_robolab
  - apple_02_objaverse_robolab
  - avocado01_fruits_veggies_robolab
  - lemon_01_fruits_veggies_robolab
  - lemon_02_fruits_veggies_robolab
  - lime01_fruits_veggies_robolab
  - orange_01_fruits_veggies_robolab
  - orange_02_fruits_veggies_robolab
  - pomegranate01_fruits_veggies_robolab
  - lychee01_fruits_veggies_robolab
  random_choice: false
task:
  composition: atomic
  description: Pick up the fruit from the maple table and place it into the bowl on the table.
  subtasks:
  - kind: PickAndPlaceTask
    params:
      pick_up_object: fruit
      destination_location: bowl
      background_scene: maple_table

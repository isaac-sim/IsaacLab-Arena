external_yaml: tool_hanging_env_config.yaml
env_name: tool_hanging_wrench_easy
embodiment:
  id: yam
  registry_name: tool_hanging_bimanual_yam
  params:
    left_mount_position: [0.3025, 0.17, 0.81]
    right_mount_position: [0.3025, -0.17, 0.81]
background:
  id: background
  registry_name: yam_workcell_table
  params:
    initial_pose:
      position_xyz: [0.2525, 0.0, 0.75]
      rotation_xyzw: [0.0, 0.0, 0.0, 1.0]
objects:
- id: hdr_shadow_receiver
  registry_name: hdr_shadow_receiver
- id: pegboard_rack
  registry_name: pegboard_rack
  params:
    initial_pose:
      position_xyz: [0.88, -0.16, 1.11]
      rotation_xyzw: [0.0, 0.0, 0.0, 1.0]
- id: wrench_hook_2
  registry_name: pegboard_hook
  params:
    initial_pose:
      position_xyz: [0.88, 0.057508475, 1.150515762]
      rotation_xyzw: [0.0, 0.0, 1.0, 0.0]
- id: empty_warehouse_hdr_light
  registry_name: empty_warehouse_dome_light
- id: ring_spanner_19
  registry_name: tool_hanging_wrench
object_references:
- id: table
  parent_id: background
  prim_path: placement_surface
  object_type: base
relations:
- kind: is_anchor
  subject: table
- kind: is_anchor
  subject: pegboard_rack
- kind: is_anchor
  subject: wrench_hook_2
- kind: 'on'
  subject: ring_spanner_19
  reference: table
# Upstream samples independent X/Y offsets in [-0.02, 0.02] m around the nominal pose;
# the box is that distribution translated through the artist mesh's origin.
- kind: position_limits_box
  subject: ring_spanner_19
  params:
    x_min: 0.7706098816
    x_max: 0.8106098816
    y_min: 0.2014786708
    y_max: 0.2414786708
- kind: rotate_around_solution
  subject: ring_spanner_19
  params:
    yaw_rad: 3.141592653589793
task:
  composition: atomic
  description: hang the dark 19 mm wrench on the hook
  subtasks:
  - kind: ToolHangingTask
    params:
      tools: [ring_spanner_19]
      fixtures: [wrench_hook_2]
      goals:
      - tool: ring_spanner_19
        fixture: wrench_hook_2
        loop:
          center_xyz: [0.024331, 0.2214774, 0.00425]
          radius_m: 0.0182
        rod:
          start_xyz: [0.0611, -0.00249, 0.0042]
          end_xyz: [0.0, -0.00249, 0.0042]
      contact_force_n: 0.2
      speed_m_s: 0.15
      consecutive_success_steps: 60
      episode_length_s: 103.33333333333333

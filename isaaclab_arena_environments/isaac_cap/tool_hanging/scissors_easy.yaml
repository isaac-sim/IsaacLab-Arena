external_yaml: tool_hanging_env_config.yaml
env_name: tool_hanging_scissors_easy
embodiment:
  id: yam
  registry_name: tool_hanging_bimanual_yam
  params:
    left_mount_position: [0.3025, 0.17, 0.81]
    right_mount_position: [0.3025, -0.17, 0.81]
background:
  id: background
  registry_name: yam_workcell_table
  params:
    initial_pose:
      position_xyz: [0.2525, 0.0, 0.728]
      rotation_xyzw: [0.0, 0.0, 0.0, 1.0]
objects:
- id: hdr_shadow_receiver
  registry_name: hdr_shadow_receiver
- id: pegboard_rack
  registry_name: pegboard_rack
  params:
    initial_pose:
      position_xyz: [0.88, -0.16, 1.12800769]
      rotation_xyzw: [0.0, 0.0, 0.0, 1.0]
- id: scissor_hook_2
  registry_name: pegboard_hook
  params:
    initial_pose:
      position_xyz: [0.88, -0.002491525, 1.128515762]
      rotation_xyzw: [0.0, 0.0, 1.0, 0.0]
- id: empty_warehouse_hdr_light
  registry_name: empty_warehouse_dome_light
- id: scissors_1
  registry_name: tool_hanging_scissors
object_references:
- id: table
  parent_id: background
  prim_path: placement_surface
  object_type: base
relations:
- kind: is_anchor
  subject: table
- kind: is_anchor
  subject: pegboard_rack
- kind: is_anchor
  subject: scissor_hook_2
- kind: 'on'
  subject: scissors_1
  reference: table
  params:
    clearance_m: 0.004
- kind: position_limits_box
  subject: scissors_1
  params:
    x_min: 0.58
    x_max: 0.62
    y_min: -0.02
    y_max: 0.02
- kind: rotate_around_solution
  subject: scissors_1
  params:
    roll_rad: -1.5707963267948966
    yaw_rad: 1.5707963267948966
task:
  composition: atomic
  description: hang the scissors on the hook
  subtasks:
  - kind: ToolHangingTask
    params:
      tools: [scissors_1]
      fixtures: [scissor_hook_2]
      goals:
      - tool: scissors_1
        fixture: scissor_hook_2
        loop:
          center_xyz: [0.0217, 0, -0.0385]
          radius_m: 0.029
        rod:
          start_xyz: [0.0611, -0.00249, 0.0042]
          end_xyz: [0, -0.00249, 0.0042]
        alternative_loops:
        - center_xyz: [-0.02183, 0, -0.03853]
          radius_m: 0.029
      contact_force_n: 0.2
      speed_m_s: 0.15
      consecutive_success_steps: 60
      episode_length_s: 116.66666666666667

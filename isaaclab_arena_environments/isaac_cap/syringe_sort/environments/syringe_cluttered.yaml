external_yaml: syringe_env_config.yaml

env_name: syringe_cluttered_newton
embodiment:
  id: fr3
  registry_name: industrial_fr3_robotiq_2f85
  params:
    initial_pose:
      position_xyz:
      - -0.5
      - -0.1
      - 0.912
      rotation_xyzw:
      - 0.0
      - 0.0
      - 0.0
      - 1.0
background:
  id: background
  registry_name: fr3_workcell_table
  params:
    initial_pose:
      position_xyz:
      - -0.5
      - -0.1
      - 0.912
      rotation_xyzw:
      - 0.0
      - 0.0
      - 0.0
      - 1.0
objects:
- id: syringe_receiver
  registry_name: hdr_shadow_receiver
  params: {}
- id: sharps_container
  registry_name: sharps_container
  params:
    instance_name: sharps_container
- id: instrument_tray
  registry_name: instrument_tray
  params:
    instance_name: instrument_tray
- id: benchmark_light
  registry_name: empty_warehouse_dome_light
  params: {}
- id: syringe_0
  registry_name: syringe
  params:
    instance_name: syringe_0
- id: syringe_1
  registry_name: syringe
  params:
    instance_name: syringe_1
- id: syringe_2
  registry_name: syringe
  params:
    instance_name: syringe_2
- id: syringe_3
  registry_name: syringe
  params:
    instance_name: syringe_3
object_references:
- id: table
  parent_id: background
  prim_path: placement_surface
  object_type: base
  params: {}
relations:
- kind: is_anchor
  subject: table
  params: {}
- kind: 'on'
  subject: instrument_tray
  reference: table
  params:
    clearance_m: 0.0
- kind: position_limits_box
  subject: instrument_tray
  params:
    x_min: 0.05
    x_max: 0.15
    y_min: -0.33
    y_max: -0.23
- kind: 'on'
  subject: sharps_container
  reference: table
  params:
    clearance_m: 0.0
- kind: position_limits_box
  subject: sharps_container
  params:
    # Brought toward the robot from x [0.1475, 0.2475]. The carry
    # reorientation lifts the held syringe to z ~= 1.34 above the aperture, and
    # the FR3/Robotiq USD IK solves to 0.867 m from the base -- measured, it
    # reaches z = 1.15 there and refuses from 1.20. Over the old range the
    # liftable height ran 0.98-1.35 m, so most draws put that waypoint out of
    # reach and carry_sg.execute aborted (3 of 4 seeds). The previous Panda-URDF
    # backend accepted poses up to 3 cm short, which hid it.
    x_min: 0.05
    x_max: 0.12
    y_min: 0.1075
    y_max: 0.2075
- kind: 'on'
  subject: syringe_0
  reference: instrument_tray
  params:
    clearance_m: 0.0
    edge_margin_m: 0.01
- kind: 'on'
  subject: syringe_1
  reference: instrument_tray
  params:
    clearance_m: 0.0
    edge_margin_m: 0.01
- kind: 'on'
  subject: syringe_2
  reference: instrument_tray
  params:
    clearance_m: 0.0
    edge_margin_m: 0.01
- kind: 'on'
  subject: syringe_3
  reference: instrument_tray
  params:
    clearance_m: 0.03
    edge_margin_m: 0.01
task:
  composition: atomic
  description: pick up all four syringes from the cluttered instrument tray and drop
    each through the hole in the yellow sharps disposal box
  subtasks:
  # TODO(alexmillane): [object-in-missing-feature]: Move to a more general ObjectIn task once we have it.
  - kind: SyringeSortTask
    params:
      object_list:
      - syringe_0
      - syringe_1
      - syringe_2
      - syringe_3
      region_list:
      - sharps_container
      - sharps_container
      - sharps_container
      - sharps_container
      bounds_xyzxyz:
      - - 0.053
        - -0.2055
        - -0.016
        - 0.142
        - -0.0395
        - 0.134
      - - 0.053
        - -0.2055
        - -0.016
        - 0.142
        - -0.0395
        - 0.134
      - - 0.053
        - -0.2055
        - -0.016
        - 0.142
        - -0.0395
        - 0.134
      - - 0.053
        - -0.2055
        - -0.016
        - 0.142
        - -0.0395
        - 0.134
      consecutive_success_steps: 50
      episode_length_s: 1368.0

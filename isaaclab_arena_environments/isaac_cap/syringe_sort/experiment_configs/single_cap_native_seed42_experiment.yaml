# Replay CAP's actual seed-42 reset poses. Placement solver revisions can select
# different layouts from the same seed; cached poses make the comparison exact.
shared:
  environment:
    type: syringe_single_newton
    enable_cameras: true
    episode_length_s: null
  environment_builder:
    num_envs: 1
    seed: 42
    solve_relations: true
    placement_seed: null
    placement_layouts_path: isaaclab_arena_environments/isaac_cap/syringe_sort/experiment_configs/single_cap_native_seed42_layout.jsonl
  policy:
    type: cap_remote
    host: 127.0.0.1
    port: 19000
    connect_timeout_s: 180.0
    io_timeout_s: 180.0
    # Environment reset already renders five frames, matching native CAP.
    startup_render_steps: 0
    robot_profile: fr3
    gripper_closed_position: 0.8
    workspace:
      surface_z: -0.117
      transport_z: 0.19
      align_clearance_m: 0.12
      pregrasp_standoff_m: 0.12
  rollout_limit:
    num_episodes: 1
runs:
  single: {}

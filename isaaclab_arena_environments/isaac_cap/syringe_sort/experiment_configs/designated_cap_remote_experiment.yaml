shared:
  environment:
    type: syringe_designated_newton
    enable_cameras: true
    episode_length_s: null
  environment_builder:
    num_envs: 1
    solve_relations: true
    placement_seed: 42
  policy:
    type: cap_remote
    host: 127.0.0.1
    port: 19000
    connect_timeout_s: 180.0
    io_timeout_s: 180.0
    # Environment reset already renders five frames, matching native CAP.
    startup_render_steps: 0
    robot_profile: fr3
    gripper_closed_position: 0.8
    workspace:
      surface_z: -0.117
      transport_z: 0.19
      align_clearance_m: 0.12
      pregrasp_standoff_m: 0.12
  rollout_limit:
    num_episodes: 1
runs:
  designated: {}

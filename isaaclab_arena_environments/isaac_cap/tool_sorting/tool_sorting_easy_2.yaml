external_yaml: tool_sorting_env_config.yaml
env_name: vabar_tool_sorting_easy_2
objects:
- id: hdr_shadow_receiver
  registry_name: hdr_shadow_receiver
  params: {}
- id: bin1
  registry_name: industrial__tool_sort_bin
  params:
    instance_name: bin1
    side: source
    appearance: default
    initial_pose:
      position_xyz:
      - 0.1
      - -0.25
      - 0.8
      rotation_xyzw:
      - 0.0
      - 0.0
      - 0.0
      - 1.0
- id: bin2
  registry_name: industrial__tool_sort_bin
  params:
    instance_name: bin2
    side: destination
    appearance: bench
    initial_pose:
      position_xyz:
      - 0.1
      - 0.28
      - 0.8
      rotation_xyzw:
      - 0.0
      - 0.0
      - 0.0
      - 1.0
- id: benchmark_light
  registry_name: empty_warehouse_dome_light
  params: {}
- id: adjustable_wrench_0
  registry_name: vabar_tool_sort__adjustable_wrench
  params:
    instance_name: adjustable_wrench_0
- id: slotted_screwdriver_0
  registry_name: vabar_tool_sort__slotted_screwdriver
  params:
    instance_name: slotted_screwdriver_0
- id: tape_measure_0
  registry_name: vabar_tool_sort__tape_measure
  params:
    instance_name: tape_measure_0
- id: insulating_tape_0
  registry_name: vabar_tool_sort__insulating_tape
  params:
    instance_name: insulating_tape_0
relations:
- kind: is_anchor
  subject: table
  params: {}
- kind: 'on'
  subject: bin1
  reference: table
  params:
    clearance_m: 0.0
- kind: at_position
  subject: bin1
  params:
    x: 0.1
    y: -0.25
- kind: is_anchor
  subject: bin1
  params: {}
- kind: 'on'
  subject: bin2
  reference: table
  params:
    clearance_m: 0.0
- kind: at_position
  subject: bin2
  params:
    x: 0.1
    y: 0.28
- kind: is_anchor
  subject: bin2
  params: {}
- kind: rotate_around_solution
  subject: bin1
  params:
    yaw_rad: 0.0
- kind: rotate_around_solution
  subject: bin2
  params:
    yaw_rad: 0.0
- kind: 'on'
  subject: adjustable_wrench_0
  reference: bin1
  params:
    clearance_m: 0.0
    edge_margin_m: 0.01
- kind: 'on'
  subject: slotted_screwdriver_0
  reference: bin1
  params:
    clearance_m: 0.0
    edge_margin_m: 0.01
- kind: 'on'
  subject: tape_measure_0
  reference: bin1
  params:
    clearance_m: 0.0
    edge_margin_m: 0.01
- kind: 'on'
  subject: insulating_tape_0
  reference: bin1
  params:
    clearance_m: 0.0
    edge_margin_m: 0.01
task:
  composition: atomic
  description: Sort the four items from bin1 into the compartment of bin2 whose label
    names each one.
  subtasks:
  - kind: ObjectsInRegionsTask
    params:
      object_list:
      - adjustable_wrench_0
      - slotted_screwdriver_0
      - tape_measure_0
      - insulating_tape_0
      region_list:
      - bin2
      - bin2
      - bin2
      - bin2
      bounds_xyzxyz:
      - - -0.195
        - -0.245
        - 0
        - 0
        - 0
        - 0.15
      - - 0
        - -0.245
        - 0
        - 0.195
        - 0
        - 0.15
      - - -0.195
        - 0
        - 0
        - 0
        - 0.245
        - 0.15
      - - 0
        - 0
        - 0
        - 0.195
        - 0.245
        - 0.15
      episode_length_s: 192.0

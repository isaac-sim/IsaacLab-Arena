# Both USB-C variants use the same Newton contact and solver configuration.
default_physics_backend: newton
placer_params:
  allow_best_loss_fallbacks: false
  required_checks: [on_relation]
  solver_params:
    clearance_m: 0.0
    lr: 0.001
env_cfg_override:
  decimation: 1
  sim:
    dt: 0.016666666666666666
    render_interval: 1
    gravity: [0.0, 0.0, -9.81]
    use_newton_actuators: true
    physics:
      num_substeps: 16
      collision_decimation: 1
      use_cuda_graph: false
      default_shape_cfg:
        gap: 0.0002
      solver_cfg:
        _target_: isaaclab_newton.physics.MJWarpSolverCfg
        solver: newton
        integrator: implicitfast
        use_mujoco_contacts: false
        disable_sensors: true
        update_data_interval: 1
        njmax: 4096
        nconmax: 2048
        iterations: 100
        ls_iterations: 50
        cone: elliptic
        impratio: 10.0
      collision_cfg:
        _target_: isaaclab_newton.physics.NewtonCollisionPipelineCfg
        rigid_contact_max: 8192

env_name: workbench_turn_off_scope
external_yaml: scene_tool_bin_scope.yaml
task:
  composition: atomic
  description: Press the oscilloscope power button to turn its screen off.
  subtasks:
  - kind: PressButtonTask
    params:
      pressable_object: oscilloscope
      pressedness_threshold: 0.8
      reset_pressedness: 1.0
      episode_length_s: 60.0

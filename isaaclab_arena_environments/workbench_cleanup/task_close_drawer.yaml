env_name: workbench_close_drawer
external_yaml: scene_tool_bin_scope.yaml
task:
  composition: atomic
  description: Close the fully open top-left drawer.
  subtasks:
  - kind: CloseDoorTask
    params:
      openable_object: top_drawer
      closedness_threshold: 0.05
      reset_openness: 1.0
      episode_length_s: 90.0

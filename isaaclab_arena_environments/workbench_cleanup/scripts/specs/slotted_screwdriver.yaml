asset:
  id: slotted_screwdriver
  usd_path: hf://huggingface.co/datasets/nvidia/simready-assets/resolve/653d91e182011f357cf1644013cc94ddf194d349/handTool_screwdriver_slotted_55mm_a01/simready_usd/sm_handTool_screwdriver_slotted_55mm_a01_01.usd
  variants:
    Physics: physics
    PhysX: Enabled
output: slotted_screwdriver.usdc
operations:
- kind: edit_prims
  params:
    select:
      schema: PhysicsRigidBodyAPI
    apply_apis:
    - PhysxRigidBodyAPI
    - PhysxContactReportAPI
    attributes:
      physxContactReport:threshold:
        type: float
        value: 0.0
      physxRigidBody:sleepThreshold:
        type: float
        value: 0.0
      physxRigidBody:linearDamping:
        type: float
        value: 2.0
      physxRigidBody:angularDamping:
        type: float
        value: 2.0
- kind: edit_prims
  params:
    select:
      schema: PhysicsCollisionAPI
    apply_apis:
    - PhysxCollisionAPI
    attributes:
      physxCollision:contactOffset:
        type: float
        value: 0.001
      physxCollision:restOffset:
        type: float
        value: 0.0
      physics:approximation:
        type: token
        value: convexHull
validation:
  required_prims: []

asset:
  id: socket_set
  usd_path: hf://huggingface.co/datasets/ForgeCAD/simready-assets/resolve/0573053fa2c9174ca2a4678a462ec4dfd3035d59/ratchet_socket_set/simready_usd/ratchet_socket_set.usda
  variants:
    Physics: physics
    PhysX: Enabled
output: socket_set.usdc
operations:
- kind: edit_prims
  params:
    select:
      type: PhysicsScene
    active: false
- kind: edit_prims
  params:
    select:
      paths:
      - Geometry/Ratchet_body
      - Geometry/Socket_*
      - Geometry/Extension_*
      - Physics/Joints/drive
      - Physics/Joints/release
      - Physics/Joints/direction
    active: false
- kind: configure_articulation
  params:
    root: .
- kind: edit_prims
  params:
    select:
      schema: PhysicsRigidBodyAPI
    apply_apis:
    - PhysxRigidBodyAPI
    - PhysxContactReportAPI
    attributes:
      physxContactReport:threshold:
        type: float
        value: 0.0
      physxRigidBody:sleepThreshold:
        type: float
        value: 0.0
validation:
  required_prims:
  - Geometry/Case_base/Case_lid
  - Physics/Joints/case_lid

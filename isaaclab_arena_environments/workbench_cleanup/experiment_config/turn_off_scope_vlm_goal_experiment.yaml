# Uses camera images, robot state, and explicitly privileged object poses, as in the gear-insertion example.
runs:
  turn_off_scope:
    environment:
      type: isaaclab_arena_environments/workbench_cleanup/task_turn_off_scope.yaml
      enable_cameras: true
    environment_builder:
      num_envs: 1
      seed: 42
      device: cuda:0
      camera_resolution_mode: policy_default
      placement_seed: 17
      language_instruction: >-
        Press the small oscilloscope power button until the screen turns black, then withdraw without pressing again.
    policy:
      type: isaaclab_arena_environments.workbench_cleanup.vlm_policy.WorkbenchVLMGoalPolicy
      endpoint: internal
      model: openai/openai/gpt-6-astra
      vlm_embodiment_adapter: droid
      observation_modality: image_state
      image_max_width_or_height: 512
      max_steps_per_goal: 90
      prediction_interval_steps: 15
      translation_speed_m_s: 0.15
      rotation_speed_rad_s: 0.8
      goal_history_size: 12
      position_tolerance_m: 0.001
      rotation_tolerance_rad: 0.02
      object_poses: [oscilloscope, oscilloscope_power_button, tabletop]
      system_prompt_files:
        - isaaclab_arena_environments/workbench_cleanup/prompts/turn_off_scope.txt
    rollout_limit:
      num_episodes: 5

# Uses camera images, robot state, and explicitly privileged object poses, as in the gear-insertion example.
runs:
  bin_shelf:
    environment:
      type: isaaclab_arena_environments/workbench_cleanup/task_bin_shelf.yaml
      enable_cameras: true
    environment_builder:
      num_envs: 1
      seed: 42
      camera_resolution_mode: POLICY_DEFAULT
      placement_seed: 17
      language_instruction: >-
        Pick up the white bin by a single rim or wall and place it on the empty overhead shelf bay between the blue containers. Release it and withdraw.
    policy:
      type: isaaclab_arena_vlm_agent.vlm_agent_policy.VLMGoalPolicy
      endpoint: internal
      model: openai/openai/gpt-6-astra
      vlm_embodiment_adapter: droid
      observation_modality: image_state
      image_max_width_or_height: 512
      max_steps_per_goal: 90
      position_tolerance_m: 0.002
      rotation_tolerance_rad: 0.05
      object_poses: [white_bin, overhead_shelf]
      system_prompt_files:
        - isaaclab_arena_environments/workbench_cleanup/prompts/bin_shelf.txt
    rollout_limit:
      num_episodes: 5

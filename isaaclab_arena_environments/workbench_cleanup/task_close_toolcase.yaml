env_name: workbench_close_toolcase
external_yaml: scene_tool_bin_scope.yaml
env_cfg_override:
  viewer:
    eye: [2.05, 1.6, 2.0]
    lookat: [-0.05, 0.15, 0.95]
task:
  composition: atomic
  description: Close the open socket toolcase lid.
  subtasks:
  - kind: CloseDoorTask
    params:
      openable_object: socket_set
      closedness_threshold: 0.05
      reset_openness: 0.9545454548532418
      episode_length_s: 60.0

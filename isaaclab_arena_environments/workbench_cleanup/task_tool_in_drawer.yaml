env_name: workbench_tool_in_drawer
external_yaml: scene_tool_bin_scope.yaml
task:
  composition: atomic
  description: Pick up the slotted screwdriver and place it inside the fully open
    top-left drawer.
  subtasks:
  - kind: PickAndPlaceTask
    params:
      pick_up_object: slotted_screwdriver
      destination_location: top_drawer_body
      background_scene: workbench
      episode_length_s: 60.0
      force_threshold: 0.1
      velocity_threshold: 0.02
      placement_consecutive_steps: 10

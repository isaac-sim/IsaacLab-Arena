env_name: smartphone_in_bin
external_yaml:
- ../scenes/workdesk_bin.yaml
- ../robolab_defaults.yaml
task:
  composition: atomic
  description: Put the smartphone in the grey bin
  subtasks:
  - kind: PickAndPlaceTask
    params:
      pick_up_object: smartphone
      destination_location: grey_bin
      background_scene: table_oak_robolab
      episode_length_s: 60.0

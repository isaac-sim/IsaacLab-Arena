# Evaluate two DROID pick-and-place tasks for initial-object-position sensitivity.
# Pass both --record_camera_video and --record_viewport_video to experiment_runner.py
# to record policy-observation cameras and the simulator viewport.
shared:
  environment:
    enable_cameras: true
  environment_builder:
    num_envs: 5
    presets: physx
  rollout_limit:
    num_episodes: 100

runs:
  mustard_in_left_bin_pi0:
    environment:
      type: isaaclab_arena_environments/robolab/tasks/mustard_in_left_bin.yaml
    policy: &openpi_policy
      type: isaaclab_arena_openpi.policy.pi0_remote_policy.Pi0RemotePolicy
      policy_variant: pi05
      policy_device: cuda:0
      remote_host: 127.0.0.1
      remote_port: 8000
      openpi_embodiment_adapter: droid

  bowl_in_bin_pi0:
    environment:
      type: isaaclab_arena_environments/robolab/tasks/bowl_in_bin.yaml
    policy: *openpi_policy

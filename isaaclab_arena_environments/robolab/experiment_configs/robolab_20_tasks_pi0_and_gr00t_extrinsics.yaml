# 20 single-subtask robolab tasks (40 runs, pi0 + GR00T), with camera-extrinsics variations on
# all droid cameras (external, external_2, wrist) instead of the lighting-direction variation.
# Original: 20 single-subtask robolab tasks, each run with both the OpenPI (pi0) and GR00T policies
# (40 runs). On OSMO the inference server for each Run is derived from its policy type, so
# this launches pi0 servers for the *_pi0 Runs and GR00T servers for the *_gr00t Runs.
# pi0 Runs use 10 parallel environments; GR00T Runs use 6.
runs:

  banana_in_bowl_pi0:
    environment: &banana_in_bowl_env
      type: isaaclab_arena_environments/robolab/tasks/banana_in_bowl.yaml
      enable_cameras: true
    # This YAML anchor keeps the shared OpenPI policy configuration in one place.
    policy: &openpi_policy
      type: isaaclab_arena_openpi.policy.pi0_remote_policy.Pi0RemotePolicy
      policy_variant: pi05
      policy_device: cuda:0
      remote_host: 127.0.0.1
      remote_port: 8000
      openpi_embodiment_adapter: droid
    # This YAML anchor keeps the shared pi0 environment-builder settings in one place.
    environment_builder: &pi0_builder
      num_envs: 5
    # This YAML anchor keeps the shared camera-extrinsics variations in one place:
    # a per-reset extrinsics offset on every droid camera.
    variations: &extrinsics_variation
      droid_abs_joint_pos:
        camera_extrinsics_external_camera:
          enabled: true
        camera_extrinsics_external_camera_2:
          enabled: true
        camera_extrinsics_wrist_camera:
          enabled: true
    rollout_limit:
      num_episodes: 100

  banana_in_bowl_gr00t:
    environment: *banana_in_bowl_env
    # This YAML anchor keeps the shared GR00T policy configuration in one place.
    policy: &gr00t_policy
      type: isaaclab_arena_gr00t.policy.gr00t_remote_closedloop_policy.Gr00tRemoteClosedloopPolicy
      policy_config_yaml_path: isaaclab_arena_gr00t/policy/config/droid_manip_gr00t_closedloop_config.yaml
      policy_device: cuda:0
      remote_host: 127.0.0.1
      remote_port: 5555
    # This YAML anchor keeps the shared GR00T environment-builder settings in one place.
    environment_builder: &gr00t_builder
      num_envs: 3
    variations: *extrinsics_variation
    rollout_limit:
      num_episodes: 100

  banana_on_plate_pi0:
    environment: &banana_on_plate_env
      type: isaaclab_arena_environments/robolab/tasks/banana_on_plate.yaml
      enable_cameras: true
    policy: *openpi_policy
    environment_builder: *pi0_builder
    variations: *extrinsics_variation
    rollout_limit:
      num_episodes: 100

  banana_on_plate_gr00t:

# 20 single-subtask robolab tasks run with the Cosmos policy, with a lighting-direction variation.
# On OSMO the inference server for each Run is derived from its policy type, so this launches
# a Cosmos server (cosmos_server image) per Run. Cosmos Runs use 5 parallel environments.
runs:

  banana_in_bowl_cosmos:
    environment:
      type: isaaclab_arena_environments/robolab/tasks/banana_in_bowl.yaml
      enable_cameras: true
    # This YAML anchor keeps the shared Cosmos policy configuration in one place.
    policy: &cosmos_policy
      type: isaaclab_arena_cosmos.policy.cosmos_remote_policy.CosmosRemotePolicy
      cosmos_embodiment_adapter: droid
      policy_device: cuda:0
      remote_host: 127.0.0.1
      remote_port: 8000
    # This YAML anchor keeps the shared Cosmos environment-builder settings in one place.
    environment_builder: &cosmos_builder
      num_envs: 5
    # This YAML anchor keeps the shared lighting-direction variation in one place.
    variations: &direction_variation
      directional_light:
        direction:
          enabled: true
    num_rebuilds: 20
    rollout_limit:
      num_episodes: 100

  banana_on_plate_cosmos:
    environment:
      type: isaaclab_arena_environments/robolab/tasks/banana_on_plate.yaml
      enable_cameras: true
    policy: *cosmos_policy
    environment_builder: *cosmos_builder
    variations: *direction_variation
    num_rebuilds: 20
    rollout_limit:
      num_episodes: 100


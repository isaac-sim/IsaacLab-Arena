# Two robolab tasks run with the Cosmos policy. On OSMO the inference server for each Run is
# derived from its policy type, so this launches a Cosmos server (cosmos_server image) per Run.
# A template for adding Cosmos Runs to the larger robolab experiments.
runs:

  banana_on_plate_cosmos:
    environment:
      type: isaaclab_arena_environments/robolab/tasks/banana_on_plate.yaml
      enable_cameras: true
    # This YAML anchor keeps the shared Cosmos policy configuration in one place.
    policy: &cosmos_policy
      type: isaaclab_arena_cosmos.policy.cosmos_remote_policy.CosmosRemotePolicy
      cosmos_embodiment_adapter: droid
      policy_device: cuda:0
      remote_host: 127.0.0.1
      remote_port: 8000
    environment_builder: &env_builder
      num_envs: 5
    rollout_limit:
      num_episodes: 100

  banana_in_bowl_cosmos:
    environment:
      type: isaaclab_arena_environments/robolab/tasks/banana_in_bowl.yaml
      enable_cameras: true
    policy: *cosmos_policy
    environment_builder: *env_builder
    rollout_limit:
      num_episodes: 100

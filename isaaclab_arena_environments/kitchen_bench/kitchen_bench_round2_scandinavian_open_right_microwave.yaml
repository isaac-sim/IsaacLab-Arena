env_name: kitchen_bench_round2_scandinavian_open_right_microwave
embodiment:
  id: droid
  registry_name: droid_abs_joint_pos
  params:
    stand_height_m: 1.15
    placement_bbox_stand_only: true
    collision_mode: mesh
background:
  id: kitchen
  registry_name: lightwheel_kitchen_l_shaped_scandinavian
  params:
    collision_mode: mesh
    repair_collision_mesh_non_watertight: false
objects: []
object_references:
- id: floor
  parent_id: kitchen
  prim_path: floor_room/geometry
  object_type: base
  params: {}
- id: microwave
  parent_id: kitchen
  prim_path: microwave_right_group
  object_type: articulation
  params:
    openable_joint_name: microjoint
relations:
- kind: is_anchor
  subject: floor
  params: {}
- kind: is_anchor
  subject: microwave
  params: {}
- kind: 'on'
  subject: droid
  reference: floor
  params: {}
- kind: next_to
  subject: droid
  reference: microwave
  params:
    side: negative_x
    distance_m: 0.55
    tolerance_m: 0.08
    cross_position_ratio: 0.15
- kind: rotate_around_solution
  subject: droid
  params:
    yaw_rad: 0.0
- kind: position_limits_box
  subject: droid
  params:
    y_min: -1.65
    y_max: -1.5
task:
  composition: atomic
  description: Pull the handle to open the microwave door on the right wall.
  subtasks:
  - kind: OpenDoorTask
    params:
      openable_object: microwave
      openness_threshold: 0.25
      reset_openness: 0.0
      episode_length_s: 70.0
env_cfg_override:
  sim:
    render_interval: 8
placer_params:
  allow_best_loss_fallbacks: false

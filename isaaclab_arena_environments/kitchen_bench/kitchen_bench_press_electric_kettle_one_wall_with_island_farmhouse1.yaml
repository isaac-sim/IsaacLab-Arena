env_name: kitchen_bench_press_electric_kettle_one_wall_with_island_farmhouse1
embodiment:
  id: droid
  registry_name: droid_abs_joint_pos
  params:
    stand_height_m: 0.65
    placement_bbox_stand_only: true
    collision_mode: mesh
background:
  id: kitchen
  registry_name: lightwheel_kitchen_one_wall_with_island_farmhouse1
  params:
    collision_mode: mesh
objects:
- id: appliance
  registry_name: pressable_appliance
  params:
    pressable_joint_name: lid_button
    usd_path: https://huggingface.co/datasets/ForgeCAD/simready-assets/resolve/0573053fa2c9174ca2a4678a462ec4dfd3035d59/electric_kettle/simready_usd/electric_kettle.usda
- id: distractor_1
  registry_name: wooden_bowl_hot3d_robolab
- id: distractor_2
  registry_name: apple_01_objaverse_robolab
object_references:
- id: floor
  parent_id: kitchen
  prim_path: floor_room/geometry
  object_type: base
- id: counter
  parent_id: kitchen
  prim_path: island_island_group
  object_type: base
relations:
- kind: is_anchor
  subject: floor
- kind: is_anchor
  subject: counter
- kind: 'on'
  subject: appliance
  reference: counter
- kind: rotate_around_solution
  subject: appliance
  params:
    yaw_rad: 2.04324
- kind: 'on'
  subject: droid
  reference: floor
- kind: rotate_around_solution
  subject: droid
  params:
    yaw_rad: -1.45
- kind: position_limits_box
  subject: appliance
  params:
    x_limits:
    - 1.67
    - 1.83
    y_limits:
    - -2.24
    - -2.14
- kind: align_with
  subject: droid
  reference: appliance
  params:
    axis: x
    offset_m: -0.12
    tolerance_m: 0.1
- kind: align_with
  subject: droid
  reference: appliance
  params:
    axis: y
    offset_m: 1.1
    tolerance_m: 0.07
- kind: 'on'
  subject: distractor_1
  reference: counter
- kind: align_with
  subject: distractor_1
  reference: appliance
  params:
    axis: x
    offset_m: 0.36
    tolerance_m: 0.05
- kind: align_with
  subject: distractor_1
  reference: appliance
  params:
    axis: y
    offset_m: 0
    tolerance_m: 0.05
- kind: 'on'
  subject: distractor_2
  reference: counter
- kind: align_with
  subject: distractor_2
  reference: appliance
  params:
    axis: x
    offset_m: 0.58
    tolerance_m: 0.05
- kind: align_with
  subject: distractor_2
  reference: appliance
  params:
    axis: y
    offset_m: 0
    tolerance_m: 0.05
task:
  composition: atomic
  description: Press the lid-release button on top of the kettle handle.
  subtasks:
  - kind: PressButtonTask
    params:
      pressable_object: appliance

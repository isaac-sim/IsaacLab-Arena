env_name: kitchen_bench_lightwheel_open_cabinet_above_dishwasher_g_shaped_large_scandinavian
embodiment:
  id: droid
  registry_name: droid_abs_joint_pos
  params:
    stand_height_m: 1.0
    placement_bbox_stand_only: true
    collision_mode: mesh
background:
  id: kitchen
  registry_name: lightwheel_kitchen_g_shaped_large_scandinavian
  params: {}
objects: []
object_references:
- id: floor
  parent_id: kitchen
  prim_path: floor_room/geometry
  object_type: base
  params: {}
- id: cabinet
  parent_id: kitchen
  prim_path: cab_1_left_group
  object_type: articulation
  params:
    openable_joint_name: left_door_joint
relations:
- kind: is_anchor
  subject: floor
  params: {}
- kind: is_anchor
  subject: cabinet
  params: {}
- kind: 'on'
  subject: droid
  reference: floor
  params: {}
- kind: next_to
  subject: droid
  reference: cabinet
  params:
    side: positive_x
    distance_m: 0.5
    cross_position_ratio: -0.5
- kind: rotate_around_solution
  subject: droid
  params:
    yaw_rad: 3.14
task:
  composition: atomic
  description: Open the cabinet door above the dishwasher to 0.4 openness.
  subtasks:
  - kind: OpenDoorTask
    params:
      openable_object: cabinet
      openness_threshold: 0.4
      reset_openness: 0.0

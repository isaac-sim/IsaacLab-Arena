env_name: kitchen_bench_press_coffee_machine108_u_shaped_with_island_farmhouse2
embodiment:
  id: droid
  registry_name: droid_abs_joint_pos
  params:
    stand_height_m: 0.85
    placement_bbox_stand_only: true
    collision_mode: mesh
background:
  id: kitchen
  registry_name: lightwheel_kitchen_u_shaped_with_island_farmhouse2
  params:
    collision_mode: mesh
objects:
- id: appliance
  registry_name: lightwheel_coffee_machine108
- id: distractor_1
  registry_name: plate_small_vomp_robolab
- id: distractor_2
  registry_name: mustard_bottle
- id: distractor_3
  registry_name: banana_ycb_robolab
- id: distractor_4
  registry_name: apple_01_objaverse_robolab
object_references:
- id: floor
  parent_id: kitchen
  prim_path: floor_room/geometry
  object_type: base
- id: counter
  parent_id: kitchen
  prim_path: island_island_group
  object_type: base
relations:
- kind: is_anchor
  subject: floor
- kind: is_anchor
  subject: counter
- kind: 'on'
  subject: appliance
  reference: counter
- kind: rotate_around_solution
  subject: appliance
  params:
    yaw_rad: -0.35873
    max_random_yaw_rad: 0.35
- kind: 'on'
  subject: droid
  reference: floor
- kind: rotate_around_solution
  subject: droid
  params:
    yaw_rad: 1.4
    max_random_yaw_rad: 0.15
- kind: position_limits_box
  subject: appliance
  params:
    x_limits:
    - 3.45
    - 3.95
    y_limits:
    - -3.11
    - -2.95
- kind: align_with
  subject: droid
  reference: appliance
  params:
    axis: x
    offset_m: -0.14
    tolerance_m: 0.25
- kind: align_with
  subject: droid
  reference: appliance
  params:
    axis: y
    offset_m: -1.2
    tolerance_m: 0.1
- kind: 'on'
  subject: distractor_1
  reference: counter
- kind: position_limits_box
  subject: distractor_1
  params:
    x_limits: &id001
    - 2.3
    - 4.3
    y_limits: &id002
    - -3.4
    - -2.7
- kind: 'on'
  subject: distractor_2
  reference: counter
- kind: position_limits_box
  subject: distractor_2
  params:
    x_limits: *id001
    y_limits: *id002
- kind: 'on'
  subject: distractor_3
  reference: counter
- kind: position_limits_box
  subject: distractor_3
  params:
    x_limits: *id001
    y_limits: *id002
- kind: 'on'
  subject: distractor_4
  reference: counter
- kind: position_limits_box
  subject: distractor_4
  params:
    x_limits: *id001
    y_limits: *id002
task:
  composition: atomic
  description: Press the right round button above the coffee dispenser.
  subtasks:
  - kind: PressButtonTask
    params:
      pressable_object: appliance

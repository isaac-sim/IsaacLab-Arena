env_name: kitchen_bench_round2_peninsula_soup_in_far_bowl
embodiment:
  id: droid
  registry_name: droid_abs_joint_pos
  params:
    stand_height_m: 0.8
    placement_bbox_stand_only: true
background:
  id: kitchen
  registry_name: replicator_kitchen_peninsula
  params:
    collision_mode: mesh
objects:
- id: soup
  registry_name: alphabet_soup_can_hope_robolab
  params: {}
- id: near_bowl
  registry_name: bowl_ycb_robolab
  params:
    scale:
    - 1.25
    - 1.25
    - 1.0
- id: far_bowl
  registry_name: bowl_ycb_robolab
  params:
    scale:
    - 1.25
    - 1.25
    - 1.0
object_references:
- id: floor
  parent_id: kitchen
  prim_path: KitchenRoom/Floor
  object_type: base
  params: {}
- id: island_top
  parent_id: kitchen
  prim_path: CapSurface_02
  object_type: base
  params: {}
relations:
- kind: is_anchor
  subject: floor
  params: {}
- kind: is_anchor
  subject: island_top
  params: {}
- kind: 'on'
  subject: droid
  reference: floor
  params: {}
- kind: next_to
  subject: droid
  reference: island_top
  params:
    side: positive_y
    distance_m: 0.08
    tolerance_m: 0.04
- kind: rotate_around_solution
  subject: droid
  params:
    yaw_rad: -1.57
- kind: 'on'
  subject: soup
  params: {}
  reference: island_top
- kind: 'on'
  subject: near_bowl
  params: {}
  reference: island_top
- kind: 'on'
  subject: far_bowl
  params: {}
  reference: island_top
- kind: position_limits_box
  subject: near_bowl
  params:
    x_min: 0.27
    x_max: 0.32
    y_min: -0.17
    y_max: -0.14
- kind: next_to
  subject: far_bowl
  params:
    side: negative_y
    distance_m: 0.07
    tolerance_m: 0.03
  reference: near_bowl
- kind: next_to
  subject: soup
  params:
    side: positive_x
    distance_m: 0.07
    tolerance_m: 0.03
  reference: near_bowl
- kind: position_limits_box
  subject: far_bowl
  params:
    x_min: 0.27
    x_max: 0.32
- kind: position_limits_box
  subject: droid
  params:
    x_min: 0.25
    x_max: 0.35
task:
  composition: atomic
  description: Pick up the soup can and put it in the red bowl farthest from the robot.
  subtasks:
  - kind: PickAndPlaceTask
    params:
      pick_up_object: soup
      destination_location: far_bowl
      destination_object: far_bowl
      background_scene: kitchen
      episode_length_s: 80
env_cfg_override:
  sim:
    render_interval: 8
placer_params:
  allow_best_loss_fallbacks: false

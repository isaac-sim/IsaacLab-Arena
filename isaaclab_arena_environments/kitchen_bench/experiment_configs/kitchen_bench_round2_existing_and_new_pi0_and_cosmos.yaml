# Original baselines, first-round additions, and six second-round environments.
# pi0 runs use pi05 as in the other KitchenBench comparisons.
# Do not submit until each round2 environment passes its local success gate.
shared:
  environment:
    enable_cameras: true
  environment_builder:
    num_envs: 25
  rollout_limit:
    num_episodes: 100
  variations:
    droid_abs_joint_pos:
      camera_extrinsics_wrist_camera:
        enabled: false
        sampler_cfg:
          low:
          - -0.03
          - -0.03
          - -0.03
          high:
          - 0.03
          - 0.03
          - 0.03
runs:
  round1_kitchen_bench_replicator_g_shape_banana_in_left_bowl_pi0:
    environment:
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_replicator_g_shape_banana_in_left_bowl.yaml
    policy:
      type: isaaclab_arena_openpi.policy.pi0_remote_policy.Pi0RemotePolicy
      policy_variant: pi05
      policy_device: cuda:0
      remote_host: 127.0.0.1
      remote_port: 8000

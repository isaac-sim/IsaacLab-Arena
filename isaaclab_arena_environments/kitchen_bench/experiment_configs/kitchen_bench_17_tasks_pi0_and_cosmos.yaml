# Runs every kitchen_bench task with both the OpenPI (pi0) and Cosmos policies (17 tasks x 2 policies = 34 runs).
runs:

  kitchen_bench_lightwheel_open_fridge_pi0:
    environment: &kitchen_bench_lightwheel_open_fridge_env
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_lightwheel_open_fridge.yaml
      enable_cameras: true
    policy: &openpi_policy
      type: isaaclab_arena_openpi.policy.pi0_remote_policy.Pi0RemotePolicy
      policy_variant: pi05
      policy_device: cuda:0
      remote_host: 127.0.0.1
      remote_port: 8000
      openpi_embodiment_adapter: droid
    environment_builder: &pi0_builder
      num_envs: 25
    rollout_limit:
      num_episodes: 100

  kitchen_bench_lightwheel_open_fridge_cosmos:
    environment: *kitchen_bench_lightwheel_open_fridge_env
    policy: &cosmos_policy
      type: isaaclab_arena_cosmos.policy.cosmos_remote_policy.CosmosRemotePolicy
      cosmos_embodiment_adapter: droid
      policy_device: cuda:0
      remote_host: 127.0.0.1
      remote_port: 8000
    environment_builder: &cosmos_builder
      num_envs: 25
    rollout_limit:
      num_episodes: 100

  kitchen_bench_lightwheel_open_microwave_pi0:
    environment: &kitchen_bench_lightwheel_open_microwave_env
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_lightwheel_open_microwave.yaml
      enable_cameras: true
    policy: *openpi_policy
    environment_builder: *pi0_builder
    rollout_limit:
      num_episodes: 100

  kitchen_bench_lightwheel_open_microwave_cosmos:
    environment: *kitchen_bench_lightwheel_open_microwave_env
    policy: *cosmos_policy
    environment_builder: *cosmos_builder
    rollout_limit:
      num_episodes: 100

  kitchen_bench_lightwheel_pick_and_place_pi0:

# Rebuild after each pair of episodes, matching the locally validated execution setup.
shared:
  num_rebuilds: 50
  environment:
    enable_cameras: true
  environment_builder:
    num_envs: 2
    seed: 42
    camera_resolution_mode: POLICY_DEFAULT
  rollout_limit:
    num_episodes: 100
runs:
  stand_mixer003_pi05:
    environment:
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_turn_stand_mixer003_g_shaped_large_scandinavian.yaml
    policy: &id001
      type: isaaclab_arena_openpi.policy.pi0_remote_policy.Pi0RemotePolicy
      policy_variant: pi05
      remote_host: 127.0.0.1
      remote_port: 8000
      openpi_embodiment_adapter: droid
      policy_device: cuda:0
  stand_mixer003_cosmos:
    environment:
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_turn_stand_mixer003_g_shaped_large_scandinavian.yaml
    policy: &id002
      type: isaaclab_arena_cosmos.policy.cosmos_remote_policy.CosmosRemotePolicy
      cosmos_embodiment_adapter: droid
      policy_device: cuda:0
      remote_host: 127.0.0.1
      remote_port: 8000
  palatial_toaster_pi05:
    environment:
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_turn_palatial_toaster_u_shaped_modern1.yaml
    policy: *id001
  palatial_toaster_cosmos:
    environment:
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_turn_palatial_toaster_u_shaped_modern1.yaml
    policy: *id002
  nvidia_toaster_pi05:
    environment:
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_turn_nvidia_toaster_g_shaped_rustic.yaml
    policy: *id001
  nvidia_toaster_cosmos:
    environment:
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_turn_nvidia_toaster_g_shaped_rustic.yaml
    policy: *id002
  toaster_oven001_pi05:
    environment:
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_turn_toaster_oven001_u_shaped_with_island_farmhouse2.yaml
    policy: *id001
  toaster_oven001_cosmos:
    environment:
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_turn_toaster_oven001_u_shaped_with_island_farmhouse2.yaml
    policy: *id002
  toaster002_pi05:
    environment:
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_turn_toaster002_one_wall_with_island_farmhouse1.yaml
    policy: *id001
  toaster002_cosmos:
    environment:
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_turn_toaster002_one_wall_with_island_farmhouse1.yaml
    policy: *id002
  palatial_blender_pi05:
    environment:
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_turn_palatial_blender_one_wall_coastal.yaml
    policy: *id001
  palatial_blender_cosmos:
    environment:
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_turn_palatial_blender_one_wall_coastal.yaml
    policy: *id002
  blender003_pi05:
    environment:
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_turn_blender003_l_shaped_scandinavian.yaml
    policy: *id001
  blender003_cosmos:
    environment:
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_turn_blender003_l_shaped_scandinavian.yaml
    policy: *id002
  palatial_food_processor_pi05:
    environment:
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_turn_palatial_food_processor_galley_industrial.yaml
    policy: *id001
  palatial_food_processor_cosmos:
    environment:
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_turn_palatial_food_processor_galley_industrial.yaml
    policy: *id002

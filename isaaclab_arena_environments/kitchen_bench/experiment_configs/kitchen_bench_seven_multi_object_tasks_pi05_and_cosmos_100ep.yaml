shared:
  num_rebuilds: 50
  environment:
    enable_cameras: true
  environment_builder:
    num_envs: 2
    seed: 42
    camera_resolution_mode: POLICY_DEFAULT
  rollout_limit:
    num_episodes: 100
runs:
  two_food_boxes_in_basket_scandinavian_pi05:
    environment:
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_multi_object_two_food_boxes_in_basket_scandinavian.yaml
    policy:
      type: isaaclab_arena_openpi.policy.pi0_remote_policy.Pi0RemotePolicy
      policy_variant: pi05
      remote_host: 127.0.0.1
      remote_port: 8000
      openpi_embodiment_adapter: droid
      policy_device: cuda:0

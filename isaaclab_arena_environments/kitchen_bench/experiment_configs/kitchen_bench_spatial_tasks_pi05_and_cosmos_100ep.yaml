# 9 spatial-placement KitchenBench tasks, each run with both the OpenPI (pi0.5) and Cosmos policies
# (18 runs, 20 parallel environments each).
# Values under shared are used by every Run below.
# A Run only needs to list what is different; its values override the shared ones.
# To change a shared value for every Run on the command line:
# - with experiment_runner.py, use shared.<path>=<value>
# - with osmo/submit_arena_experiment.py, use experiment_cfg.shared.<path>=<value>
shared:
  environment:
    enable_cameras: true
  environment_builder:
    num_envs: 20
    seed: 42
  rollout_limit:
    num_episodes: 100

runs:

  kitchen_bench_replicator_spatial_g_shape_apple_in_right_bowl_pi05:
    environment: &kitchen_bench_replicator_spatial_g_shape_apple_in_right_bowl_env
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_replicator_spatial_g_shape_apple_in_right_bowl.yaml
    policy: &openpi_policy
      type: isaaclab_arena_openpi.policy.pi0_remote_policy.Pi0RemotePolicy
      policy_variant: pi05
      policy_device: cuda:0
      remote_host: 127.0.0.1
      remote_port: 8000
      openpi_embodiment_adapter: droid

  kitchen_bench_replicator_spatial_g_shape_apple_in_right_bowl_cosmos:
    environment: *kitchen_bench_replicator_spatial_g_shape_apple_in_right_bowl_env
    policy: &cosmos_policy
      type: isaaclab_arena_cosmos.policy.cosmos_remote_policy.CosmosRemotePolicy
      cosmos_embodiment_adapter: droid
      policy_device: cuda:0
      remote_host: 127.0.0.1
      remote_port: 8000

  kitchen_bench_replicator_spatial_l_island_bagel_on_plate_left_of_mug_pi05:
    environment: &kitchen_bench_replicator_spatial_l_island_bagel_on_plate_left_of_mug_env
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_replicator_spatial_l_island_bagel_on_plate_left_of_mug.yaml
    policy: *openpi_policy

  kitchen_bench_replicator_spatial_l_island_bagel_on_plate_left_of_mug_cosmos:
    environment: *kitchen_bench_replicator_spatial_l_island_bagel_on_plate_left_of_mug_env
    policy: *cosmos_policy

  kitchen_bench_replicator_spatial_peninsula_lemon_on_near_plate_pi05:
    environment: &kitchen_bench_replicator_spatial_peninsula_lemon_on_near_plate_env
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_replicator_spatial_peninsula_lemon_on_near_plate.yaml
    policy: *openpi_policy

  kitchen_bench_replicator_spatial_peninsula_lemon_on_near_plate_cosmos:
    environment: *kitchen_bench_replicator_spatial_peninsula_lemon_on_near_plate_env
    policy: *cosmos_policy

  kitchen_bench_lightwheel_spatial_place_lime_in_bowl_between_landmarks_one_wall_coastal_pi05:
    environment: &kitchen_bench_lightwheel_spatial_place_lime_in_bowl_between_landmarks_one_wall_coastal_env
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_lightwheel_spatial_place_lime_in_bowl_between_landmarks_one_wall_coastal.yaml
    policy: *openpi_policy

  kitchen_bench_lightwheel_spatial_place_lime_in_bowl_between_landmarks_one_wall_coastal_cosmos:
    environment: *kitchen_bench_lightwheel_spatial_place_lime_in_bowl_between_landmarks_one_wall_coastal_env
    policy: *cosmos_policy

  kitchen_bench_replicator_spatial_l_island_orange_in_front_right_bowl_pi05:

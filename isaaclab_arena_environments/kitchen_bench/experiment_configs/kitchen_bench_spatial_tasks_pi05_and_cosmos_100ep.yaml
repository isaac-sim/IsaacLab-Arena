# 9 spatial-placement KitchenBench tasks, each run with both the OpenPI (pi0.5) and Cosmos policies
# (18 runs, 20 parallel environments each).
# Values under shared are used by every Run below.
# A Run only needs to list what is different; its values override the shared ones.
# To change a shared value for every Run on the command line:
# - with experiment_runner.py, use shared.<path>=<value>
# - with osmo/submit_arena_experiment.py, use experiment_cfg.shared.<path>=<value>
shared:
  environment:
    enable_cameras: true
  environment_builder:
    num_envs: 20
    seed: 42
  rollout_limit:
    num_episodes: 100

runs:

  apple_in_right_bowl_g_shape_pi05:
    environment: &apple_in_right_bowl_g_shape_env
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_spatial_apple_in_right_bowl_g_shape.yaml
    policy: &openpi_policy
      type: isaaclab_arena_openpi.policy.pi0_remote_policy.Pi0RemotePolicy
      policy_variant: pi05
      policy_device: cuda:0
      remote_host: 127.0.0.1
      remote_port: 8000
      openpi_embodiment_adapter: droid

  apple_in_right_bowl_g_shape_cosmos:
    environment: *apple_in_right_bowl_g_shape_env
    policy: &cosmos_policy
      type: isaaclab_arena_cosmos.policy.cosmos_remote_policy.CosmosRemotePolicy
      cosmos_embodiment_adapter: droid
      policy_device: cuda:0
      remote_host: 127.0.0.1
      remote_port: 8000

  bagel_on_plate_left_of_mug_l_island_pi05:
    environment: &bagel_on_plate_left_of_mug_l_island_env
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_spatial_bagel_on_plate_left_of_mug_l_island.yaml
    policy: *openpi_policy

  bagel_on_plate_left_of_mug_l_island_cosmos:
    environment: *bagel_on_plate_left_of_mug_l_island_env
    policy: *cosmos_policy

  lemon_on_near_plate_peninsula_pi05:
    environment: &lemon_on_near_plate_peninsula_env
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_spatial_lemon_on_near_plate_peninsula.yaml
    policy: *openpi_policy

  lemon_on_near_plate_peninsula_cosmos:
    environment: *lemon_on_near_plate_peninsula_env
    policy: *cosmos_policy

  lime_in_bowl_between_landmarks_coastal_pi05:
    environment: &lime_in_bowl_between_landmarks_coastal_env
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_spatial_lime_in_bowl_between_landmarks_coastal.yaml
    policy: *openpi_policy

  lime_in_bowl_between_landmarks_coastal_cosmos:
    environment: *lime_in_bowl_between_landmarks_coastal_env
    policy: *cosmos_policy

  orange_in_front_right_bowl_l_island_pi05:
    environment: &orange_in_front_right_bowl_l_island_env
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_spatial_orange_in_front_right_bowl_l_island.yaml
    policy: *openpi_policy

  orange_in_front_right_bowl_l_island_cosmos:
    environment: *orange_in_front_right_bowl_l_island_env
    policy: *cosmos_policy

  orange_in_back_right_bowl_l_island_pi05:
    environment: &orange_in_back_right_bowl_l_island_env
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_spatial_orange_in_back_right_bowl_l_island.yaml
    policy: *openpi_policy

  orange_in_back_right_bowl_l_island_cosmos:
    environment: *orange_in_back_right_bowl_l_island_env
    policy: *cosmos_policy

  pepper_in_middle_bowl_scandinavian_pi05:
    environment: &pepper_in_middle_bowl_scandinavian_env
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_spatial_pepper_in_middle_bowl_scandinavian.yaml
    policy: *openpi_policy

  pepper_in_middle_bowl_scandinavian_cosmos:
    environment: *pepper_in_middle_bowl_scandinavian_env
    policy: *cosmos_policy

  sponge_on_tray_behind_plate_u_shape_pi05:
    environment: &sponge_on_tray_behind_plate_u_shape_env
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_spatial_sponge_on_tray_behind_plate_u_shape.yaml
    policy: *openpi_policy

  sponge_on_tray_behind_plate_u_shape_cosmos:
    environment: *sponge_on_tray_behind_plate_u_shape_env
    policy: *cosmos_policy

  red_onion_in_bowl_nearest_pepper_farmhouse_pi05:
    environment: &red_onion_in_bowl_nearest_pepper_farmhouse_env
      type: isaaclab_arena_environments/kitchen_bench/kitchen_bench_spatial_red_onion_in_bowl_nearest_pepper_farmhouse.yaml
    policy: *openpi_policy


env_name: kitchen_bench_turn_forgecad_toaster_g_shaped_rustic
tags:
- turn_knob
embodiment:
  id: droid
  registry_name: droid_abs_joint_pos
  params:
    stand_height_m: 0.85
    placement_bbox_stand_only: true
    collision_mode: mesh
background:
  id: kitchen
  registry_name: lightwheel_kitchen_g_shaped_rustic
  params:
    collision_mode: mesh
objects:
- id: appliance
  registry_name: forgecad_toaster
- id: distractor_1
  registry_name: sugar_box
- id: distractor_2
  registry_name: tomato_soup_can
object_references:
- id: floor
  parent_id: kitchen
  prim_path: floor_room/geometry
  object_type: base
- id: counter
  parent_id: kitchen
  prim_path: counter_1_right_group
  object_type: base
- id: sink
  parent_id: kitchen
  prim_path: sink_right_group
  object_type: base
  params:
    collision_mode: bbox
relations:
- kind: is_anchor
  subject: floor
- kind: is_anchor
  subject: counter
- kind: is_anchor
  subject: sink
- kind: 'on'
  subject: appliance
  reference: counter
- kind: rotate_around_solution
  subject: appliance
  params:
    yaw_rad: -1.5707963267948966
- kind: position_limits_box
  subject: appliance
  params:
    x_limits: [3.9, 4.1]
    y_limits: [-2.9, -1.7]
- kind: 'on'
  subject: droid
  reference: floor
- kind: rotate_around_solution
  subject: droid
  params:
    yaw_rad: -0.18
- kind: align_with
  subject: droid
  reference: appliance
  params:
    axis: x
    offset_m: -1.05
    tolerance_m: 0.07
- kind: align_with
  subject: droid
  reference: appliance
  params:
    axis: y
    offset_m: 0.1
    tolerance_m: 0.15
- kind: 'on'
  subject: distractor_1
  reference: counter
- kind: align_with
  subject: distractor_1
  reference: appliance
  params:
    axis: x
    tolerance_m: 0.1
- kind: align_with
  subject: distractor_1
  reference: appliance
  params:
    axis: y
    tolerance_m: 0.6
- kind: 'on'
  subject: distractor_2
  reference: counter
- kind: align_with
  subject: distractor_2
  reference: appliance
  params:
    axis: x
    tolerance_m: 0.1
- kind: align_with
  subject: distractor_2
  reference: appliance
  params:
    axis: y
    tolerance_m: 0.6
task:
  composition: atomic
  description: Turn the round browning dial on the front of the silver toaster clockwise.
  subtasks:
  - kind: TurnKnobTask
    params:
      turnable_object: appliance
      target_level: 1
      reset_level: -1

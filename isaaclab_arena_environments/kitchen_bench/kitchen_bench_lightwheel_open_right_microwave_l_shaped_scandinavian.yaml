env_name: kitchen_bench_lightwheel_open_right_microwave_l_shaped_scandinavian
embodiment:
  id: droid
  registry_name: droid_abs_joint_pos
  params:
    stand_height_m: 1.15
    placement_bbox_stand_only: true
    collision_mode: mesh
background:
  id: kitchen
  registry_name: lightwheel_kitchen_l_shaped_scandinavian
  params:
    collision_mode: mesh
objects: []
object_references:
- id: floor
  parent_id: kitchen
  prim_path: floor_room/geometry
  object_type: base
- id: microwave
  parent_id: kitchen
  prim_path: microwave_right_group
  object_type: articulation
  params:
    openable_joint_name: microjoint
# Sample within alignment bands instead of pulling each layout to a single offset.
relations:
- kind: is_anchor
  subject: floor
- kind: is_anchor
  subject: microwave
- kind: 'on'
  subject: droid
  reference: floor
- kind: align_with
  subject: droid
  reference: microwave
  params:
    axis: x
    offset_m: -1.33
    tolerance_m: 0.05
- kind: rotate_around_solution
  subject: droid
  params:
    yaw_rad: 0.0
- kind: align_with
  subject: droid
  reference: microwave
  params:
    axis: y
    offset_m: -0.011
    tolerance_m: 0.12
task:
  composition: atomic
  description: Pull the handle to open the microwave door on the right wall.
  subtasks:
  - kind: OpenDoorTask
    params:
      openable_object: microwave
      openness_threshold: 0.25
      reset_openness: 0.0

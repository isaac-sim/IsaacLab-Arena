env_name: kitchen_bench_turn_stand_mixer003_g_shaped_large_scandinavian
embodiment:
  id: droid
  registry_name: droid_abs_joint_pos
  params:
    stand_height_m: 0.65
    placement_bbox_stand_only: true
    collision_mode: mesh
background:
  id: kitchen
  registry_name: lightwheel_kitchen_g_shaped_large_scandinavian
  params:
    collision_mode: mesh
objects:
- id: appliance
  registry_name: turnable_appliance
  params:
    turnable_joint_name: knob_speed_joint
    min_level_angle_deg: 30.0
    max_level_angle_deg: 150.0
    num_levels: 5
    knob_damping: 0.05
    lightwheel_file_version: 1fa445fe-51bf-4df3-a4bf-b6415846a79b
- id: distractor_1
  registry_name: sugar_box
- id: distractor_2
  registry_name: mug
object_references:
- id: floor
  parent_id: kitchen
  prim_path: floor_room/geometry
  object_type: base
- id: counter
  parent_id: kitchen
  prim_path: counter_1_left_group
  object_type: base
relations:
- kind: is_anchor
  subject: floor
- kind: is_anchor
  subject: counter
- kind: 'on'
  subject: appliance
  reference: counter
- kind: rotate_around_solution
  subject: appliance
  params:
    yaw_rad: 0
- kind: 'on'
  subject: droid
  reference: floor
- kind: rotate_around_solution
  subject: droid
  params:
    yaw_rad: 3.05
- kind: position_limits_box
  subject: appliance
  params:
    x_limits: [0.27, 0.43]
    y_limits: [-3.25, -3.15]
- kind: align_with
  subject: droid
  reference: appliance
  params:
    axis: x
    offset_m: 1.03
    tolerance_m: 0.1
- kind: align_with
  subject: droid
  reference: appliance
  params:
    axis: y
    offset_m: 0
    tolerance_m: 0.07
- kind: 'on'
  subject: distractor_1
  reference: counter
- kind: align_with
  subject: distractor_1
  reference: appliance
  params:
    axis: x
    offset_m: 0
    tolerance_m: 0.05
- kind: align_with
  subject: distractor_1
  reference: appliance
  params:
    axis: y
    offset_m: 0.42
    tolerance_m: 0.05
- kind: 'on'
  subject: distractor_2
  reference: counter
- kind: align_with
  subject: distractor_2
  reference: appliance
  params:
    axis: x
    offset_m: 0
    tolerance_m: 0.05
- kind: align_with
  subject: distractor_2
  reference: appliance
  params:
    axis: y
    offset_m: 0.7
    tolerance_m: 0.05
task:
  composition: atomic
  description: Turn the large round knob on the side of the stand mixer clockwise to turn it on.
  subtasks:
  - kind: TurnKnobTask
    params:
      turnable_object: appliance
      target_level: 0
      reset_level: -1

env_name: kitchen_bench_turn_toaster002_one_wall_with_island_farmhouse1
embodiment:
  id: droid
  registry_name: droid_abs_joint_pos
  params:
    stand_height_m: 0.65
    placement_bbox_stand_only: true
    collision_mode: mesh
background:
  id: kitchen
  registry_name: lightwheel_kitchen_one_wall_with_island_farmhouse1
  params:
    collision_mode: mesh
objects:
- id: appliance
  registry_name: lightwheel_toaster002
- id: distractor_1
  registry_name: wooden_bowl_hot3d_robolab
- id: distractor_2
  registry_name: apple_01_objaverse_robolab
object_references:
- id: floor
  parent_id: kitchen
  prim_path: floor_room/geometry
  object_type: base
- id: counter
  parent_id: kitchen
  prim_path: island_island_group
  object_type: base
- id: sink
  parent_id: kitchen
  prim_path: sink_island_group
  object_type: base
  params:
    collision_mode: bbox
relations:
- kind: is_anchor
  subject: floor
- kind: is_anchor
  subject: counter
- kind: is_anchor
  subject: sink
- kind: 'on'
  subject: appliance
  reference: counter
- kind: rotate_around_solution
  subject: appliance
  params:
    yaw_rad: 3.141592653589793
    max_random_yaw_rad: 0.2
- kind: position_limits_box
  subject: appliance
  params:
    x_limits: [1.15, 2.35]
    y_limits: [-2.24, -2.04]
- kind: 'on'
  subject: droid
  reference: floor
- kind: rotate_around_solution
  subject: droid
  params:
    yaw_rad: -1.45
- kind: align_with
  subject: droid
  reference: appliance
  params:
    axis: x
    offset_m: -0.12
    tolerance_m: 0.15
- kind: align_with
  subject: droid
  reference: appliance
  params:
    axis: y
    offset_m: 1.1
    tolerance_m: 0.07
- kind: 'on'
  subject: distractor_1
  reference: counter
- kind: align_with
  subject: distractor_1
  reference: appliance
  params:
    axis: x
    tolerance_m: 0.6
- kind: align_with
  subject: distractor_1
  reference: appliance
  params:
    axis: y
    tolerance_m: 0.1
- kind: 'on'
  subject: distractor_2
  reference: counter
- kind: align_with
  subject: distractor_2
  reference: appliance
  params:
    axis: x
    tolerance_m: 0.6
- kind: align_with
  subject: distractor_2
  reference: appliance
  params:
    axis: y
    tolerance_m: 0.1
task:
  composition: atomic
  description: Turn the black round dial at the bottom of the toaster clockwise.
  subtasks:
  - kind: TurnKnobTask
    params:
      turnable_object: appliance
      target_level: 1
      reset_level: -1

env_name: kitchen_bench_press_toaster053_g_shaped_rustic
embodiment:
  id: droid
  registry_name: droid_abs_joint_pos
  params:
    stand_height_m: 0.85
    placement_bbox_stand_only: true
    collision_mode: mesh
background:
  id: kitchen
  registry_name: lightwheel_kitchen_g_shaped_rustic
  params:
    collision_mode: mesh
objects:
- id: appliance
  registry_name: pressable_appliance
  params:
    pressable_joint_name: button_cancel_joint
    lightwheel_file_version: 37b1ec84-b507-4764-8675-d11f8a1a31da
- id: distractor_1
  registry_name: sugar_box
- id: distractor_2
  registry_name: tomato_soup_can
object_references:
- id: floor
  parent_id: kitchen
  prim_path: floor_room/geometry
  object_type: base
- id: counter
  parent_id: kitchen
  prim_path: counter_1_right_group
  object_type: base
relations:
- kind: is_anchor
  subject: floor
- kind: is_anchor
  subject: counter
- kind: 'on'
  subject: appliance
  reference: counter
- kind: rotate_around_solution
  subject: appliance
  params:
    yaw_rad: 4.91488
- kind: 'on'
  subject: droid
  reference: floor
- kind: rotate_around_solution
  subject: droid
  params:
    yaw_rad: -0.18
- kind: position_limits_box
  subject: appliance
  params:
    x_limits:
    - 3.97
    - 4.13
    y_limits:
    - -2.35
    - -2.25
- kind: align_with
  subject: droid
  reference: appliance
  params:
    axis: x
    offset_m: -1.05
    tolerance_m: 0.1
- kind: align_with
  subject: droid
  reference: appliance
  params:
    axis: y
    offset_m: 0.16
    tolerance_m: 0.07
- kind: 'on'
  subject: distractor_1
  reference: counter
- kind: align_with
  subject: distractor_1
  reference: appliance
  params:
    axis: x
    offset_m: 0
    tolerance_m: 0.05
- kind: align_with
  subject: distractor_1
  reference: appliance
  params:
    axis: y
    offset_m: -0.3
    tolerance_m: 0.05
- kind: 'on'
  subject: distractor_2
  reference: counter
- kind: align_with
  subject: distractor_2
  reference: appliance
  params:
    axis: x
    offset_m: 0
    tolerance_m: 0.05
- kind: align_with
  subject: distractor_2
  reference: appliance
  params:
    axis: y
    offset_m: 0.4
    tolerance_m: 0.05
task:
  composition: atomic
  description: Press the small cancel button beside the browning dial on the toaster.
  subtasks:
  - kind: PressButtonTask
    params:
      pressable_object: appliance

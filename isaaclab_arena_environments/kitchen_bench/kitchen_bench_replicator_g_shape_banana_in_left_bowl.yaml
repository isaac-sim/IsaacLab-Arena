env_name: kitchen_bench_replicator_g_shape_banana_in_left_bowl
embodiment:
  id: droid
  registry_name: droid_abs_joint_pos
  params:
    stand_height_m: 0.8
    placement_bbox_stand_only: true
background:
  id: kitchen
  registry_name: replicator_kitchen_g_shape
  params:
    collision_mode: mesh
objects:
- id: banana
  registry_name: banana_ycb_robolab
- id: left_bowl
  registry_name: bowl_ycb_robolab
- id: right_bowl
  registry_name: bowl_ycb_robolab
object_references:
- id: floor
  parent_id: kitchen
  prim_path: KitchenRoom/Floor
  object_type: base
- id: corner_counter
  parent_id: kitchen
  prim_path: CornerCounter_00_0
  object_type: base
# Sample within alignment bands instead of pulling each layout to a single offset.
relations:
- kind: is_anchor
  subject: floor
- kind: is_anchor
  subject: corner_counter
- kind: 'on'
  subject: droid
  reference: floor
- kind: align_with
  subject: droid
  reference: corner_counter
  params:
    axis: y
    offset_m: -0.99
    tolerance_m: 0.05
- kind: rotate_around_solution
  subject: droid
  params:
    yaw_rad: 1.57
- kind: 'on'
  subject: banana
  reference: corner_counter
- kind: 'on'
  subject: left_bowl
  reference: corner_counter
- kind: 'on'
  subject: right_bowl
  reference: corner_counter
- kind: align_with
  subject: left_bowl
  reference: right_bowl
  params:
    axis: x
    offset_m: -0.28
    tolerance_m: 0.05
- kind: align_with
  subject: left_bowl
  reference: right_bowl
  params:
    axis: y
    tolerance_m: 0.1
- kind: align_with
  subject: banana
  reference: left_bowl
  params:
    axis: x
    tolerance_m: 0.1
- kind: align_with
  subject: banana
  reference: left_bowl
  params:
    axis: y
    offset_m: -0.24
    tolerance_m: 0.05
- kind: align_with
  subject: droid
  reference: left_bowl
  params:
    axis: x
    offset_m: 0.3
    tolerance_m: 0.12
task:
  composition: atomic
  description: Pick up the banana and place it in the left red bowl.
  subtasks:
  - kind: PickAndPlaceTask
    params:
      pick_up_object: banana
      destination_location: left_bowl
      destination_object: left_bowl
      background_scene: kitchen

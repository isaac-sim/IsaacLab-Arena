env_name: droid_bowl_to_sink_kitchen_peninsula
embodiment:
  id: droid
  registry_name: droid_abs_joint_pos
  params:
    stand_height_m: 0.8
    placement_bbox_stand_only: true
background:
  id: kitchen
  registry_name: replicator_kitchen_peninsula
  params:
    collision_mode: mesh
objects:
- id: bowl
  registry_name: bowl_ycb_robolab
  params: {}
object_references:
- id: floor
  parent_id: kitchen
  prim_path: KitchenRoom/Floor
  object_type: base
  params: {}
- id: sink
  parent_id: kitchen
  prim_path: Sink/BasinBottom
  object_type: base
  params: {}
- id: sink_counter
  parent_id: kitchen
  prim_path: CapSurface_01
  object_type: base
  params: {}
relations:
- kind: is_anchor
  subject: floor
  params: {}
- kind: is_anchor
  subject: sink
  params: {}
- kind: is_anchor
  subject: sink_counter
  params: {}
- kind: 'on'
  subject: droid
  reference: floor
  params: {}
- kind: next_to
  subject: droid
  reference: sink
  params:
    side: negative_y
    distance_m: 0.15
    tolerance_m: 0.15
- kind: rotate_around_solution
  subject: droid
  params:
    yaw_rad: 1.57
- kind: 'on'
  subject: bowl
  reference: sink_counter
  params: {}
- kind: next_to
  subject: bowl
  reference: sink
  params:
    side: negative_x
    distance_m: 0.1
task:
  composition: atomic
  description: pick up the bowl and place it in the sink
  subtasks:
  - kind: PickAndPlaceTask
    params:
      pick_up_object: bowl
      destination_location: sink
      background_scene: kitchen

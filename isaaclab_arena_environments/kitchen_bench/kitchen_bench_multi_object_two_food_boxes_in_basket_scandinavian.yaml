env_name: kitchen_bench_multi_object_two_food_boxes_in_basket_scandinavian
embodiment:
  id: droid
  registry_name: droid_abs_joint_pos
  params:
    stand_height_m: 0.8
    placement_bbox_stand_only: true
    collision_mode: mesh
background:
  id: kitchen
  registry_name: lightwheel_kitchen_l_shaped_scandinavian
  params:
    collision_mode: mesh
objects:
- id: cereal_box
  registry_name: simready_usd_object
  params:
    usd_path: https://huggingface.co/datasets/PalatialSim/palatial-nv-asset-library/resolve/69a87329036cec0440403351c12230970c4e67d8/D00120/simready_usd/D00120.usd
    scale: [0.65, 0.65, 0.65]
- id: food_box
  registry_name: simready_usd_object
  params:
    usd_path: https://huggingface.co/datasets/nvidia/simready-assets/resolve/653d91e182011f357cf1644013cc94ddf194d349/food_processed_boxedFood_f01/simready_usd/sm_food_processed_boxedFood_f01_01.usd
- id: basket
  registry_name: simready_usd_object
  params:
    usd_path: https://huggingface.co/datasets/nvidia/simready-assets/resolve/653d91e182011f357cf1644013cc94ddf194d349/misc_basket_plastic_a01/simready_usd/sm_misc_basket_plastic_a01_01.usd
    scale: [1.3, 1.3, 1]
- id: apple
  registry_name: apple_02_objaverse_robolab
- id: mug
  registry_name: mug_ycb_robolab
object_references:
- id: floor
  parent_id: kitchen
  prim_path: floor_room/geometry
  object_type: base
- id: counter
  parent_id: kitchen
  prim_path: counter_main_main_group/top_geometry_right
  object_type: base
relations:
- kind: is_anchor
  subject: floor
- kind: is_anchor
  subject: counter
- kind: 'on'
  subject: droid
  reference: floor
- kind: align_with
  subject: droid
  reference: counter
  params:
    axis: y
    offset_m: -0.965
    tolerance_m: 0.1
- kind: rotate_around_solution
  subject: droid
  params:
    yaw_rad: 1.5707963268
- kind: 'on'
  subject: cereal_box
  reference: counter
- kind: 'on'
  subject: food_box
  reference: counter
- kind: 'on'
  subject: basket
  reference: counter
- kind: 'on'
  subject: apple
  reference: counter
- kind: 'on'
  subject: mug
  reference: counter
- kind: align_with
  subject: cereal_box
  reference: droid
  params:
    axis: x
    tolerance_m: 0.3
- kind: align_with
  subject: cereal_box
  reference: droid
  params:
    axis: y
    offset_m: 1.03
    tolerance_m: 0.15
- kind: align_with
  subject: food_box
  reference: droid
  params:
    axis: x
    tolerance_m: 0.3
- kind: align_with
  subject: food_box
  reference: droid
  params:
    axis: y
    offset_m: 1.03
    tolerance_m: 0.15
- kind: align_with
  subject: basket
  reference: droid
  params:
    axis: x
    tolerance_m: 0.3
- kind: align_with
  subject: basket
  reference: droid
  params:
    axis: y
    offset_m: 1.03
    tolerance_m: 0.15
task:
  composition: parallel
  description: Put both food boxes into the basket.
  subtasks:
  - kind: PickAndPlaceTask
    params:
      pick_up_object: cereal_box
      destination_location: basket
      destination_object: basket
      background_scene: kitchen
  - kind: PickAndPlaceTask
    params:
      pick_up_object: food_box
      destination_location: basket
      destination_object: basket
      background_scene: kitchen

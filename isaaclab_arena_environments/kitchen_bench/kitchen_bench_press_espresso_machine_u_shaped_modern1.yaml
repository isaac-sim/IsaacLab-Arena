env_name: kitchen_bench_press_espresso_machine_u_shaped_modern1
embodiment:
  id: droid
  registry_name: droid_abs_joint_pos
  params:
    stand_height_m: 0.85
    placement_bbox_stand_only: true
    collision_mode: mesh
background:
  id: kitchen
  registry_name: lightwheel_kitchen_u_shaped_modern1
  params:
    collision_mode: mesh
objects:
- id: appliance
  registry_name: palatial_espresso_machine
- id: distractor_1
  registry_name: cracker_box
- id: distractor_2
  registry_name: mug
- id: distractor_3
  registry_name: banana_ycb_robolab
- id: distractor_4
  registry_name: sugar_box
object_references:
- id: floor
  parent_id: kitchen
  prim_path: floor_room/geometry
  object_type: base
- id: counter
  parent_id: kitchen
  prim_path: counter_1_left_group
  object_type: base
relations:
- kind: is_anchor
  subject: floor
- kind: is_anchor
  subject: counter
- kind: 'on'
  subject: appliance
  reference: counter
- kind: rotate_around_solution
  subject: appliance
  params:
    yaw_rad: 2.14233
    max_random_yaw_rad: 0.35
- kind: 'on'
  subject: droid
  reference: floor
- kind: rotate_around_solution
  subject: droid
  params:
    yaw_rad: 3.24
    max_random_yaw_rad: 0.15
- kind: position_limits_box
  subject: appliance
  params:
    x_limits:
    - 0.29
    - 0.45
    y_limits:
    - -1.7
    - -0.8
- kind: align_with
  subject: droid
  reference: appliance
  params:
    axis: x
    offset_m: 1.07
    tolerance_m: 0.1
- kind: align_with
  subject: droid
  reference: appliance
  params:
    axis: y
    offset_m: 0.1
    tolerance_m: 0.25
- kind: 'on'
  subject: distractor_1
  reference: counter
- kind: align_with
  subject: distractor_1
  reference: appliance
  params:
    axis: y
    tolerance_m: 0.6
- kind: align_with
  subject: distractor_1
  reference: appliance
  params:
    axis: x
    offset_m: 0
    tolerance_m: 0.1
- kind: 'on'
  subject: distractor_2
  reference: counter
- kind: align_with
  subject: distractor_2
  reference: appliance
  params:
    axis: y
    tolerance_m: 0.6
- kind: align_with
  subject: distractor_2
  reference: appliance
  params:
    axis: x
    offset_m: 0
    tolerance_m: 0.1
- kind: 'on'
  subject: distractor_3
  reference: counter
- kind: align_with
  subject: distractor_3
  reference: appliance
  params:
    axis: y
    tolerance_m: 0.6
- kind: align_with
  subject: distractor_3
  reference: appliance
  params:
    axis: x
    offset_m: 0
    tolerance_m: 0.1
- kind: 'on'
  subject: distractor_4
  reference: counter
- kind: align_with
  subject: distractor_4
  reference: appliance
  params:
    axis: y
    tolerance_m: 0.6
- kind: align_with
  subject: distractor_4
  reference: appliance
  params:
    axis: x
    offset_m: 0
    tolerance_m: 0.1
task:
  composition: atomic
  description: Press the leftmost power button above the pressure gauge on the espresso
    machine.
  subtasks:
  - kind: PressButtonTask
    params:
      pressable_object: appliance

env_name: kitchen_bench_lightwheel_place_three_fruits_in_wooden_bowl_l_shaped_scandinavian
embodiment:
  id: droid
  registry_name: droid_abs_joint_pos
  params:
    stand_height_m: 0.8
    placement_bbox_stand_only: true
    collision_mode: mesh
background:
  id: kitchen
  registry_name: lightwheel_kitchen_l_shaped_scandinavian
  params:
    collision_mode: mesh
objects:
- id: lime
  registry_name: lime01_fruits_veggies_robolab
- id: lemon
  registry_name: lemon_02_fruits_veggies_robolab
- id: apple
  registry_name: apple_02_objaverse_robolab
- id: wooden_bowl
  registry_name: wooden_bowl_hot3d_robolab
  params:
    scale: [1.15, 1.15, 0.6]
object_references:
- id: floor
  parent_id: kitchen
  prim_path: floor_room/geometry
  object_type: base
- id: counter_top
  parent_id: kitchen
  prim_path: counter_main_main_group/top_geometry_right
  object_type: base
# Sample within alignment bands instead of pulling each layout to a single offset.
relations:
- kind: is_anchor
  subject: floor
- kind: is_anchor
  subject: counter_top
- kind: 'on'
  subject: droid
  reference: floor
- kind: align_with
  subject: droid
  reference: counter_top
  params:
    axis: y
    offset_m: -1.0
    tolerance_m: 0.05
- kind: rotate_around_solution
  subject: droid
  params:
    yaw_rad: 1.57
- kind: 'on'
  subject: lime
  reference: counter_top
- kind: 'on'
  subject: lemon
  reference: counter_top
- kind: 'on'
  subject: apple
  reference: counter_top
- kind: 'on'
  subject: wooden_bowl
  reference: counter_top
- kind: position_limits_box
  subject: wooden_bowl
  params:
    x_min: 3.5
    x_max: 3.95
    y_min: -0.41
    y_max: -0.23
- kind: align_with
  subject: lime
  reference: wooden_bowl
  params:
    axis: x
    tolerance_m: 0.1
- kind: align_with
  subject: lime
  reference: wooden_bowl
  params:
    axis: y
    offset_m: -0.23
    tolerance_m: 0.05
- kind: align_with
  subject: lemon
  reference: lime
  params:
    axis: x
    offset_m: -0.12
    tolerance_m: 0.05
- kind: align_with
  subject: lemon
  reference: lime
  params:
    axis: y
    tolerance_m: 0.1
- kind: align_with
  subject: apple
  reference: lime
  params:
    axis: x
    offset_m: 0.12
    tolerance_m: 0.05
- kind: align_with
  subject: apple
  reference: lime
  params:
    axis: y
    tolerance_m: 0.1
- kind: align_with
  subject: droid
  reference: wooden_bowl
  params:
    axis: x
    tolerance_m: 0.12
task:
  composition: parallel
  description: Put all three fruits, the lime, lemon and apple, into the wooden bowl.
  subtasks:
  - kind: PickAndPlaceTask
    params:
      pick_up_object: lime
      destination_location: wooden_bowl
      destination_object: wooden_bowl
      background_scene: kitchen
  - kind: PickAndPlaceTask
    params:
      pick_up_object: lemon
      destination_location: wooden_bowl
      destination_object: wooden_bowl
      background_scene: kitchen
  - kind: PickAndPlaceTask
    params:
      pick_up_object: apple
      destination_location: wooden_bowl
      destination_object: wooden_bowl
      background_scene: kitchen
placer_params:
  # Fail placement if no layout passes validation instead of using a rejected layout.
  allow_best_loss_fallbacks: false

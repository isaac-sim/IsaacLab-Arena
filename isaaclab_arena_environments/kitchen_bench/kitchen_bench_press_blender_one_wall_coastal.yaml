env_name: kitchen_bench_press_blender_one_wall_coastal
embodiment:
  id: droid
  registry_name: droid_abs_joint_pos
  params:
    stand_height_m: 0.6
    placement_bbox_stand_only: true
    collision_mode: mesh
background:
  id: kitchen
  registry_name: lightwheel_kitchen_one_wall_coastal
  params:
    collision_mode: mesh
objects:
- id: appliance
  registry_name: lightwheel_blender004
- id: distractor_1
  registry_name: banana_ycb_robolab
- id: distractor_2
  registry_name: orange_01_fruits_veggies_robolab
- id: distractor_3
  registry_name: lemon_01_fruits_veggies_robolab
- id: distractor_4
  registry_name: mug
object_references:
- id: floor
  parent_id: kitchen
  prim_path: floor_room/geometry
  object_type: base
- id: counter
  parent_id: kitchen
  prim_path: counter_main_main_group
  object_type: base
- id: sink
  parent_id: kitchen
  prim_path: sink_main_group
  object_type: base
  params:
    collision_mode: bbox
relations:
- kind: is_anchor
  subject: floor
- kind: is_anchor
  subject: counter
- kind: is_anchor
  subject: sink
- kind: 'on'
  subject: appliance
  reference: counter
- kind: rotate_around_solution
  subject: appliance
  params:
    yaw_rad: -0.73715
    max_random_yaw_rad: 0.35
- kind: 'on'
  subject: droid
  reference: floor
- kind: rotate_around_solution
  subject: droid
  params:
    yaw_rad: 1.45
    max_random_yaw_rad: 0.15
- kind: position_limits_box
  subject: appliance
  params:
    x_limits:
    - 1.6
    - 2.5
    y_limits:
    - -0.48
    - -0.32
- kind: align_with
  subject: droid
  reference: appliance
  params:
    axis: x
    offset_m: -0.12
    tolerance_m: 0.25
- kind: align_with
  subject: droid
  reference: appliance
  params:
    axis: y
    offset_m: -1.1
    tolerance_m: 0.1
- kind: 'on'
  subject: distractor_1
  reference: counter
- kind: align_with
  subject: distractor_1
  reference: appliance
  params:
    axis: x
    tolerance_m: 0.6
- kind: align_with
  subject: distractor_1
  reference: appliance
  params:
    axis: y
    offset_m: 0
    tolerance_m: 0.1
- kind: 'on'
  subject: distractor_2
  reference: counter
- kind: align_with
  subject: distractor_2
  reference: appliance
  params:
    axis: x
    tolerance_m: 0.6
- kind: align_with
  subject: distractor_2
  reference: appliance
  params:
    axis: y
    offset_m: 0
    tolerance_m: 0.1
- kind: 'on'
  subject: distractor_3
  reference: counter
- kind: align_with
  subject: distractor_3
  reference: appliance
  params:
    axis: x
    tolerance_m: 0.6
- kind: align_with
  subject: distractor_3
  reference: appliance
  params:
    axis: y
    offset_m: 0
    tolerance_m: 0.1
- kind: 'on'
  subject: distractor_4
  reference: counter
- kind: align_with
  subject: distractor_4
  reference: appliance
  params:
    axis: x
    tolerance_m: 0.6
- kind: align_with
  subject: distractor_4
  reference: appliance
  params:
    axis: y
    offset_m: 0
    tolerance_m: 0.1
task:
  composition: atomic
  description: Press the power button to the right of the blender's speed dial.
  subtasks:
  - kind: PressButtonTask
    params:
      pressable_object: appliance

env_name: kitchen_bench_lightwheel_place_bananas_in_wooden_bowl_u_shaped_with_island_farmhouse2
embodiment:
  id: droid
  registry_name: droid_abs_joint_pos
  params:
    stand_height_m: 0.8
    placement_bbox_stand_only: true
    collision_mode: mesh
background:
  id: kitchen
  registry_name: lightwheel_kitchen_u_shaped_with_island_farmhouse2
  params:
    collision_mode: mesh
objects:
- id: banana_1
  registry_name: banana_ycb_robolab
- id: banana_2
  registry_name: banana_ycb_robolab
- id: plate
  registry_name: plate_large_vomp_robolab
- id: wooden_bowl
  registry_name: wooden_bowl_hot3d_robolab
- id: apple
  registry_name: apple_01_objaverse_robolab
- id: orange
  registry_name: orange_01_fruits_veggies_robolab
object_references:
- id: floor
  parent_id: kitchen
  prim_path: floor_room/geometry
  object_type: base
- id: island
  parent_id: kitchen
  prim_path: island_island_group/top_geometry_right
  object_type: base
relations:
- kind: is_anchor
  subject: floor
- kind: is_anchor
  subject: island
- kind: 'on'
  subject: droid
  reference: floor
- kind: next_to
  subject: droid
  reference: island
  params:
    side: negative_x
- kind: 'on'
  subject: plate
  reference: island
- kind: 'on'
  subject: banana_1
  reference: plate
- kind: 'on'
  subject: banana_2
  reference: plate
- kind: 'on'
  subject: wooden_bowl
  reference: island
- kind: next_to
  subject: wooden_bowl
  reference: plate
  params:
    side: negative_x
- kind: 'on'
  subject: apple
  reference: island
- kind: 'on'
  subject: orange
  reference: island
task:
  composition: parallel
  description: Pick up both bananas from the plate and place them into the wooden
    bowl in either order.
  subtasks:
  - kind: PickAndPlaceTask
    params:
      pick_up_object: banana_1
      destination_location: wooden_bowl
      destination_object: wooden_bowl
      background_scene: kitchen
  - kind: PickAndPlaceTask
    params:
      pick_up_object: banana_2
      destination_location: wooden_bowl
      destination_object: wooden_bowl
      background_scene: kitchen

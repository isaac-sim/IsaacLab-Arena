env_name: kitchen_bench_multi_object_two_pastries_on_plate_peninsula
embodiment:
  id: droid
  registry_name: droid_abs_joint_pos
  params:
    stand_height_m: 0.8
    placement_bbox_stand_only: true
    collision_mode: mesh
background:
  id: kitchen
  registry_name: replicator_kitchen_peninsula
  params:
    collision_mode: mesh
objects:
- id: croissant
  registry_name: simready_usd_object
  params:
    usd_path: https://huggingface.co/datasets/nvidia/simready-assets/resolve/653d91e182011f357cf1644013cc94ddf194d349/food_prepared_croissant_a01/simready_usd/sm_food_prepared_croissant_a01_01.usd
- id: pastry
  registry_name: simready_usd_object
  params:
    usd_path: https://huggingface.co/datasets/nvidia/simready-assets/resolve/653d91e182011f357cf1644013cc94ddf194d349/food_packaged_bread_danish_c01/simready_usd/sm_food_packaged_bread_danish_c01_01.usd
    scale: [0.8, 0.8, 0.8]
- id: plate
  registry_name: simready_usd_object
  params:
    usd_path: https://huggingface.co/datasets/ForgeCAD/simready-assets/resolve/0573053fa2c9174ca2a4678a462ec4dfd3035d59/plate/simready_usd/plate.usda
    scale: [1.25, 1.25, 1]
- id: orange
  registry_name: orange_01_fruits_veggies_robolab
- id: coffee_mug
  registry_name: mug_hot3d_robolab
object_references:
- id: floor
  parent_id: kitchen
  prim_path: KitchenRoom/Floor
  object_type: base
- id: counter
  parent_id: kitchen
  prim_path: CapSurface_02
  object_type: base
relations:
- kind: is_anchor
  subject: floor
- kind: is_anchor
  subject: counter
- kind: 'on'
  subject: droid
  reference: floor
- kind: align_with
  subject: droid
  reference: counter
  params:
    axis: y
    offset_m: 1.1783
    tolerance_m: 0.1
- kind: rotate_around_solution
  subject: droid
  params:
    yaw_rad: -1.5707963268
- kind: 'on'
  subject: croissant
  reference: counter
- kind: 'on'
  subject: pastry
  reference: counter
- kind: 'on'
  subject: plate
  reference: counter
- kind: 'on'
  subject: orange
  reference: counter
- kind: 'on'
  subject: coffee_mug
  reference: counter
- kind: align_with
  subject: croissant
  reference: droid
  params:
    axis: x
    tolerance_m: 0.3
- kind: align_with
  subject: croissant
  reference: droid
  params:
    axis: y
    offset_m: -1.03
    tolerance_m: 0.15
- kind: align_with
  subject: pastry
  reference: droid
  params:
    axis: x
    tolerance_m: 0.3
- kind: align_with
  subject: pastry
  reference: droid
  params:
    axis: y
    offset_m: -1.03
    tolerance_m: 0.15
- kind: align_with
  subject: plate
  reference: droid
  params:
    axis: x
    tolerance_m: 0.3
- kind: align_with
  subject: plate
  reference: droid
  params:
    axis: y
    offset_m: -1.03
    tolerance_m: 0.15
task:
  composition: parallel
  description: Put the croissant and the Danish pastry onto the plate.
  subtasks:
  - kind: PickAndPlaceTask
    params:
      pick_up_object: croissant
      destination_location: plate
      destination_object: plate
      background_scene: kitchen
  - kind: PickAndPlaceTask
    params:
      pick_up_object: pastry
      destination_location: plate
      destination_object: plate
      background_scene: kitchen

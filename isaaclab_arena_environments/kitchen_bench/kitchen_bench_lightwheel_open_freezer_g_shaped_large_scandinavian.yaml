env_name: kitchen_bench_lightwheel_open_freezer_g_shaped_large_scandinavian
embodiment:
  id: droid
  registry_name: droid_abs_joint_pos
  params:
    stand_height_m: 0.8
    placement_bbox_stand_only: true
    collision_mode: mesh
background:
  id: kitchen
  registry_name: lightwheel_kitchen_g_shaped_large_scandinavian
  params:
    collision_mode: mesh
    repair_collision_mesh_non_watertight: false
objects: []
object_references:
- id: floor
  parent_id: kitchen
  prim_path: floor_room/geometry
  object_type: base
  params: {}
- id: fridge
  parent_id: kitchen
  prim_path: fridge_right_group
  object_type: articulation
  params:
    openable_joint_name: freezer_door_joint
relations:
- kind: is_anchor
  subject: floor
  params: {}
- kind: is_anchor
  subject: fridge
  params: {}
- kind: 'on'
  subject: droid
  reference: floor
  params: {}
- kind: next_to
  subject: droid
  reference: fridge
  params:
    side: negative_x
    distance_m: 0.6
- kind: rotate_around_solution
  subject: droid
  params:
    yaw_rad: 0.0
task:
  composition: atomic
  description: Open the freezer door.
  subtasks:
  - kind: OpenDoorTask
    params:
      openable_object: fridge
      openness_threshold: 0.4
      reset_openness: 0.0

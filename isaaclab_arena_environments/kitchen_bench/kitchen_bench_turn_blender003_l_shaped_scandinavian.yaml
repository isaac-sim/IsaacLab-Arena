env_name: kitchen_bench_turn_blender003_l_shaped_scandinavian
tags:
- turn_knob
embodiment:
  id: droid
  registry_name: droid_abs_joint_pos
  params:
    stand_height_m: 0.65
    placement_bbox_stand_only: true
    collision_mode: mesh
background:
  id: kitchen
  registry_name: lightwheel_kitchen_l_shaped_scandinavian
  params:
    collision_mode: mesh
objects:
- id: appliance
  registry_name: lightwheel_blender003
- id: distractor_1
  registry_name: orange_02_fruits_veggies_robolab
- id: distractor_2
  registry_name: lemon_01_fruits_veggies_robolab
object_references:
- id: floor
  parent_id: kitchen
  prim_path: floor_room/geometry
  object_type: base
- id: counter
  parent_id: kitchen
  prim_path: counter_main_main_group
  object_type: base
- id: sink
  parent_id: kitchen
  prim_path: sink_main_group
  object_type: base
  params:
    collision_mode: bbox
relations:
- kind: is_anchor
  subject: floor
- kind: is_anchor
  subject: counter
- kind: is_anchor
  subject: sink
- kind: 'on'
  subject: appliance
  reference: counter
- kind: rotate_around_solution
  subject: appliance
  params:
    yaw_rad: 0
- kind: position_limits_box
  subject: appliance
  params:
    x_limits: [3.1, 4.3]
    y_limits: [-0.55, -0.35]
- kind: 'on'
  subject: droid
  reference: floor
- kind: rotate_around_solution
  subject: droid
  params:
    yaw_rad: 1.73
- kind: align_with
  subject: droid
  reference: appliance
  params:
    axis: x
    offset_m: 0.15
    tolerance_m: 0.15
- kind: align_with
  subject: droid
  reference: appliance
  params:
    axis: y
    offset_m: -1.03
    tolerance_m: 0.07
- kind: 'on'
  subject: distractor_1
  reference: counter
- kind: align_with
  subject: distractor_1
  reference: appliance
  params:
    axis: x
    tolerance_m: 0.6
- kind: align_with
  subject: distractor_1
  reference: appliance
  params:
    axis: y
    tolerance_m: 0.1
- kind: 'on'
  subject: distractor_2
  reference: counter
- kind: align_with
  subject: distractor_2
  reference: appliance
  params:
    axis: x
    tolerance_m: 0.6
- kind: align_with
  subject: distractor_2
  reference: appliance
  params:
    axis: y
    tolerance_m: 0.1
task:
  composition: atomic
  description: Turn the silver speed dial near the bottom of the black blender clockwise.
  subtasks:
  - kind: TurnKnobTask
    params:
      turnable_object: appliance
      target_level: 1
      reset_level: -1

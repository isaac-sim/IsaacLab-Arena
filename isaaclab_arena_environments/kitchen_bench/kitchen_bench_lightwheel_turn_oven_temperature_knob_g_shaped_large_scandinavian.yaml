env_name: kitchen_bench_lightwheel_turn_oven_temperature_knob_g_shaped_large_scandinavian
embodiment:
  id: droid
  registry_name: droid_abs_joint_pos
  params:
    stand_height_m: 0.7
    placement_bbox_stand_only: true
    collision_mode: mesh
background:
  id: kitchen
  registry_name: lightwheel_kitchen_g_shaped_large_scandinavian
  params:
    collision_mode: mesh
    repair_collision_mesh_non_watertight: false
objects: []
object_references:
- id: floor
  parent_id: kitchen
  prim_path: floor_room/geometry
  object_type: base
  params: {}
- id: oven_temperature_knob
  parent_id: kitchen
  prim_path: oven_right_group
  object_type: articulation
  params:
    turnable_joint_name: knob_temp_joint
    min_level_angle_deg: 30.0
    max_level_angle_deg: 150.0
    num_levels: 5
relations:
- kind: is_anchor
  subject: floor
  params: {}
- kind: is_anchor
  subject: oven_temperature_knob
  params: {}
- kind: 'on'
  subject: droid
  reference: floor
  params: {}
- kind: next_to
  subject: droid
  reference: oven_temperature_knob
  params:
    side: negative_x
    distance_m: 0.45
- kind: rotate_around_solution
  subject: droid
  params:
    yaw_rad: 0.0
task:
  composition: atomic
  description: Turn the large temperature knob on the right side of the oven below the microwave to level 3.
  subtasks:
  - kind: TurnKnobTask
    params:
      turnable_object: oven_temperature_knob
      target_level: 3
      reset_level: -1

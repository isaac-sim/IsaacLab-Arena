env_name: kitchen_bench_multi_object_two_mugs_on_tray_g_shape
embodiment:
  id: droid
  registry_name: droid_abs_joint_pos
  params:
    stand_height_m: 0.8
    placement_bbox_stand_only: true
    collision_mode: mesh
background:
  id: kitchen
  registry_name: replicator_kitchen_g_shape
  params:
    collision_mode: mesh
objects:
- id: mug_one
  registry_name: simready_usd_object
  params:
    usd_path: https://huggingface.co/datasets/nvidia/simready-assets/resolve/653d91e182011f357cf1644013cc94ddf194d349/kitchenware_mug_k01/simready_usd/sm_kitchenware_mug_k01_01.usd
    scale: [0.9, 0.9, 0.9]
- id: mug_two
  registry_name: simready_usd_object
  params:
    usd_path: https://huggingface.co/datasets/nvidia/simready-assets/resolve/653d91e182011f357cf1644013cc94ddf194d349/kitchenware_mug_o01/simready_usd/sm_kitchenware_mug_o01_01.usd
    scale: [0.9, 0.9, 0.9]
- id: tray
  registry_name: simready_usd_object
  params:
    usd_path: https://huggingface.co/datasets/nvidia/simready-assets/resolve/653d91e182011f357cf1644013cc94ddf194d349/kitchenware_tray_a01/simready_usd/sm_kitchenware_tray_a01_01.usd
- id: spoon
  registry_name: spoon_big_vomp_robolab
- id: sugar
  registry_name: sugar_box_ycb_robolab
object_references:
- id: floor
  parent_id: kitchen
  prim_path: KitchenRoom/Floor
  object_type: base
- id: counter
  parent_id: kitchen
  prim_path: CornerCounter_00_0
  object_type: base
relations:
- kind: is_anchor
  subject: floor
- kind: is_anchor
  subject: counter
- kind: 'on'
  subject: droid
  reference: floor
- kind: align_with
  subject: droid
  reference: counter
  params:
    axis: y
    offset_m: -0.9416
    tolerance_m: 0.1
- kind: rotate_around_solution
  subject: droid
  params:
    yaw_rad: 1.5707963268
- kind: 'on'
  subject: mug_one
  reference: counter
- kind: 'on'
  subject: mug_two
  reference: counter
- kind: 'on'
  subject: tray
  reference: counter
- kind: 'on'
  subject: spoon
  reference: counter
- kind: 'on'
  subject: sugar
  reference: counter
- kind: align_with
  subject: mug_one
  reference: droid
  params:
    axis: x
    tolerance_m: 0.3
- kind: align_with
  subject: mug_one
  reference: droid
  params:
    axis: y
    offset_m: 1.03
    tolerance_m: 0.15
- kind: align_with
  subject: mug_two
  reference: droid
  params:
    axis: x
    tolerance_m: 0.3
- kind: align_with
  subject: mug_two
  reference: droid
  params:
    axis: y
    offset_m: 1.03
    tolerance_m: 0.15
- kind: align_with
  subject: tray
  reference: droid
  params:
    axis: x
    tolerance_m: 0.3
- kind: align_with
  subject: tray
  reference: droid
  params:
    axis: y
    offset_m: 1.03
    tolerance_m: 0.15
task:
  composition: parallel
  description: Put both mugs onto the serving tray.
  subtasks:
  - kind: PickAndPlaceTask
    params:
      pick_up_object: mug_one
      destination_location: tray
      destination_object: tray
      background_scene: kitchen
  - kind: PickAndPlaceTask
    params:
      pick_up_object: mug_two
      destination_location: tray
      destination_object: tray
      background_scene: kitchen

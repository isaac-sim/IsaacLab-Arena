env_name: droid_open_dishwasher
embodiment:
  id: droid
  registry_name: droid_abs_joint_pos
  params:
    stand_height_m: 0.4
    placement_bbox_stand_only: true
    collision_mode: mesh
background:
  id: kitchen
  registry_name: lightwheel_kitchen_g_shaped_large_scandinavian
  params:
    collision_mode: mesh
    repair_collision_mesh_non_watertight: false
objects: []
object_references:
- id: floor
  parent_id: kitchen
  prim_path: floor_room/geometry
  object_type: base
  params: {}
- id: dishwasher
  parent_id: kitchen
  prim_path: dishwasher_left_group
  object_type: articulation
  params:
    openable_joint_name: door_joint
relations:
- kind: is_anchor
  subject: floor
  params: {}
- kind: is_anchor
  subject: dishwasher
  params: {}
- kind: 'on'
  subject: droid
  reference: floor
  params: {}
- kind: next_to
  subject: droid
  reference: dishwasher
  params:
    side: positive_y
    distance_m: 0.1
- kind: rotate_around_solution
  subject: droid
  params:
    yaw_rad: 3.14
task:
  composition: atomic
  description: Open the dishwasher door to 0.4 openness.
  subtasks:
  - kind: OpenDoorTask
    params:
      openable_object: dishwasher
      openness_threshold: 0.4

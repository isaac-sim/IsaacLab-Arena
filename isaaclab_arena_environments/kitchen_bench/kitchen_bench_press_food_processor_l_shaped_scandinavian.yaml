env_name: kitchen_bench_press_food_processor_l_shaped_scandinavian
embodiment:
  id: droid
  registry_name: droid_abs_joint_pos
  params:
    stand_height_m: 0.65
    placement_bbox_stand_only: true
    collision_mode: mesh
background:
  id: kitchen
  registry_name: lightwheel_kitchen_l_shaped_scandinavian
  params:
    collision_mode: mesh
objects:
- id: appliance
  registry_name: pressable_appliance
  params:
    pressable_joint_name: pulse
    usd_path: https://huggingface.co/datasets/ForgeCAD/simready-assets/resolve/40fc7f16ea2281eea966efb3c9b02f929205f3ea/food_processor/simready_usd/food_processor.usda
- id: distractor_1
  registry_name: orange_02_fruits_veggies_robolab
- id: distractor_2
  registry_name: lemon_01_fruits_veggies_robolab
object_references:
- id: floor
  parent_id: kitchen
  prim_path: floor_room/geometry
  object_type: base
- id: counter
  parent_id: kitchen
  prim_path: counter_main_main_group
  object_type: base
relations:
- kind: is_anchor
  subject: floor
- kind: is_anchor
  subject: counter
- kind: 'on'
  subject: appliance
  reference: counter
- kind: rotate_around_solution
  subject: appliance
  params:
    yaw_rad: 0.28034
- kind: 'on'
  subject: droid
  reference: floor
- kind: rotate_around_solution
  subject: droid
  params:
    yaw_rad: 1.73
- kind: position_limits_box
  subject: appliance
  params:
    x_limits:
    - 3.62
    - 3.78
    y_limits:
    - -0.45
    - -0.35
- kind: align_with
  subject: droid
  reference: appliance
  params:
    axis: x
    offset_m: 0.15
    tolerance_m: 0.1
- kind: align_with
  subject: droid
  reference: appliance
  params:
    axis: y
    offset_m: -1.13
    tolerance_m: 0.07
- kind: 'on'
  subject: distractor_1
  reference: counter
- kind: align_with
  subject: distractor_1
  reference: appliance
  params:
    axis: x
    offset_m: 0.36
    tolerance_m: 0.05
- kind: align_with
  subject: distractor_1
  reference: appliance
  params:
    axis: y
    offset_m: 0
    tolerance_m: 0.05
- kind: 'on'
  subject: distractor_2
  reference: counter
- kind: align_with
  subject: distractor_2
  reference: appliance
  params:
    axis: x
    offset_m: 0.58
    tolerance_m: 0.05
- kind: align_with
  subject: distractor_2
  reference: appliance
  params:
    axis: y
    offset_m: 0
    tolerance_m: 0.05
task:
  composition: atomic
  description: Press the rectangular pulse button on the base of the food processor.
  subtasks:
  - kind: PressButtonTask
    params:
      pressable_object: appliance

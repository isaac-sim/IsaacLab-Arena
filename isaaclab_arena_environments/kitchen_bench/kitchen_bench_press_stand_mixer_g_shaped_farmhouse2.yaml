env_name: kitchen_bench_press_stand_mixer_g_shaped_farmhouse2
embodiment:
  id: droid
  registry_name: droid_abs_joint_pos
  params:
    stand_height_m: 0.65
    placement_bbox_stand_only: true
    collision_mode: mesh
background:
  id: kitchen
  registry_name: lightwheel_kitchen_g_shaped_farmhouse2
  params:
    collision_mode: mesh
objects:
- id: appliance
  registry_name: lightwheel_stand_mixer012
- id: distractor_1
  registry_name: orange_02_fruits_veggies_robolab
- id: distractor_2
  registry_name: lemon_01_fruits_veggies_robolab
- id: distractor_3
  registry_name: lime01_fruits_veggies_robolab
- id: distractor_4
  registry_name: banana_ycb_robolab
object_references:
- id: floor
  parent_id: kitchen
  prim_path: floor_room/geometry
  object_type: base
- id: counter
  parent_id: kitchen
  prim_path: counter_1_front_group
  object_type: base
relations:
- kind: is_anchor
  subject: floor
- kind: is_anchor
  subject: counter
- kind: 'on'
  subject: appliance
  reference: counter
- kind: rotate_around_solution
  subject: appliance
  params:
    yaw_rad: -1.84
    max_random_yaw_rad: 0.25
- kind: 'on'
  subject: droid
  reference: floor
- kind: rotate_around_solution
  subject: droid
  params:
    yaw_rad: -1.571
    max_random_yaw_rad: 0.15
- kind: position_limits_box
  subject: appliance
  params:
    x_limits:
    - 2.4
    - 3.1
    y_limits:
    - -3.22
    - -3.13
- kind: align_with
  subject: droid
  reference: appliance
  params:
    axis: x
    offset_m: 0.0
    tolerance_m: 0.25
- kind: align_with
  subject: droid
  reference: appliance
  params:
    axis: y
    offset_m: 1.22
    tolerance_m: 0.1
- kind: 'on'
  subject: distractor_1
  reference: counter
- kind: position_limits_box
  subject: distractor_1
  params:
    x_limits:
    - 1.88
    - 3.62
    y_limits:
    - -3.42
    - -2.93
- kind: 'on'
  subject: distractor_2
  reference: counter
- kind: position_limits_box
  subject: distractor_2
  params:
    x_limits:
    - 1.88
    - 3.62
    y_limits:
    - -3.42
    - -2.93
- kind: 'on'
  subject: distractor_3
  reference: counter
- kind: position_limits_box
  subject: distractor_3
  params:
    x_limits:
    - 1.88
    - 3.62
    y_limits:
    - -3.42
    - -2.93
- kind: 'on'
  subject: distractor_4
  reference: counter
- kind: position_limits_box
  subject: distractor_4
  params:
    x_limits:
    - 1.88
    - 3.62
    y_limits:
    - -3.42
    - -2.93
task:
  composition: atomic
  description: Press the head-lock button on the left side of the stand mixer.
  subtasks:
  - kind: PressButtonTask
    params:
      pressable_object: appliance

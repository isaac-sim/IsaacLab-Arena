env_name: kitchen_bench_replicator_g_shape_banana_and_orange_in_bowl
embodiment:
  id: droid
  registry_name: droid_abs_joint_pos
  params:
    stand_height_m: 0.8
    placement_bbox_stand_only: true
background:
  id: kitchen
  registry_name: replicator_kitchen_g_shape
  params:
    collision_mode: mesh
objects:
- id: banana
  registry_name: banana_ycb_robolab
- id: orange
  registry_name: orange_01_fruits_veggies_robolab
- id: wooden_bowl
  registry_name: wooden_bowl_hot3d_robolab
object_references:
- id: floor
  parent_id: kitchen
  prim_path: KitchenRoom/Floor
  object_type: base
- id: corner_counter
  parent_id: kitchen
  prim_path: CornerCounter_00_0
  object_type: base
# Sample within alignment bands instead of pulling each layout to a single offset.
relations:
- kind: is_anchor
  subject: floor
- kind: is_anchor
  subject: corner_counter
- kind: 'on'
  subject: droid
  reference: floor
- kind: align_with
  subject: droid
  reference: corner_counter
  params:
    axis: y
    offset_m: -0.99
    tolerance_m: 0.05
- kind: rotate_around_solution
  subject: droid
  params:
    yaw_rad: 1.57
- kind: 'on'
  subject: banana
  reference: corner_counter
- kind: 'on'
  subject: orange
  reference: corner_counter
- kind: 'on'
  subject: wooden_bowl
  reference: corner_counter
- kind: position_limits_box
  subject: wooden_bowl
  params:
    x_min: -1.89
    x_max: -1.55
    y_min: 2.07
    y_max: 2.21
- kind: align_with
  subject: banana
  reference: wooden_bowl
  params:
    axis: x
    offset_m: -0.25
    tolerance_m: 0.05
- kind: align_with
  subject: banana
  reference: wooden_bowl
  params:
    axis: y
    offset_m: -0.1
    tolerance_m: 0.06
- kind: align_with
  subject: orange
  reference: banana
  params:
    axis: x
    tolerance_m: 0.1
- kind: align_with
  subject: orange
  reference: banana
  params:
    axis: y
    offset_m: 0.23
    tolerance_m: 0.05
- kind: align_with
  subject: droid
  reference: wooden_bowl
  params:
    axis: x
    tolerance_m: 0.12
task:
  composition: parallel
  description: Pick up the banana and the orange and place both fruits into the wooden bowl in either
    order.
  subtasks:
  - kind: PickAndPlaceTask
    params:
      pick_up_object: banana
      destination_location: wooden_bowl
      destination_object: wooden_bowl
      background_scene: kitchen
  - kind: PickAndPlaceTask
    params:
      pick_up_object: orange
      destination_location: wooden_bowl
      destination_object: wooden_bowl
      background_scene: kitchen

env_name: kitchen_bench_replicator_g_shape_banana_and_orange_in_bowl
embodiment:
  id: droid
  registry_name: droid_abs_joint_pos
  params:
    stand_height_m: 0.8
    placement_bbox_stand_only: true
background:
  id: kitchen
  registry_name: replicator_kitchen_g_shape
  params:
    collision_mode: mesh
objects:
- id: banana
  registry_name: banana_ycb_robolab
  params: {}
- id: orange
  registry_name: orange_01_fruits_veggies_robolab
  params: {}
- id: wooden_bowl
  registry_name: wooden_bowl_hot3d_robolab
  params: {}
object_references:
- id: floor
  parent_id: kitchen
  prim_path: KitchenRoom/Floor
  object_type: base
  params: {}
- id: corner_counter
  parent_id: kitchen
  prim_path: CornerCounter_00_0
  object_type: base
  params: {}
relations:
- kind: is_anchor
  subject: floor
  params: {}
- kind: is_anchor
  subject: corner_counter
  params: {}
- kind: 'on'
  subject: droid
  reference: floor
  params: {}
- kind: next_to
  subject: droid
  reference: corner_counter
  params:
    side: negative_y
    distance_m: 0.15
    tolerance_m: 0.15
- kind: rotate_around_solution
  subject: droid
  params:
    yaw_rad: 1.57
- kind: 'on'
  subject: banana
  reference: corner_counter
  params: {}
- kind: 'on'
  subject: orange
  reference: corner_counter
  params: {}
- kind: 'on'
  subject: wooden_bowl
  reference: corner_counter
  params: {}
task:
  composition: parallel
  description: Pick up the banana and the orange and place both fruits into the wooden bowl in either
    order.
  subtasks:
  - kind: PickAndPlaceTask
    params:
      pick_up_object: banana
      destination_location: wooden_bowl
      destination_object: wooden_bowl
      background_scene: kitchen
      episode_length_s: 70.0
  - kind: PickAndPlaceTask
    params:
      pick_up_object: orange
      destination_location: wooden_bowl
      destination_object: wooden_bowl
      background_scene: kitchen
      episode_length_s: 70.0

# Render once per DROID control step (8 physics steps).
env_cfg_override:
  sim:
    render_interval: 8

env_name: kitchen_bench_lightwheel_press_left_toaster_cancel_button_g_shaped_large_scandinavian
embodiment:
  id: droid
  registry_name: droid_abs_joint_pos
  params:
    stand_height_m: 0.8
    placement_bbox_stand_only: true
    collision_mode: mesh
background:
  id: kitchen
  registry_name: lightwheel_kitchen_g_shaped_large_scandinavian
  params:
    collision_mode: mesh
    repair_collision_mesh_non_watertight: false
objects: []
object_references:
- id: floor
  parent_id: kitchen
  prim_path: floor_room/geometry
  object_type: base
  params: {}
- id: toaster
  parent_id: kitchen
  prim_path: toaster_main_group
  object_type: articulation
  params:
    pressable_joint_name: sideL_button_cancel_joint
relations:
- kind: is_anchor
  subject: floor
  params: {}
- kind: is_anchor
  subject: toaster
  params: {}
- kind: 'on'
  subject: droid
  reference: floor
  params: {}
- kind: next_to
  subject: droid
  reference: toaster
  params:
    side: negative_y
    distance_m: 0.4
- kind: rotate_around_solution
  subject: droid
  params:
    yaw_rad: 1.57
task:
  composition: atomic
  description: Press and hold the left cancel button on the toaster.
  subtasks:
  - kind: PressButtonTask
    params:
      pressable_object: toaster

env_name: kitchen_bench_lightwheel_pick_and_place
embodiment:
  id: droid
  registry_name: droid_abs_joint_pos
  params:
    stand_height_m: 0.8
    placement_bbox_stand_only: true
    collision_mode: mesh
background:
  id: kitchen
  registry_name: lightwheel_kitchen_one_wall_coastal
  params:
    collision_mode: mesh
objects:
- id: mustard_bottle
  registry_name: mustard_bottle_hope_robolab
- id: bowl
  registry_name: bowl_ycb_robolab
object_references:
- id: right_counter_top
  parent_id: kitchen
  prim_path: counter_main_main_group/top_geometry_right
  object_type: base
- id: floor
  parent_id: kitchen
  prim_path: floor_room/geometry
  object_type: base
relations:
- kind: is_anchor
  subject: floor
- kind: is_anchor
  subject: right_counter_top
- kind: 'on'
  subject: droid
  reference: floor
- kind: next_to
  subject: droid
  reference: right_counter_top
  params:
    side: negative_y
    distance_m: 0.3
- kind: rotate_around_solution
  subject: droid
  params:
    yaw_rad: 1.57
- kind: 'on'
  subject: mustard_bottle
  reference: right_counter_top
- kind: 'on'
  subject: bowl
  reference: right_counter_top
task:
  composition: atomic
  description: pick up the mustard bottle and place it in the bowl
  subtasks:
  - kind: PickAndPlaceTask
    params:
      pick_up_object: mustard_bottle
      destination_location: bowl
      background_scene: kitchen

env_name: kitchen_bench_multi_object_clear_two_cups_from_plate_l_island
embodiment:
  id: droid
  registry_name: droid_abs_joint_pos
  params:
    stand_height_m: 0.8
    placement_bbox_stand_only: true
    collision_mode: mesh
background:
  id: kitchen
  registry_name: replicator_kitchen_l_island
  params:
    collision_mode: mesh
objects:
- id: cup_one
  registry_name: simready_usd_object
  params:
    usd_path: https://huggingface.co/datasets/nvidia/simready-assets/resolve/653d91e182011f357cf1644013cc94ddf194d349/kitchenware_cup_b01/simready_usd/sm_kitchenware_cup_b01_01.usd
    scale: [0.9, 0.9, 0.9]
- id: cup_two
  registry_name: simready_usd_object
  params:
    usd_path: https://huggingface.co/datasets/nvidia/simready-assets/resolve/653d91e182011f357cf1644013cc94ddf194d349/kitchenware_cup_d01/simready_usd/sm_kitchenware_cup_d01_01.usd
- id: plate
  registry_name: simready_usd_object
  params:
    usd_path: https://huggingface.co/datasets/ForgeCAD/simready-assets/resolve/0573053fa2c9174ca2a4678a462ec4dfd3035d59/plate/simready_usd/plate.usda
    scale: [1.5, 1.5, 0.5]
- id: pepper
  registry_name: red_bell_pepper_objaverse_robolab
- id: bowl
  registry_name: wooden_bowl_hot3d_robolab
object_references:
- id: floor
  parent_id: kitchen
  prim_path: KitchenRoom/Floor
  object_type: base
- id: counter
  parent_id: kitchen
  prim_path: CapSurface_03
  object_type: base
relations:
- kind: is_anchor
  subject: floor
- kind: is_anchor
  subject: counter
- kind: 'on'
  subject: droid
  reference: floor
- kind: align_with
  subject: droid
  reference: counter
  params:
    axis: y
    offset_m: -1.0923
    tolerance_m: 0.1
- kind: rotate_around_solution
  subject: droid
  params:
    yaw_rad: 1.5707963268
- kind: 'on'
  subject: cup_one
  reference: plate
  params:
    edge_margin_m: 0.105
    clearance_m: 0.0
- kind: 'on'
  subject: cup_two
  reference: plate
  params:
    edge_margin_m: 0.105
    clearance_m: 0.0
- kind: 'on'
  subject: plate
  reference: counter
- kind: 'on'
  subject: pepper
  reference: counter
- kind: 'on'
  subject: bowl
  reference: counter
- kind: align_with
  subject: cup_one
  reference: droid
  params:
    axis: x
    tolerance_m: 0.3
- kind: align_with
  subject: cup_one
  reference: droid
  params:
    axis: y
    offset_m: 1.03
    tolerance_m: 0.15
- kind: align_with
  subject: cup_two
  reference: droid
  params:
    axis: x
    tolerance_m: 0.3
- kind: align_with
  subject: cup_two
  reference: droid
  params:
    axis: y
    offset_m: 1.03
    tolerance_m: 0.15
- kind: align_with
  subject: plate
  reference: droid
  params:
    axis: x
    tolerance_m: 0.3
- kind: align_with
  subject: plate
  reference: droid
  params:
    axis: y
    offset_m: 1.03
    tolerance_m: 0.15
task:
  composition: parallel
  description: Clear both cups from the plate and place them on the kitchen countertop.
  subtasks:
  - kind: PickAndPlaceTask
    params:
      pick_up_object: cup_one
      destination_location: counter
      destination_object: counter
      background_scene: kitchen
  - kind: PickAndPlaceTask
    params:
      pick_up_object: cup_two
      destination_location: counter
      destination_object: counter
      background_scene: kitchen

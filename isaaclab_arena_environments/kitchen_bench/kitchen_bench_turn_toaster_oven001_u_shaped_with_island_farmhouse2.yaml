env_name: kitchen_bench_turn_toaster_oven001_u_shaped_with_island_farmhouse2
embodiment:
  id: droid
  registry_name: droid_abs_joint_pos
  params:
    stand_height_m: 0.85
    placement_bbox_stand_only: true
    collision_mode: mesh
background:
  id: kitchen
  registry_name: lightwheel_kitchen_u_shaped_with_island_farmhouse2
  params:
    collision_mode: mesh
objects:
- id: appliance
  registry_name: turnable_appliance
  params:
    turnable_joint_name: knob_temp_joint
    min_level_angle_deg: 30.0
    max_level_angle_deg: 150.0
    num_levels: 5
    knob_damping: 0.05
    lightwheel_file_version: ec5bb3fb-d13d-4dcb-9f09-13ba76ade430
- id: distractor_1
  registry_name: plate_small_vomp_robolab
- id: distractor_2
  registry_name: mustard_bottle
object_references:
- id: floor
  parent_id: kitchen
  prim_path: floor_room/geometry
  object_type: base
- id: counter
  parent_id: kitchen
  prim_path: island_island_group
  object_type: base
relations:
- kind: is_anchor
  subject: floor
- kind: is_anchor
  subject: counter
- kind: 'on'
  subject: appliance
  reference: counter
- kind: rotate_around_solution
  subject: appliance
  params:
    yaw_rad: 0
- kind: 'on'
  subject: droid
  reference: floor
- kind: rotate_around_solution
  subject: droid
  params:
    yaw_rad: 1.4
- kind: position_limits_box
  subject: appliance
  params:
    x_limits: [3.62, 3.78]
    y_limits: [-3.21, -3.11]
- kind: align_with
  subject: droid
  reference: appliance
  params:
    axis: x
    offset_m: -0.14
    tolerance_m: 0.1
- kind: align_with
  subject: droid
  reference: appliance
  params:
    axis: y
    offset_m: -1.05
    tolerance_m: 0.07
- kind: 'on'
  subject: distractor_1
  reference: counter
- kind: align_with
  subject: distractor_1
  reference: appliance
  params:
    axis: x
    offset_m: -0.55
    tolerance_m: 0.05
- kind: align_with
  subject: distractor_1
  reference: appliance
  params:
    axis: y
    offset_m: 0
    tolerance_m: 0.05
- kind: 'on'
  subject: distractor_2
  reference: counter
- kind: align_with
  subject: distractor_2
  reference: appliance
  params:
    axis: x
    offset_m: -0.9
    tolerance_m: 0.05
- kind: align_with
  subject: distractor_2
  reference: appliance
  params:
    axis: y
    offset_m: 0
    tolerance_m: 0.05
task:
  composition: atomic
  description: Turn the middle temperature knob on the toaster oven clockwise to a
    low temperature.
  subtasks:
  - kind: TurnKnobTask
    params:
      turnable_object: appliance
      target_level: 0
      reset_level: -1

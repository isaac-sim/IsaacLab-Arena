env_name: droid_mustard_to_bowl_kitchen_l_island
embodiment:
  id: droid
  registry_name: droid_abs_joint_pos
  params:
    stand_height_m: 0.8
    placement_bbox_stand_only: true
background:
  id: kitchen
  registry_name: replicator_kitchen_l_island
  params:
    collision_mode: mesh
objects:
- id: mustard_bottle
  registry_name: mustard_bottle_hope_robolab
  params: {}
- id: bowl
  registry_name: bowl_ycb_robolab
  params: {}
object_references:
- id: floor
  parent_id: kitchen
  prim_path: KitchenRoom/Floor
  object_type: base
  params: {}
- id: island_top
  parent_id: kitchen
  prim_path: CapSurface_03
  object_type: base
  params: {}
relations:
- kind: is_anchor
  subject: floor
  params: {}
- kind: is_anchor
  subject: island_top
  params: {}
- kind: 'on'
  subject: droid
  reference: floor
  params: {}
- kind: next_to
  subject: droid
  reference: island_top
  params:
    side: negative_y
    distance_m: 0.15
    tolerance_m: 0.15
- kind: rotate_around_solution
  subject: droid
  params:
    yaw_rad: 1.57
- kind: 'on'
  subject: mustard_bottle
  reference: island_top
  params: {}
- kind: 'on'
  subject: bowl
  reference: island_top
  params: {}
task:
  composition: atomic
  description: pick up the mustard bottle and place it in the red bowl
  subtasks:
  - kind: PickAndPlaceTask
    params:
      pick_up_object: mustard_bottle
      destination_location: bowl
      background_scene: kitchen

env_name: kitchen_bench_spatial_sweet_potato_in_bowl_nearest_pepper_farmhouse
embodiment:
  id: droid
  registry_name: droid_abs_joint_pos
  params:
    stand_height_m: 0.8
    placement_bbox_stand_only: true
    collision_mode: mesh
background:
  id: kitchen
  registry_name: lightwheel_kitchen_u_shaped_with_island_farmhouse2
  params:
    collision_mode: mesh
objects:
- id: sweet_potato
  registry_name: sweet_potato
- id: target_bowl
  registry_name: bowl_ycb_robolab
- id: middle_bowl
  registry_name: bowl_ycb_robolab
- id: far_bowl
  registry_name: bowl_ycb_robolab
- id: pepper
  registry_name: red_bell_pepper_objaverse_robolab
- id: apple
  registry_name: apple_01_objaverse_robolab
object_references:
- id: floor
  parent_id: kitchen
  prim_path: floor_room/geometry
  object_type: base
- id: island
  parent_id: kitchen
  prim_path: island_island_group/top_geometry_right
  object_type: base
relations:
- kind: is_anchor
  subject: floor
- kind: is_anchor
  subject: island
- kind: 'on'
  subject: droid
  reference: floor
- kind: rotate_around_solution
  subject: droid
  params:
    yaw_rad: 0.0
- kind: 'on'
  subject: sweet_potato
  reference: island
- kind: 'on'
  subject: target_bowl
  reference: island
- kind: 'on'
  subject: middle_bowl
  reference: island
- kind: 'on'
  subject: far_bowl
  reference: island
- kind: 'on'
  subject: pepper
  reference: island
- kind: 'on'
  subject: apple
  reference: island
- kind: align_with
  subject: pepper
  reference: target_bowl
  params:
    axis: y
    offset_m: 0.22
    tolerance_m: 0.04
- kind: align_with
  subject: pepper
  reference: target_bowl
  params:
    axis: x
    offset_m: 0
    tolerance_m: 0.06
- kind: align_with
  subject: middle_bowl
  reference: target_bowl
  params:
    axis: y
    offset_m: -0.25
    tolerance_m: 0.04
- kind: align_with
  subject: middle_bowl
  reference: target_bowl
  params:
    axis: x
    offset_m: 0
    tolerance_m: 0.08
- kind: align_with
  subject: far_bowl
  reference: target_bowl
  params:
    axis: y
    offset_m: -0.5
    tolerance_m: 0.05
- kind: align_with
  subject: far_bowl
  reference: target_bowl
  params:
    axis: x
    offset_m: 0
    tolerance_m: 0.08
- kind: align_with
  subject: sweet_potato
  reference: target_bowl
  params:
    axis: x
    offset_m: -0.23
    tolerance_m: 0.05
- kind: align_with
  subject: sweet_potato
  reference: target_bowl
  params:
    axis: y
    offset_m: -0.12
    tolerance_m: 0.08
- kind: align_with
  subject: droid
  reference: island
  params:
    axis: x
    offset_m: -0.99
    tolerance_m: 0.06
- kind: align_with
  subject: target_bowl
  reference: island
  params:
    axis: x
    offset_m: -0.05
    tolerance_m: 0.12
- kind: align_with
  subject: droid
  reference: target_bowl
  params:
    axis: y
    offset_m: -0.1
    tolerance_m: 0.12
task:
  composition: atomic
  description: Pick up the sweet potato and put it in the bowl closest to the red bell pepper.
  subtasks:
  - kind: PickAndPlaceTask
    params:
      pick_up_object: sweet_potato
      destination_location: target_bowl
      destination_object: target_bowl
      background_scene: kitchen
